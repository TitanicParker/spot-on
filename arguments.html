<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111a"><title>100 Arguments — Spot On</title><style>:root{--bg:#09111a;--card:#101a25;--line:rgba(255,255,255,.09);--text:#f8fbff;--muted:#8c9baa;--blue:#7db7ff;--yellow:#f3d46a;--red:#f18b8b;--green:#8fd3b5;--shadow:0 30px 100px rgba(0,0,0,.48)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 18% 0%,rgba(55,94,155,.22),transparent 30rem),radial-gradient(circle at 90% 85%,rgba(130,62,62,.12),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:10px}.top{display:flex;align-items:center;gap:12px;min-height:44px}.brand{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}.brand b{color:#fff}.links{margin-left:auto;display:flex;gap:11px}.links a{font-size:12px;font-weight:760;color:var(--muted);text-decoration:none}.links a:hover{color:#fff}.actions{display:flex;gap:7px}.btn{height:36px;min-width:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dce5ec;cursor:pointer;font-weight:800}.stage{display:grid;place-items:center;min-height:0;perspective:1200px}.wrap{position:relative;width:min(860px,100%);height:min(84vh,910px);touch-action:pan-y}.card{position:absolute;inset:0;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;transition:transform .23s ease,opacity .2s ease}.meta{display:flex;align-items:center;gap:10px;padding:18px 22px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:850;color:rgba(255,255,255,.48)}.point{color:var(--blue)}.counter{margin-left:auto}.badge{padding:5px 8px;border:1px solid var(--line);border-radius:999px;text-transform:uppercase;letter-spacing:.09em;font-size:9px;color:var(--green)}.stack{padding:18px 22px 20px;display:grid;grid-template-rows:auto 1fr auto;gap:14px;min-height:0}.band{border-radius:18px;border:1px solid var(--line);padding:18px 20px}.blue{background:linear-gradient(135deg,rgba(71,126,197,.2),rgba(71,126,197,.07));border-color:rgba(125,183,255,.25)}.yellow{background:linear-gradient(135deg,rgba(182,145,38,.18),rgba(182,145,38,.06));border-color:rgba(243,212,106,.23);display:grid;align-content:center;min-height:0;overflow:auto}.red{background:linear-gradient(135deg,rgba(173,68,68,.18),rgba(173,68,68,.06));border-color:rgba(241,139,139,.22)}.label{font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin-bottom:8px}.blue .label{color:var(--blue)}.yellow .label{color:var(--yellow)}.red .label{color:var(--red)}h1{margin:0;font-size:clamp(1.45rem,3.1vw,2.35rem);line-height:1.08;letter-spacing:-.03em;color:#f7fbff}.body{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1rem,2vw,1.28rem);line-height:1.5;color:#f4eedc}.refs{margin:0;font-size:clamp(.8rem,1.3vw,.96rem);line-height:1.45;color:#ffd5d5}.red strong{color:#fff}.drawer{border-top:1px solid var(--line);padding:10px 18px 12px;display:flex;align-items:center;gap:10px}.drawer span{font-size:10px;color:rgba(255,255,255,.35)}.drawer a{margin-left:auto;color:#b7c9d7;text-decoration:none;font-size:11px;font-weight:800}.bottom{padding-top:8px;display:grid;gap:7px}.progress{height:3px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue) 0 34%,var(--yellow) 34% 67%,var(--red) 67%);transition:width .2s ease}.hint{text-align:center;color:rgba(255,255,255,.28);font-size:10px}.loading{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px}.focus .top,.focus .bottom{display:none}.focus .app{grid-template-rows:1fr;padding:6px}.focus .wrap{height:calc(100vh - 12px)}@media(max-width:650px){.links{display:none}.wrap{height:86vh}.stack{padding:12px}.band{padding:14px 15px}.body{font-size:clamp(.96rem,4vw,1.13rem)}h1{font-size:clamp(1.3rem,6vw,1.85rem)}.meta{padding:13px 15px 10px}}@media(prefers-reduced-motion:reduce){.card,.progress>div{transition:none}}</style></head><body><div class="app"><header class="top"><div class="brand"><b>100 Arguments</b> · curated case register</div><nav class="links"><a href="./index.html">Read the case</a><a href="./governing_framework.html">Framework</a><a href="./medical_record.html">Record</a></nav><div class="actions"><button class="btn" id="prev">←</button><button class="btn" id="focus">F</button><button class="btn" id="next">→</button></div></header><main class="stage"><div class="wrap"><article class="card" id="card"><div class="loading" id="loading">Loading the argument register…</div><div id="ready" hidden><div class="meta"><span class="point" id="point"></span><span class="badge" id="badge"></span><span class="counter" id="counter"></span></div><section class="stack"><div class="band blue"><div class="label">The point</div><h1 id="title"></h1></div><div class="band yellow"><div class="label">Why it matters</div><p class="body" id="body"></p></div><div class="band red"><div class="label">Evidence · dependency · limit</div><p class="refs" id="refs"></p></div></section><footer class="drawer"><span id="section"></span><a href="./argument_register.html">Legacy full register ↗</a></footer></div></article></div></main><footer class="bottom"><div class="progress"><div id="fill"></div></div><div class="hint">Blue = proposition · yellow = development · red = evidential dependency / limit · swipe or use ← →</div></footer></div><script>let points=[],order=[],i=0,down=false,sx=0,dx=0,suppressClick=false;const el=id=>document.getElementById(id),card=el('card');const priority=[
'Begin before authority','The case entered Neurology as one problem','The feet were not background detail','Neurology also saw the competing sign','The bounded question was already visible','The Protest attacked completion, not diagnosis','Notice changes the chronology','Premature documentary closure is the mechanism','The record can be accurate sentence by sentence and still misstate status','Confirmatory patient material travelled','The phase change alters the negligence chronology','The burden is what happened after notice','2018 crossed the old boundary','2020 produced an internal neurological reclassification','2023 almost reopened the founding question','Dopaminergic pain relief is a stress test, not proof','The model must have an exit condition','Local adaptation is real counter-evidence','Levodopa was prospectively defence-ready','The foot-allocation bridge was less transparent','Documentary asymmetry has a downstream effect','A successful levodopa defence does not answer provenance','Question migration is structural, not necessarily intentional','Function precedes motive','The record may forget; the patient need not','Documentary discontinuity is not experiential discontinuity','Clinical cooperation is not epistemic surrender','The 2023 misalignment is knowledge-state evidence','The patient cannot be forced to restart history in 2025','The originating clinician cannot inherit his own record','Governance question: did reviewers reconstruct the prior?','Governance question: how was disputed data handled?','Historical preservation is not historical immunity','Highest-value evidence: production history','Highest-value evidence: post-notice clinical acts','Strongest innocent explanation remains live','Strongest concerning explanation remains live','The record should not be asked to prove its own adequacy','The deepest question is corrigibility','The final case theory'];
const correction={
'The record may forget; the patient need not':{b:'There are not two histories. Once a patient gives a material correction signal before closure, omission of that signal from the chart does not remove the event from the history to which the chart refers. The patient continues to know that he gave it; the clinician participated in the same encounter; later decisions occur after it. What can diverge is representation. The omission therefore cannot be used circularly as evidence that the objection had no continuing significance.',r:'One-history / documentary-overlay principle · Protest premise'},
'Documentary discontinuity is not experiential discontinuity':{b:'A later disagreement should not automatically be dated from the first later note in which the institution records it. If the patient had already objected before discharge, later complaints may be the documentary reappearance of a continuing position inside the same history. This does not make the patient medically correct; it prevents chart silence from deciding when the disagreement began.',r:'One-history / documentary-overlay principle'}
};
function sec(p){const k=p.k;if(k==='fact'||k==='premise'||k==='proposition')return 'Founding state';if(k==='stress')return 'Boundary-crossing evidence';if(k==='legal')return 'Legal proof';if(k==='question'||k==='governance')return 'Questions for actors';if(k==='falsifier')return 'Falsifiers / counter-case';if(k==='principle')return 'Governing principles';return 'Analytical inference'}
function buildOrder(){const used=new Set();const out=[];priority.forEach(t=>{const n=points.findIndex(p=>p.t===t);if(n>=0&&!used.has(n)){out.push(n);used.add(n)}});points.forEach((p,n)=>{if(!used.has(n))out.push(n)});order=out}
function render(){const idx=order[i],raw=points[idx],fix=correction[raw.t]||{},p={...raw,...fix};el('point').textContent='Argument '+String(i+1).padStart(2,'0');el('counter').textContent=(i+1)+' / '+order.length;el('badge').textContent=p.k;el('title').textContent=p.t;el('body').textContent=p.b;el('refs').innerHTML='<strong>'+p.r+'</strong>';el('section').textContent=sec(p);el('fill').style.width=((i+1)/order.length*100)+'%';history.replaceState(null,'','#arg-'+(i+1))}
function go(d){i=(i+d+order.length)%order.length;render()}
fetch('./argument_register.html').then(r=>r.text()).then(t=>{const m=t.match(/const points=(\[.*?\]);\s*const card=/s);if(!m)throw new Error('register data not found');points=JSON.parse(m[1]);buildOrder();const h=location.hash.match(/arg-(\d+)/);if(h)i=Math.max(0,Math.min(order.length-1,+h[1]-1));el('loading').remove();el('ready').hidden=false;render()}).catch(e=>{el('loading').textContent='Argument data unavailable.'});
card.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;down=true;sx=e.clientX;dx=0;suppressClick=false;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;if(Math.abs(dx)>8)suppressClick=true;card.style.transform='translateX('+dx+'px) rotate('+(dx/80)+'deg)';card.style.opacity=Math.max(.72,1-Math.abs(dx)/750)});function finish(e,commit){if(!down)return;down=false;const swipe=commit&&Math.abs(dx)>90,dir=dx<0?1:-1;card.style.transform='';card.style.opacity='';if(card.hasPointerCapture(e.pointerId))card.releasePointerCapture(e.pointerId);if(swipe)go(dir);dx=0;if(suppressClick)setTimeout(()=>{suppressClick=false},0)}card.addEventListener('pointerup',e=>finish(e,true));card.addEventListener('pointercancel',e=>finish(e,false));card.addEventListener('click',e=>{if(e.target.closest('a')||suppressClick||!order.length)return;const r=card.getBoundingClientRect(),x=e.clientX-r.left;if(x<r.width*.23)go(-1);else if(x>r.width*.77)go(1)});addEventListener('keydown',e=>{if(!order.length)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='f'){document.body.classList.toggle('focus')}});el('prev').onclick=()=>order.length&&go(-1);el('next').onclick=()=>order.length&&go(1);el('focus').onclick=()=>document.body.classList.toggle('focus');</script></body></html>
