r{opacity:0;pointer-events:none}.focus .app{grid-template-rows:0 1fr 0;padding:var(--safe-top) 8px var(--safe-bottom)}.focus .card-wrap{height:calc(100vh - var(--safe-top) - var(--safe-bottom) - 12px)}@media(max-width:680px){.brand span{display:none}.card-wrap{height:min(88vh,930px)}.visible{padding:20px 18px 18px}.body{font-size:clamp(17px,4.85vw,23px)}.title{font-size:clamp(18px,5.25vw,23px)}}

<div class="app" id="app"><header class="topbar"><div class="brand">100 Arguments <span>· Governed Register</span> <a href="./revisiting_medical_inquiry-1.html">Framework</a></div><div class="actions"><button class="icon-btn" id="focusBtn" title="Focus mode">⛶</button><button class="icon-btn" id="shareBtn" title="Copy card">↗</button></div></header><main class="stage"><div class="card-wrap" id="cardWrap"><article class="card" id="card"><section class="visible"><div class="meta"><div class="point" id="point"></div><div class="counter" id="counter"></div></div><div class="badge" id="badge"></div><h1 class="title" id="title"></h1><div class="body-wrap"><p class="body" id="body"></p></div></section><section class="drawer"><details id="details"><summary>Evidence / dependency</summary><div class="refs" id="refs"></div></details></section></article></div></main><footer class="bottombar"><div class="progress"><div id="progressFill"></div></div><div class="hint"><span>Swipe</span><span>Tap edges</span><span>← →</span><span>F focus</span></div></footer></div>
<script>
const points=[
{t:'How to read this register',k:'inference',b:'The cards are not 100 independent proofs. They are a governed map of one case architecture. Each card declares its evidential role so source fact, later stress test, allegation, inference and legal dependency are not flattened into the same certainty.',r:'Governing Analytical Framework · Clinical Record'},
{t:'The case entered Neurology as one integrated problem',k:'fact',b:'Primary care joined painful feet, abnormal gait, muscle tension, increased tone, initiation difficulty, toe clawing, declining dexterity and functional deterioration. The case did not arrive already divided into Parkinsonism plus unrelated feet.',r:'GP record · urgent neurology referral'},
{t:'The feet were part of the originating signal',k:'fact',b:'Bilateral foot pain, deformity, callus and pressure pathology were present before specialist synthesis. They were not decorative background added after the neurological diagnosis.',r:'April–June 2017 GP record'},
{t:'Podiatry and Neurology were not mutually exclusive',k:'fact',b:'Podiatry was already engaged for genuine structural disease. That did not decide whether abnormal neurological movement contributed to loading, posture, pain or recurrent lesions.',r:'GP / Podiatry record'},
{t:'Alcohol first entered as attempted symptom relief',k:'fact',b:'Before specialist synthesis, alcohol was documented in the context of trying to relax muscles. Its later use as possible support for neuropathy was a new causal inference, not the reason it originally entered the history.',r:'GP record · July synthesis'},
{t:'Functional deterioration made the problem urgent',k:'fact',b:'By late June the patient was losing dexterity, struggling with dressing and work, and showing marked tone abnormality and abnormal gait. The incoming problem was clinically consequential, not incidental.',r:'GP record'},
{t:'Neurology recognised genuine severe Parkinsonism',k:'fact',b:'Marked rigidity, bradykinesia, abnormal tone, brisk reflexes and a striking gait supported a real young-onset Parkinsonian syndrome. The repository does not depend on denying that achievement.',r:'July 2017 Neurology'},
{t:'Neurology also observed the competing lower-limb sign',k:'fact',b:'The footdrop-like gait was described as “somewhat suggestive of a dystonic posture — NOT FOOT DROP.” That is a contemporaneous specialist observation, not a later patient reinterpretation.',r:'CLIN-001085'},
{t:'Structural feet and dystonic-looking movement coexisted',k:'fact',b:'Pes planus and hammertoes were documented in the same admission as a striking gait and dystonic-looking pseudo-footdrop. The relationship between those facts remained the bounded question.',r:'July 2017 examination'},
{t:'The patient supplied evidence of difference, not proof of independence',k:'fact',b:'Foot pain reduced after leaving bar work while leg tension continued. The patient therefore saw them as “not the same problem.” That supports phenomenological distinction, not necessarily biological separation.',r:'July 2017 history'},
{t:'Phenomenological distinction had evidence',k:'inference',b:'Two symptoms can feel different and still arise from interacting mechanisms. The specialist record was entitled to consider separation, but separation remained a hypothesis requiring clinical justification.',r:'Framework §3–6'},
{t:'The unresolved join was visible',k:'inference',b:'The bounded clinical question was simple: how did painful and structurally abnormal feet relate to the dystonic-looking lower limb and abnormal gait?',r:'Framework · Complexity analysis'},
{t:'The admission was extraordinarily sophisticated',k:'fact',b:'The discharge synthesis ranged across young-onset Parkinsonism, genetics, PRKN/PARK2, PARK6, PARK7, PARK9, imaging, prognosis, treatment and future sequencing. Lack of sophistication is not the allegation.',r:'July 2017 discharge synthesis'},
{t:'PRKN/PARK2 was already in the 2017 imagination',k:'fact',b:'The service specifically considered PRKN/PARK2 in the young-onset differential. Later genetics cannot be projected backwards as knowledge, but the disease family itself was not alien to the contemporary reasoning.',r:'2017 discharge / specialist correspondence'},
{t:'The author acknowledged an expertise boundary',k:'fact',b:'The discharge synthesis states “I am not a movement disorders neurologist.” The issue is what happened to the unresolved movement relationship after that limitation was expressly recognised.',r:'2017 discharge synthesis'},
{t:'The note was a constitutive act',k:'inference',b:'The discharge product did not merely describe thought. It assigned observations to categories, categories to causal possibilities and causal possibilities to future owners. It created the information architecture later readers inherited.',r:'Framework §5'},
{t:'One branch received extensive neurological development',k:'inference',b:'Parkinsonism became very-young-onset disease, atypical phenotype, recessive genetics, PRKN/PARK2 and other named possibilities, imaging, prognosis and treatment strategy.',r:'2017 discharge synthesis'},
{t:'The foot territory received a different explanatory route',k:'inference',b:'Corns, calluses, foot pain and “burning” were grouped as leg symptoms, considered possibly completely separate, connected to possible peripheral neuropathy and possible alcohol contribution, then given a podiatric/peripheral future.',r:'2017 discharge synthesis'},
{t:'“Burning” performs explanatory work',k:'inference',b:'“Burning” first becomes visible in the disclosed retained record within the compact neuropathy synthesis. It may have been genuinely reported; its significance is that it increases the salience of a peripheral-neuropathy branch.',r:'Framework §6'},
{t:'The portmanteau category matters',k:'inference',b:'“Leg symptoms including corns and callouses and burning” gathers structural lesions and sensory phenomenology into one object before a common peripheral explanation is proposed.',r:'Complexity analysis'},
{t:'“Completely separate” is stronger than “not the same problem”',k:'inference',b:'The patient supplied an experiential distinction. The completed synthesis moved toward complete separation. That is a legitimate hypothesis, but it is a larger proposition than the patient’s phenomenology alone can establish.',r:'2017 history and synthesis'},
{t:'Alcohol was causally recruited',k:'inference',b:'A real exposure that first appeared as attempted muscle relaxation later supplied a possible cause for a hypothesised neuropathy. Narrative coherence increased without the exposure itself proving the neuropathy branch.',r:'Framework §6'},
{t:'PARK9 received a named neuropathy future',k:'fact',b:'The sophisticated genetic discussion expressly links PARK9 to “the neuropathy question.” No equivalent developed “feet–dystonia question” is visible in the retained discharge architecture.',r:'2017 discharge synthesis'},
{t:'Podiatry was a destination, not proof of separation',k:'inference',b:'Structural foot pathology made Podiatry appropriate. Referral does not itself establish that the neurological movement disorder was irrelevant to posture, loading, pain or recurrent lesions.',r:'Framework §8'},
{t:'The core asymmetry is evidential',k:'inference',b:'Structural abnormalities and dystonic-looking movement were observed. Peripheral neuropathy was hypothesised. Yet the hypothesised branch acquired substantial explanatory and managerial infrastructure.',r:'Complexity analysis'},
{t:'The Protest is a later-reported premise',k:'premise',b:'The public retained record does not presently provide contemporaneous corroboration of the alleged pre-discharge Protest. The stronger post-notice analysis therefore remains conditional on establishing it.',r:'2025 Article 15 account · Framework §2'},
{t:'The Protest attacked completion, not diagnosis',k:'premise',b:'As later reported, the patient said the disabling foot problem had not been addressed before discharge. He did not need to diagnose dystonia; he identified unfinished clinical work.',r:'2025 patient account'},
{t:'The “full NCT / bald tires” analogy targets sufficiency',k:'premise',b:'The reported analogy accepts that extensive neurological work occurred while challenging whether the unresolved load-bearing problem could be left behind at discharge.',r:'2025 patient account'},
{t:'Direct notice would change the character of what followed',k:'premise',b:'If the responsible neurologist was directly told before closure that the originating foot problem remained unresolved, later documentation must be assessed as post-notice conduct rather than merely an innocent snapshot of uncertainty.',r:'Framework §7'},
{t:'The Protest created a genuine choice-space',k:'premise',b:'Re-examination, movement-disorders input, an explicit neurological question to Podiatry, preservation of uncertainty, defined review or documented reasons for proceeding were conceptually available. The case did not require instant diagnostic certainty.',r:'Framework §8'},
{t:'The missing opportunity was inquiry, not immediate levodopa',k:'inference',b:'The 2017 record deliberately avoided early aggressive dopaminergic therapy in a very young patient. The stronger missing-opportunity theory concerns integration, ownership, preservation of uncertainty and return conditions.',r:'Framework §8'},
{t:'Physical discharge did not equal documentary closure',k:'fact',b:'The DaTscan was performed after physical discharge and incorporated into the still-open discharge product. The information state remained capable of receiving consequential material before final sign-off.',r:'13–17 July 2017 record'},
{t:'The DaTscan strengthened one branch after discharge',k:'stress',b:'Post-discharge information strengthening Parkinsonism entered the final document. The unresolved feet–movement relationship did not visibly travel as an equivalent warning or open question.',r:'DaTscan addendum / discharge finalisation'},
{t:'Documentation–action mismatch is the neutral description',k:'inference',b:'The central question is whether a material concern was answered principally by additional clinical investigation or principally by explanatory documentation that made the existing disposition easier to defend.',r:'Framework §9'},
{t:'Reasons and rationalisations can use identical words',k:'inference',b:'“The burning feet could represent peripheral neuropathy” can be an excellent hypothesis if tested or appropriately preserved as uncertain. The same sentence can function as rationalisation if it substitutes for testing after challenge.',r:'Framework §1'},
{t:'Chronology and conduct distinguish reason from rationalisation',k:'inference',b:'The text alone cannot prove defensive purpose. Timing, provenance, clinical acts, drafts and audit history are what can separate ordinary reasoning from post-notice self-protective framing.',r:'Framework §22'},
{t:'Intent is not required to identify function',k:'inference',b:'A record can function defensively through selection, arrangement, omission and unequal preservation even if subjective malice or dishonesty is never proved.',r:'Framework §17'},
{t:'The patient and the decision are one mechanism',k:'inference',b:'The original decision becomes resistant to correction to the extent that contrary patient evidence is made more interpretable, more conditional or less capable of changing the model.',r:'Framework §10'},
{t:'Confirmatory patient statements can acquire authority',k:'inference',b:'Statements supporting separation—pain reduced, tension persisted, the phenomena felt different—can be incorporated into the specialist architecture as evidence.',r:'2017 synthesis'},
{t:'Contradictory patient evidence can lose travelling power',k:'premise',b:'If the Protest occurred but did not enter the authoritative account, the patient’s challenge to completion did not travel with the synthesis later clinicians inherited.',r:'Protest premise'},
{t:'Decision fixed; patient made flexible',k:'inference',b:'If the founding decision is not available for revision, contradiction can be absorbed by changing what the patient’s pain, chronology, treatment response or later diagnosis is allowed to mean.',r:'Framework §10'},
{t:'The patient becomes the variable that absorbs contradiction',k:'inference',b:'This is more precise than saying the patient is simply “less credible.” His experience remains usable, but its meaning can be repeatedly reclassified while the original decision retains status.',r:'Framework §10'},
{t:'Later notes are path-dependent',k:'inference',b:'After an authoritative specialist synthesis exists, later clinicians encounter the patient plus the inherited record. Repetition of inherited categories is therefore not automatically independent corroboration.',r:'Framework §11'},
{t:'2018 treatment withdrawal crossed the partition',k:'stress',b:'During procyclidine withdrawal, the outside-left-foot problem returned rapidly alongside worsening movement/tension and improved again after treatment restoration. That is a stress test of strict separation, not proof of a single mechanism.',r:'2018 clinic record'},
{t:'The 2018 observation was not globally integrated',k:'inference',b:'The foot territory changed with neurological treatment state, but the retained record does not visibly show reconstruction of the founding feet–movement relationship.',r:'Framework §11'},
{t:'2019 showed the service could differentiate mechanisms',k:'stress',b:'Later notes distinguished some musculoskeletal pain from Parkinsonian amplification and recognised “dystonia type elements.” The capacity for mechanism-specific reasoning existed.',r:'2019 clinic record'},
{t:'2020 produced a direct local reclassification',k:'stress',b:'The recurrent foot-throw looked like foot drop but was judged “actually parkinsonian” because ankle and foot power were normal. This directly re-entered the founding disputed territory.',r:'2020 clinic record'},
{t:'A local patch is not a root-model rewrite',k:'inference',b:'Reclassifying one movement as parkinsonian can be clinically useful while leaving the original painful-feet / dystonic-limb partition structurally untouched.',r:'Framework §11–12'},
{t:'2021 treatment changed without reconstructing the founding model',k:'stress',b:'Levodopa entered cautiously and other treatment changed. Therapeutic adaptability is real, but treatment change alone does not establish model-level correction.',r:'2021 clinic record'},
{t:'2022 kept the feet clinically active',k:'stress',b:'The record still described prolonged warm-up, soreness, corns/calluses and neuralgic questions while Parkinsonian treatment was being adjusted. The disputed territory remained clinically alive.',r:'2022 clinic record'},
{t:'2023 came closest to reopening the relationship',k:'stress',b:'Severe foot pain, cramping and walking failure prompted explicit questions about Parkinsonian dystonia and OFF phenomena. This was the strongest internal pressure on the founding partition.',r:'2023 clinic record'},
{t:'OFF dystonia was explicitly considered',k:'fact',b:'The 2023 record judged lower-limb cramping more likely an OFF dystonia. A Parkinson nurse also interpreted leg pain and shuffling as OFF-related.',r:'2023 clinic / nurse notes'},
{t:'The clinician acknowledged “misalignment”',k:'fact',b:'The record recognises that the clinician might seem to explain everything through Parkinson’s while the patient had reasonable concerns that much related to the feet as a separate problem.',r:'2023 clinic note'},
{t:'Acknowledging misalignment is not the same as reconstructing history',k:'inference',b:'The note could accommodate both OFF dystonia and a separate foot problem without asking whether the original 2017 allocation itself should be rewritten.',r:'Framework §11'},
{t:'Fabry testing demonstrates active differential work',k:'stress',b:'Later investigation of Fabry and other possibilities shows genuine clinical openness to alternative disease mechanisms. That is relevant innocent evidence and must not be erased by the stronger theory.',r:'2023–2024 record'},
{t:'Negative Fabry testing did not resolve the founding join',k:'stress',b:'Excluding one overlap disorder narrowed possibilities but did not itself answer how structural feet, dystonic movement and pain related across the history.',r:'2024 record'},
{t:'Pregabalin helped some pain but not toe curling',k:'stress',b:'High-dose pregabalin reduced much of the pain while task/standing-related toe curling remained. That pattern is compatible with mixed mechanisms rather than an all-or-nothing explanation.',r:'2024 clinic record'},
{t:'Mixed mechanisms do not rescue an untested partition',k:'inference',b:'The governing framework does not require every symptom to have one cause. It requires the relationship among mechanisms to be investigated rather than assumed away.',r:'Framework §3, §11'},
{t:'2025 made treatment response highly salient',k:'stress',b:'The patient described early steps as “torture” and relief after Parkinson medication took effect. Sinemet CR was later described as producing “profound relief.”',r:'2025 clinic / complaint response'},
{t:'Levodopa response is not a perfect causal test',k:'stress',b:'The treating neurologist correctly argued that dopaminergic treatment can alter pain experience regardless of the sole underlying cause. Response does not prove that every historical foot pain was dystonic.',r:'2025 clinician response'},
{t:'But nonspecific modulation can also absorb a challenge',k:'inference',b:'If every dopaminergic improvement is reclassified as generic pain modulation, treatment response can cease to have any power to interrogate the founding separation. That is the self-sealing risk.',r:'Framework §12'},
{t:'The question is what evidence could make the model lose',k:'inference',b:'A genuinely corrigible model must specify what observation would force revision. If evidence favouring separation fits and evidence favouring connection also fits, the model becomes too elastic to test.',r:'Framework §23'},
{t:'Local adaptability can coexist with global incorrigibility',k:'inference',b:'Medication, symptom labels, dose timing and local explanations can all change while the epistemic status of the original feet–movement partition remains fixed.',r:'Framework §12'},
{t:'“Constrained corrigibility” was too generous at model level',k:'inference',b:'The later record shows substantial local plasticity. The sharper formulation is local adaptability under global epistemic rigidity unless evidence shows the founding model itself was reconstructed.',r:'Framework §12'},
{t:'The complaint transformed the record’s function',k:'governance',b:'Once the patient formally alleged anchoring and failure to reassess, the longitudinal record became not only evidence of care but evidence deployed to prove the clinician had remained open-minded.',r:'March 2025 complaint / response'},
{t:'The clinician response rebutted crude versions of the allegation',k:'governance',b:'It showed that Parkinson’s was never ignored, neuropathy was not presented as a definitive diagnosis, and many treatments and alternatives were considered. Those are meaningful counterpoints.',r:'25 March 2025 response'},
{t:'Changing many things is not the same as changing the founding relationship',k:'inference',b:'Evidence of local reassessment cannot automatically answer the narrower question whether the particular feet–movement partition created in 2017 was ever globally reconstructed.',r:'Framework §13'},
{t:'The record became advocacy-capable',k:'inference',b:'Later clinical adaptations were recruited to defend the historical architecture against the charge of anchoring. That changes the evidential role of the longitudinal record.',r:'Framework §13'},
{t:'QPS first classified the complaint as clinical judgment',k:'governance',b:'The initial governance response routed the matter through the original clinical frame. That is relevant because the complaint also raised record, listening, information-state and governance questions.',r:'15 April 2025 QPS'},
{t:'A mixed complaint can contain non-clinical governance questions',k:'legal',b:'Whether a concern was heard, preserved, investigated and independently reviewed can remain a governance issue even where the underlying clinical judgment is outside an ordinary complaint route.',r:'Legal application'},
{t:'SIMT concluded there was no deficit in care',k:'governance',b:'The September 2025 institutional review ratified the care as appropriate on the material it considered. The next question is evidential independence, not whether the conclusion simply existed.',r:'3 September 2025 SIMT'},
{t:'Governance may become recursive validation',k:'inference',b:'If the review relies substantially on records generated under the challenged model and the original clinician’s explanation, it can validate the record through the record rather than independently reconstructing the founding relationship.',r:'Framework §14'},
{t:'Recursive validation can look increasingly independent',k:'inference',b:'Decision → explanatory record → later care through inherited categories → clinician defence using later care → governance review → institutional validation. Each layer may add authority without adding equal evidential independence.',r:'Framework §14'},
{t:'Article 16 introduced a different truth condition',k:'governance',b:'The data-governance response distinguished whether a historical opinion was medically correct from whether the record accurately reflected the opinion held at the time.',r:'6 September 2025 Article 16 refusal'},
{t:'Historical accuracy of an opinion is not medical correctness',k:'inference',b:'A medically wrong or incomplete opinion can still be accurately recorded as a historical opinion. That distinction can legitimately preserve records while leaving the clinical truth question unresolved.',r:'Framework §15'},
{t:'The record can move from hypothesis to protected historical state',k:'inference',b:'Clinical possibility → travelling specialist account → inherited longitudinal frame → protected historical opinion. Each transition can increase stability without independently proving the original allocation true.',r:'Framework §15'},
{t:'External referral is not internal self-correction',k:'stress',b:'The July 2025 movement-disorders/dystonia referral created an external route for reconsideration. It should not be counted as proof that the originating service had reconstructed its own model.',r:'11 July 2025 referral'},
{t:'A subsequent dystonia diagnosis was acknowledged',k:'stress',b:'The retained governance material acknowledges a December 2025 dystonia diagnosis, even though the exact specialist note is not in the public retained record.',r:'January 2026 QPS correspondence'},
{t:'January 2026 supplied a no-reopen rule',k:'governance',b:'QPS stated that the later dystonia diagnosis did not undermine prior processes or outcomes and did not require reopening governance review, altering prior determinations or retrospectively amending historical records.',r:'26 January 2026 QPS'},
{t:'Later truth was allowed to update without recursing',k:'inference',b:'The institutional position separated present clinical updating from historical reconsideration. That is the strongest retained example of historical insulation.',r:'Framework §16'},
{t:'Historical insulation is not automatically illegitimate',k:'inference',b:'A later diagnosis does not by itself prove an earlier process negligent. The problem arises when later evidence bears directly on the disputed relationship yet is treated as incapable in principle of interrogating the prior outcome.',r:'Framework §16'},
{t:'February 2026 delivered external biological clarification',k:'stress',b:'An external specialist recorded two pathogenic Parkin variants and attributed both Parkinsonism and dystonia to compound heterozygous PRKN mutations.',r:'4 February 2026 St Vincent’s'},
{t:'The genetics do not prove what clinicians should have known in 2017',k:'stress',b:'The molecular result is later evidence. It cannot be projected backwards as if the treating team possessed the answer during the founding admission.',r:'Framework §20'},
{t:'The genetics are a legitimate stress test of the old allocation',k:'stress',b:'They establish that the dystonic component belonged centrally to the same monogenic disease process as the Parkinsonism. That matters when testing how durable the earlier separation should remain.',r:'Framework §20'},
{t:'Later PRKN literature supports biological plausibility, not retrospective certainty',k:'stress',b:'PRKN disease can feature lower-limb dystonia and painful dystonic phenomena. This strengthens the plausibility of a neurological relationship without by itself establishing breach or causation in 2017.',r:'External literature · bounded use'},
{t:'The record can become an evidential instrument or an advocacy instrument',k:'inference',b:'A high-quality record should preserve uncertainty, dissent and provenance so later readers can reconstruct what was known. A record becomes advocacy-capable when its structure primarily protects an established account from disconfirming information.',r:'Framework §17'},
{t:'Distortion does not require a false sentence',k:'inference',b:'Selection, arrangement, omission, category choice and unequal preservation can change epistemic meaning even where each individual sentence is literally defensible.',r:'Framework §17'},
{t:'Expertise can increase corrigibility',k:'inference',b:'Specialist knowledge can identify anomalies, generate discriminating tests, preserve uncertainty and specify what evidence would change the model.',r:'Framework §18'},
{t:'Expertise can also increase rationalising power',k:'inference',b:'The more sophisticated the clinician, the more plausible explanations may be available for absorbing anomalies. Expertise becomes ethically dangerous when narrative capacity outruns testing capacity.',r:'Framework §18'},
{t:'Local academic capability is relevant but bounded',k:'stress',b:'Contemporary Galway-linked work demonstrates conceptual familiarity with young-onset Parkinsonism, dystonic foot phenomenology and Parkin disease. It does not prove that a particular clinician knew or applied every later publication.',r:'Doherty 2013 · Cullinane et al. 2017'},
{t:'The case is not “they should have diagnosed dystonia”',k:'legal',b:'The stronger theory concerns failure to investigate, preserve or later reconstruct a clinically material relationship, not hindsight insistence on the final molecular diagnosis.',r:'Legal application'},
{t:'The legal theory requires expert standard-of-care evidence',k:'legal',b:'Whether ordinary specialist care required more relational investigation in 2017 is not proved by documentary analysis alone. Independent neurology expertise remains necessary.',r:'Legal application'},
{t:'Causation is a separate question',k:'legal',b:'Even if breach were established, avoidable pain, functional loss and other damage require expert causal analysis. The documentary sequence cannot supply that by assertion.',r:'Legal application'},
{t:'“Reckless reconstruction” is a descriptor, not a standalone tort',k:'legal',b:'The phrase may describe conscious completion in the face of obvious unresolved risk if the facts support it. It is not itself an Irish cause of action.',r:'Legal application'},
{t:'Fraud and falsification are not established',k:'legal',b:'The retained record does not prove knowing fabrication, conspiracy or dishonest alteration. Strong structural criticism does not require those accusations.',r:'Framework §2 · Legal limits'},
{t:'Function can be analysed before motive',k:'inference',b:'The sequence can be tested for whether it functioned as anticipatory defensive documentation even when private intention remains unknown.',r:'Framework §9, §17'},
{t:'“Prior negligence setup” is a hypothesis, not a finding',k:'premise',b:'The stronger concern is that a challenge before discharge may have been followed by documentation designed to make the existing disposition defensible. That requires chronology and provenance before it can be elevated beyond hypothesis.',r:'Framework §7–9'},
{t:'The strongest innocent explanation remains live',k:'falsifier',b:'This may have been a genuinely difficult young-onset Parkinsonism case with real structural feet, a plausible separate peripheral process, ordinary comprehensive discharge documentation and no meaningful post-Protest defensive reframing.',r:'Framework §21'},
{t:'The strongest concerning explanation also remains live',k:'inference',b:'The service may have known before closure that the foot problem remained unresolved, proceeded without adequate relational assessment, and completed a sophisticated synthesis that decoupled the feet while omitting the contrary challenge.',r:'Framework §21'},
{t:'Audit history is the highest-value discriminator',k:'falsifier',b:'Native creation, save, edit, dictation, transcription, verification and release timestamps could establish when the consequential phrase cluster entered the record relative to the alleged Protest.',r:'Framework §22'},
{t:'Draft text matters',k:'falsifier',b:'A pre-Protest draft already containing the separation/neuropathy passages would narrow the post-notice reconstruction theory. Material additions after notice would increase its seriousness.',r:'Framework §22'},
{t:'The source of “markedly divorced” matters',k:'falsifier',b:'If traceable to a contemporaneous patient statement documented before the Protest, its evidential character differs from a later strengthening of the narrative during discharge synthesis.',r:'Framework §22'},
{t:'The source of “burning” matters',k:'falsifier',b:'An identifiable earlier source would strengthen the ordinary-clinical explanation. Its first appearance only within the compact neuropathy synthesis would leave provenance more consequential.',r:'Framework §22'},
{t:'Clinical acts after the alleged Protest matter',k:'falsifier',b:'A documented repeat examination, explicit movement-disorders discussion, relational testing or defined return plan would materially weaken the claim that explanation substituted for inquiry.',r:'Framework §22'},
{t:'Independent movement-disorders input matters',k:'falsifier',b:'Evidence that the dystonic-foot relationship was specifically discussed with an appropriate specialist before closure would narrow the allegation of untested separation.',r:'Framework §22'},
{t:'Risk or legal communications matter',k:'falsifier',b:'Contemporaneous risk-management, complaint, legal or indemnifier communications could support or rebut the hypothesis of anticipatory defensive framing depending on content and timing.',r:'Framework §22'},
{t:'The hypothesis must be capable of losing',k:'falsifier',b:'If every source is reinterpreted to support the allegation, the repository would reproduce the same self-sealing error it criticises. Contrary evidence must be allowed to narrow or defeat the theory.',r:'Framework §23'},
{t:'A governing theory is not factual supremacy',k:'inference',b:'The framework governs inference. The original sources and scoped canonical record still control transcription, provenance and source status. If analysis conflicts with source evidence, the source wins.',r:'Framework §0'},
{t:'The public record is a governed reading instrument',k:'inference',b:'Its purpose is to expose the chronology and evidential categories needed to test the framework. It is subordinate analytically, while the underlying source material remains sovereign factually.',r:'medical_record.html'},
{t:'The legal page is an application, not a source',k:'legal',b:'Legal characterisation must remain downstream of factual proof, expert standard-of-care evidence and the framework’s distinction between investigation and explanation.',r:'legal_shape.html'},
{t:'The ethics narrative is an application, not corroboration',k:'inference',b:'Narrative coherence can make a mechanism easier to see; it does not create independent evidence. Its role is ethical synthesis under the governing framework.',r:'Ethics narrative'},
{t:'This deck is an argument register, not corroboration',k:'inference',b:'One hundred cards do not create one hundred pieces of evidence. They decompose one architecture into testable propositions and dependencies.',r:'This document'},
{t:'The central principle governs every downstream page',k:'inference',b:'Explanation must not substitute for the evidence that would test it when testing remains reasonably available, clinically warranted and materially relevant.',r:'Governing Framework'},
{t:'The strongest case is about information architecture',k:'inference',b:'The distinctive allegation is not simply diagnostic error. It is that a specialist record may have transformed an unresolved relationship into a durable information state that later care and governance inherited.',r:'Framework §24'},
{t:'The first-order clinical question and second-order institutional question differ',k:'inference',b:'First order: what is the relationship between feet, pain and dystonic movement? Second order: after challenge, how should the existing disposition be made defensible? The ethical risk is substituting the second for the first.',r:'Framework §7–9'},
{t:'A decision can survive by changing what contrary evidence means',k:'inference',b:'Self-sealing does not require denying new facts. It can absorb them through new explanations while leaving the founding decision untouched.',r:'Framework §9–12'},
{t:'Assimilation without correction is the longitudinal pattern to test',k:'inference',b:'New observations repeatedly entered the record, but the key question is whether they changed the founding partition or were accommodated within it.',r:'Framework §11–12'},
{t:'Clinical plasticity and epistemic correction are different',k:'inference',b:'A service can be highly adaptive in treatment while remaining rigid about the historical meaning of the original decision.',r:'Framework §12'},
{t:'Governance can create a closure theorem',k:'governance',b:'When later diagnosis is declared unable to destabilise prior determinations, governance is no longer merely assessing clinical facts; it is setting a rule about what can count as disconfirming evidence.',r:'January 2026 QPS'},
{t:'The patient’s epistemic role is the deepest ethical stake',k:'inference',b:'A patient must be able not only to supply symptoms but to challenge the interpretation and trigger reconsideration when lived reality does not fit the model.',r:'Framework §10'},
{t:'Credible when confirmatory, corrigible when contradictory',k:'inference',b:'That is the asymmetry to test whenever patient statements supporting the model are preserved while contrary statements are omitted, reframed or treated as misunderstanding.',r:'Framework §10'},
{t:'The decision acquires privilege as the patient acquires contingency',k:'inference',b:'The same mechanism can make the original account progressively more authoritative and the patient’s contrary interpretation progressively more contestable.',r:'Framework §10'},
{t:'The whole architecture is recursive',k:'inference',b:'Decision → organised patient evidence → later interpretation through organised record → later record used to validate decision → governance validates accumulated record → validation further strengthens the founding account.',r:'Framework §24'},
{t:'The repository’s own safeguard is falsifiability',k:'falsifier',b:'Every strong claim should identify the evidence that would weaken it. The framework should govern by making the case more testable, not by protecting it from contradiction.',r:'Framework §23'},
{t:'The irreducible question',k:'inference',b:'Was specialist expertise used to reduce uncertainty about reality, or to reduce the vulnerability of an existing decision to contrary reality?',r:'Governing Framework'},
{t:'The final formulation',k:'inference',b:'The system could change almost everything except the epistemic status of the original decision because it could reinterpret almost everything about the patient instead.',r:'Governing Framework §10, §25'}

const card=document.getElementById('card'),point=document.getElementById('point'),counter=document.getElementById('counter'),badge=document.getElementById('badge'),title=document.getElementById('title'),body=document.getElementById('body'),refs=document.getElementById('refs'),fill=document.getElementById('progressFill'),focusBtn=document.getElementById('focusBtn'),shareBtn=document.getElementById('shareBtn');let i=0,startX=null,startY=null,dragX=0,dragging=false;
function render(){const p=points[i];point.textContent='Point '+String(i+1).padStart(2,'0');counter.textContent=(i+1)+' / '+points.length;badge.textContent=p.k;badge.className='badge '+p.k;title.textContent=p.t;body.innerHTML=p.b.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');refs.innerHTML=p.r+' · <a href="./revisiting_medical_inquiry-1.html">governing framework</a>';fill.style.width=((i+1)/points.length*100)+'%';document.getElementById('details').open=false;setTimeout(fitBody,0)}
function fitBody(){body.style.fontSize='';let n=0;while(card.scrollHeight>card.clientHeight&&n<18){const s=parseFloat(getComputedStyle(body).fontSize);body.style.fontSize=(s-1)+'px';n++}}
function go(d){i=(i+d+points.length)%points.length;render()}
card.addEventListener('pointerdown',e=>{if(e.target.closest('details'))return;dragging=true;startX=e.clientX;startY=e.clientY;dragX=0;card.classList.add('dragging')});card.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)<Math.abs(dy))return;dragX=dx;card.style.transform=`translateX(${dx}px) rotate(${Math.max(-5,Math.min(5,dx/45))}deg)`;card.style.opacity=Math.max(.68,1-Math.abs(dx)/700)});function finish(){if(!dragging)return;dragging=false;card.classList.remove('dragging');const dx=dragX,th=Math.min(105,innerWidth*.2);card.style.transform='';card.style.opacity='';if(Math.abs(dx)>=th)go(dx<0?1:-1);startX=startY=null;dragX=0}card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',finish);card.addEventListener('click',e=>{if(Math.abs(dragX)>8||e.target.closest('details'))return;const r=card.getBoundingClientRect(),x=e.clientX-r.left;if(x<r.width*.3)go(-1);else if(x>r.width*.7)go(1)});window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='f'){document.body.classList.toggle('focus');focusBtn.textContent=document.body.classList.contains('focus')?'×':'⛶';setTimeout(fitBody,50)}});focusBtn.onclick=()=>{document.body.classList.toggle('focus');focusBtn.textContent=document.body.classList.contains('focus')?'×':'⛶';setTimeout(fitBody,50)};shareBtn.onclick=async()=>{const p=points[i],txt=`${i+1}. ${p.t}\n\n${p.b}\n\n[${p.k}] ${p.r}`;try{await navigator.clipboard.writeText(txt);shareBtn.textContent='✓';setTimeout(()=>shareBtn.textContent='↗',900)}catch{}};window.addEventListener('resize',fitBody);render();
</script></body></html>
