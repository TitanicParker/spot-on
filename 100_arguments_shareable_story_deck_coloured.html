. That distinction belongs inside the central allegation itself. That matters ethically.", "clin": ["CLIN-001142", "CLIN-004613", "CLIN-001263", "CLIN-001621"]}, {"num": 83, "title": "Functional effect can be argued before subjective intent is proved", "body": "The allegation can be severe without pretending current evidence proves conscious deception. Documentary function and subjective intent are different questions. The final record can be shown to omit the Protest allegation, structure the feet peripherally, travel downstream and support later self-validation even before provenance establishes why particular words were chosen. The central allegation therefore proceeds in layers: function is presently arguable; post-Protest authorship chronology is the route to intent. This is not dilution. It is forensic strength. The institution should not escape scrutiny merely because motive remains unproved. That distinction directly strengthens the central allegation being advanced here. That matters.", "clin": ["CLIN-001142", "CLIN-001914", "CLIN-002425", "CLIN-003239"]}, {"num": 84, "title": "Native provenance is the decisive unresolved evidence", "body": "The strongest investigative demand is now straightforward: produce the drafts, dictation sequence, timestamps, version history, audit metadata, source notes and any witness material showing when the consequential July wording first appeared. The central allegation is falsifiable at precisely this point. If the phrase cluster substantially existed before the Protest from identifiable clinical sources, fresh post-notice construction narrows. If it emerged or materially changed afterward, lacked a bedside source and solved the exact closure problem the patient had raised, the suspicion becomes dramatically stronger. That is why this point belongs inside the central allegation, not beside it. That matters clinically too.", "clin": ["CLIN-001142", "CLIN-001263", "CLIN-001621", "CLIN-004613", "CLIN-004967"]}, {"num": 85, "title": "The institution should be asked why the Protest left no trace", "body": "The absence of the Protest from the surviving record cannot prove the event occurred, but neither can the record’s silence be used to defeat an omission allegation. The central allegation therefore turns silence into a disclosure question, not a fact claim. What ward, teaching, trainee, draft, dictation or audit material existed? What was searched? What was retained? Who controlled the final narrative? Why did a patient-facing summary preserve extensive cognition, counselling and understanding yet not preserve the alleged statement that the core problem remained unresolved? The ethical force lies in asymmetry. That point strengthens the central allegation itself. That matters.", "clin": ["CLIN-001263", "CLIN-001621", "CLIN-004613", "CLIN-004967"]}, {"num": 86, "title": "The institution should be asked what would have falsified neuropathy", "body": "A central question for any ethical reviewer is simple: what evidence would have caused the peripheral-neuropathy hypothesis to lose practical authority? The record shows potential support, treatment, overlap investigation and persistent qualification. It also shows maximum-dose pregabalin with severe pain, negative Fabry testing, neurological treatment-state dependence, Parkinsonian foot movement, OFF-dystonia reasoning and levodopa-related relief. Yet neuropathy survives as “if there is a degree.” The central allegation therefore challenges the falsification structure, not merely the conclusion. A hypothesis without a practical exit condition can become a permanent explanatory reserve. That distinction directly strengthens the central allegation being advanced here. That matters.", "clin": ["CLIN-001142", "CLIN-001914", "CLIN-002282", "CLIN-002425", "CLIN-002574", "CLIN-002675", "CLIN-002777", "CLIN-003239"]}, {"num": 87, "title": "The institution should be asked who owned the unresolved join", "body": "Another unavoidable question is ownership. Podiatry could own callus treatment. Neurology could own Parkinsonism. Primary care could coordinate. But who owned the unresolved relationship between dystonic movement, abnormal loading, structural lesions and pain? The central allegation says the pathway had destinations without a guaranteed return route. That is the care-pathway form of the same documentary mechanism. Once the record partitioned the problem, each service could act competently while the join belonged to nobody. Ethical review should identify the person or service responsible for rebuilding the whole when treatment-state evidence crossed departmental boundaries. That distinction belongs inside the central allegation itself.", "clin": ["CLIN-000847", "CLIN-000899", "CLIN-002874", "CLIN-003004", "CLIN-001914", "CLIN-002282", "CLIN-002425"]}, {"num": 88, "title": "The institution should be asked why continuity counts as validation", "body": "The later defences repeatedly invoke the length and detail of the record as evidence of careful management. The central allegation turns that argument around. If the founding architecture shaped the later record, continuity is partly an expected consequence of the challenged mechanism. Why should records generated inside the frame count as independent validation of the frame? Which later observations were genuinely external? Which simply repeated inherited categories? Which investigations were initiated because neuropathy had already been authorised? Which patient phrases reflected institutional vocabulary? Ethical review must disaggregate lineage before treating consistency as corroboration. That point strengthens the central allegation itself.", "clin": ["CLIN-001142", "CLIN-001914", "CLIN-002425", "CLIN-003239", "CLIN-005050"]}, {"num": 89, "title": "The institution should be asked why later biology did not trigger reconstruction", "body": "Once external genetics linked Parkinsonism and dystonia to PRKN, the institution faced a governance question distinct from hindsight blame. Later biology did not prove every historical pain episode was dystonic, but it materially changed the retrospective significance of the early dystonic-looking lower limb. The central allegation asks why that development should merely update the present diagnosis while leaving the historical information architecture untouched. Corrigibility means later evidence can change what future actors are allowed to rely upon from old records. That is why this evidence must explain the single alleged mechanism, not be broken away into a safer subsidiary theory.", "clin": ["CLIN-005515", "CLIN-006192", "CLIN-003226"]}, {"num": 90, "title": "The final moral accusation concerns control over the patient’s knowledge state", "body": "At its deepest level, the case concerns who controlled the representation of the patient’s body. The patient possessed pain, movement, memory and treatment effects. The institution possessed the specialist record through which later clinicians, governance bodies and eventually the patient himself would understand those experiences. The central allegation is that representational power was exercised asymmetrically: the Protest did not travel, while a compact peripheralising explanation did. Records govern future attention. The ethical wrong alleged is therefore not simply being mistaken; it is allowing documentary authority to harden unresolved clinical work into apparent specialist sufficiency capable of governing years of care.", "clin": ["CLIN-001142", "CLIN-001263", "CLIN-001621", "CLIN-004613", "CLIN-003239", "CLIN-005083", "CLIN-005515"]}, {"num": 91, "title": "The DaTscan created differential settlement after physical discharge", "body": "Physical discharge did not end the making of the authoritative specialist account. The finalisation addendum records that the DaTscan was completed after discharge and inserted before the letter travelled. That objectively strengthened the Parkinsonian proposition available to downstream readers. The feet relationship, however, was not equivalently re-adjudicated when that new evidence arrived; it remained inside the existing separate/peripheral/Not-clear architecture. The central allegation therefore gains a differential-settlement point: one proposition was upgraded after the patient left while its neighbouring unresolved relationship travelled substantially unchanged. That is why this point belongs inside the central allegation, not beside it. That matters. That matters.", "clin": ["CLIN-001128", "CLIN-001263", "CLIN-001621"]}, {"num": 92, "title": "Primary-diagnosis finality coexisted with unresolved foot meaning", "body": "The discharge artefact states `Primary Diagnosis: Parkinsons Disease` while elsewhere preserving the painful-foot relationship as potentially separate, neuropathic and `Not clear`. The central allegation does not argue that Parkinsonism lacked evidential support. It argues that different propositions acquired different degrees of institutional finality inside one document. Parkinsonism became the named primary diagnosis; the feet became an organised residual uncertainty. That asymmetry matters because downstream systems do not treat every sentence equally. A primary diagnosis governs records, treatment and reliance more powerfully than a qualified unresolved paragraph. The unresolved component therefore entered the future already subordinated to a settled organising diagnosis.", "clin": ["CLIN-001142", "CLIN-000931"]}, {"num": 93, "title": "As per above converted narrative allocation into the formal plan", "body": "The founding letter explicitly says part of its purpose was to supply the patient, consolidate discussions, assist debriefing and set out a clear plan. Its formal `Plan/Recommendations` then states `As per above`, incorporating the preceding narrative into forward management. This is crucial to the central allegation. The neuropathy/separation language was not merely historical prose sitting harmlessly beside the plan; the document itself made the narrative the plan. Once that occurred, explanatory allocation acquired operational force. That is why the point must remain part of the single alleged mechanism rather than become a separate complaint. That belongs within the single allegation.", "clin": ["CLIN-001142", "CLIN-004613", "CLIN-001411", "CLIN-001594"]}, {"num": 94, "title": "Understanding of treatment cannot be converted into agreement with the foot disposition", "body": "The record repeatedly credits the patient with intelligence, questions and a `good understanding` of why levodopa or dopamine agonists were being delayed. That is evidence about counselling and treatment strategy. It is not evidence that he agreed the disabling feet had been adequately explained or safely allocated elsewhere. If the Protest occurred, the opposite closure-state information existed simultaneously: the patient understood the neurological discussion yet still said the feet had not been dealt with. The central allegation therefore rejects an epistemic substitution. That is why this point belongs inside the central allegation, not beside it. That strengthens the allegation directly.", "clin": ["CLIN-004613", "CLIN-001411", "CLIN-001594"]}, {"num": 95, "title": "Podiatry was being expedited as Parkinson’s, not proven independence", "body": "On 6 July the GP recorded that Podiatry would mark the case as priority `as Parkinson's`. That contemporaneous wording matters because it resists a later tendency to treat Podiatry as though its existence itself demonstrated that the feet belonged outside the neurological disorder. The practical foot pathway was being accelerated within a Parkinsonian context. The central allegation does not claim this proves the feet were dystonic or that Podiatry understood its role identically. It proves something narrower and damaging: departmental routing was not synonymous with explanatory separation even at the time. That distinction strengthens the central allegation itself. That matters.", "clin": ["CLIN-000899"]}, {"num": 96, "title": "Healy’s contemporaneous PARK2 view kept the monogenic route alive", "body": "By September 2017 Prof Healy wrote that the patient `probably has Park II`, recommended testing it first, recorded dramatic motor improvement on procyclidine and rasagiline, and noted that PARK II patients can manage for long periods on relatively low dopamine-replacement doses while becoming dyskinetic if over-used. This does not prove the painful feet were dystonic, nor does it show Healy ordered immediate levodopa. Its relevance is structural. A contemporaneous external specialist reinforced the same monogenic disease route later confirmed genetically and treated medication response as meaningful. That distinction strengthens the central allegation itself. That distinction strengthens the central allegation itself.", "clin": ["CLIN-001742"]}, {"num": 97, "title": "The record named a neuropathy question but no equivalent feet-dystonia question", "body": "The founding synthesis explicitly names `PARK 9 (the neuropathy question)` after already documenting a striking gait suggestive of `dystonic posture - NOT FOOT DROP` and considering PRKN/PARK2. That textual asymmetry deserves its own point. An unproved peripheral possibility received a named question and a monogenic future. The observed dystonic-looking lower limb did not receive an equivalent documented question asking whether painful feet, posture, loading and gait belonged partly to the same process. The central allegation is not that one phrase proves bias. That is why this point belongs inside the central allegation, not beside it. That strengthens the allegation directly.", "clin": ["CLIN-001085", "CLIN-001520"]}, {"num": 98, "title": "Non-holding of teaching and ward records cannot disprove the Protest", "body": "GUH later stated that it did not hold personal data for student involvement, student records, teaching-governance material or trainee assignments, and that the ward did not hold records for 2017 ward rounds. That response establishes a source gap; it does not establish that the alleged teaching encounter never happened. The distinction is essential because an omission allegation cannot logically be defeated by pointing to the finished record’s silence or to later non-holding of potentially corroborative records. The central allegation therefore treats missing institutional traces as an evidential limitation requiring caution, not as exculpatory proof. That belongs within the single allegation.", "clin": ["CLIN-004613", "CLIN-004967"]}, {"num": 99, "title": "SIMT validation followed explicit notice that the underlying record was disputed", "body": "Before the SIMT outcome, the patient expressly invoked Article 18 and asked that internal review not rely on uncorrected or unflagged data subject to the rectification dispute. The later SIMT outcome nevertheless states that the multidisciplinary team found the care appropriate and identified no deficit. This point makes no legal finding about whether Article 18 was validly engaged or breached. Its significance is informational and ethical: institutional validation occurred after explicit notice that the underlying historical data state itself was contested. That is why the point must remain part of the single alleged mechanism rather than become a separate complaint.", "clin": ["CLIN-005050", "CLIN-004916"]}, {"num": 100, "title": "The record should be judged against its own stated purpose of bridging understanding", "body": "In 2025 the clinician explained that his long letters were meant to be resources for patients, to bridge the gap between what was said or intended and what was heard or understood, and to document how decisions were made, when and by whom. That declared record-making ethic sharpens the central allegation. If the Protest occurred, the founding patient-facing account omitted precisely the event most necessary to understand whether the foot disposition had been accepted or challenged before closure. That is why the point must remain part of the single alleged mechanism rather than become a separate complaint. That matters ethically.", "clin": ["CLIN-004613", "CLIN-003257F", "CLIN-001411", "CLIN-001594"]}];

let dragging = false;

const cardThemes = [
  ["rgba(255,214,84,.10)", "rgba(255,122,122,.08)"],
  ["rgba(255,180,92,.10)", "rgba(255,92,92,.08)"],
  ["rgba(255,232,118,.10)", "rgba(255,110,110,.08)"],
  ["rgba(255,196,96,.10)", "rgba(255,86,120,.08)"],
  ["rgba(255,220,90,.10)", "rgba(255,104,104,.08)"],
  ["rgba(255,210,110,.10)", "rgba(255,80,110,.08)"]
];

const app = document.getElementById('app');
const card = document.getElementById('card');
const pointEl = document.getElementById('point');
const counterEl = document.getElementById('counter');
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');
const clinEl = document.getElementById('clin');
const detailsEl = document.getElementById('details');
const progressFill = document.getElementById('progressFill');
const toast = document.getElementById('toast');
const focusBtn = document.getElementById('focusBtn');
const shareBtn = document.getElementById('shareBtn');

function splitBody(text) {
  const sentences = text.match(/[^.!?]+[.!?]+(?:["”']+)?|[^.!?]+$/g) || [text];
  const intro = (sentences[0] || text).trim();
  const rest = sentences.slice(1).join(' ').trim();
  return { intro, rest };
}

function setCardTheme(num) {
  if (num === 0) {
    card.style.background =
      "linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)), var(--card)";
    return;
  }
  const theme = cardThemes[(num - 1) % cardThemes.length];
  card.style.background =
    `radial-gradient(circle at top left, ${theme[0]}, transparent 42%),` +
    `radial-gradient(circle at bottom right, ${theme[1]}, transparent 46%),` +
    `linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)), var(--card)`;
}

function renderBody(p) {
  if (p.num === 0) {
    bodyEl.innerHTML = `<p class="body-full">${escapeHtml(p.body)}</p>`;
    return;
  }
  const parts = splitBody(p.body);
  const intro = escapeHtml(parts.intro);
  const rest = escapeHtml(parts.rest);
  bodyEl.innerHTML = `<p class="body-intro">${intro}</p>` + (rest ? `<p class="body-rest">${rest}</p>` : '');
}

function escapeHtml(s) {
  return s
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function fitBody() {
  const intro = bodyEl.querySelector('.body-intro');
  const rest = bodyEl.querySelector('.body-rest');
  const full = bodyEl.querySelector('.body-full');
  const bodyWrap = card.querySelector('.body-wrap');

  const resizeElement = (el, minSize, step) => {
    if (!el) return;
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 0;
    while (bodyEl.scrollHeight > bodyWrap.clientHeight && size > minSize && guard < 30) {
      size -= step;
      el.style.fontSize = size + 'px';
      guard++;
    }
  };

  if (intro) intro.style.fontSize = '';
  if (rest) rest.style.fontSize = '';
  if (full) full.style.fontSize = '';

  resizeElement(intro, 16, 0.45);
  resizeElement(rest, 15, 0.4);
  resizeElement(full, 15, 0.42);

  let guard = 0;
  while (bodyEl.scrollHeight > bodyWrap.clientHeight && guard < 30) {
    if (intro) {
      const s = parseFloat(getComputedStyle(intro).fontSize);
      if (s > 15) intro.style.fontSize = (s - 0.3) + 'px';
    }
    if (rest) {
      const s = parseFloat(getComputedStyle(rest).fontSize);
      if (s > 14) rest.style.fontSize = (s - 0.3) + 'px';
    }
    if (full) {
      const s = parseFloat(getComputedStyle(full).fontSize);
      if (s > 14) full.style.fontSize = (s - 0.3) + 'px';
    }
    guard++;
  }
}

function render(direction = 0) {
  const p = points[index];
  if (p.num === 0) {
    pointEl.textContent = 'Orientation';
    counterEl.textContent = 'Read first';
  } else {
    pointEl.textContent = 'Point ' + String(p.num).padStart(3, '0');
    counterEl.textContent = p.num + ' / 100';
  }
  titleEl.textContent = p.title;
  renderBody(p);
  clinEl.textContent = (p.clin && p.clin.length)
    ? p.clin.join(' · ')
    : (p.num === 0 ? 'Orientation card — evidence is carried in the numbered cards that follow.' : 'No CLIN references extracted into this version.');
  progressFill.style.width = p.num === 0 ? '0%' : (p.num + '%');
  detailsEl.open = false;
  setCardTheme(p.num);

  if (direction !== 0) {
    card.classList.add(direction > 0 ? 'enter-right' : 'enter-left');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        card.classList.remove('enter-right', 'enter-left');
      });
    });
  }
  requestAnimationFrame(fitBody);
}

function go(delta) {
  const nextIndex = Math.max(0, Math.min(points.length - 1, index + delta));
  if (nextIndex === index) return;
  index = nextIndex;
  render(delta);
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1200);
}

async function shareCurrent() {
  const p = points[index];
  const text = p.num === 0
    ? `${p.title}

${p.body}`
    : `Point ${p.num} — ${p.title}

${p.body}`;
  if (navigator.share) {
    try {
      await navigator.share({ title: '100 Arguments', text });
      return;
    } catch (e) {}
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('Argument copied');
  } catch (e) {
    showToast('Share unavailable');
  }
}

focusBtn.addEventListener('click', () => {
  document.body.classList.toggle('focus');
  focusBtn.textContent = document.body.classList.contains('focus') ? '×' : '⛶';
  setTimeout(fitBody, 50);
});

shareBtn.addEventListener('click', shareCurrent);

card.addEventListener('pointerdown', (e) => {
  if (e.target.closest('summary') || e.target.closest('.clin')) return;
  startX = e.clientX;
  startY = e.clientY;
  dragging = true;
  dragX = 0;
  card.classList.add('dragging');
  card.setPointerCapture?.(e.pointerId);
});

card.addEventListener('pointermove', (e) => {
  if (!dragging || startX === null) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  if (Math.abs(dx) < Math.abs(dy)) return;
  dragX = dx;
  const rot = Math.max(-5, Math.min(5, dx / 45));
  const opacity = Math.max(.68, 1 - Math.abs(dx) / 700);
  card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
  card.style.opacity = opacity;
});

function finishSwipe(e) {
  if (!dragging) return;
  dragging = false;
  card.classList.remove('dragging');

  const threshold = Math.min(105, window.innerWidth * .2);
  const dx = dragX;
  card.style.transform = '';
  card.style.opacity = '';

  if (Math.abs(dx) >= threshold) {
    go(dx < 0 ? 1 : -1);
  }
  startX = startY = null;
  dragX = 0;
}

card.addEventListener('pointerup', finishSwipe);
card.addEventListener('pointercancel', finishSwipe);

card.addEventListener('click', (e) => {
  if (Math.abs(dragX) > 8) return;
  if (e.target.closest('summary') || e.target.closest('.clin')) return;
  const rect = card.getBoundingClientRect();
  const localX = e.clientX - rect.left;
  if (localX < rect.width * .32) go(-1);
  else if (localX > rect.width * .68) go(1);
});

window.addEventListener('keydown', (e) => {
  if (['ArrowRight','PageDown',' '].includes(e.key)) {
    e.preventDefault(); go(1);
  }
  if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) {
    e.preventDefault(); go(-1);
  }
  if (e.key.toLowerCase() === 'f') {
    document.body.classList.toggle('focus');
    focusBtn.textContent = document.body.classList.contains('focus') ? '×' : '⛶';
    setTimeout(fitBody, 50);
  }
});

window.addEventListener('resize', fitBody);
render();
</script>
</body>
</html>
