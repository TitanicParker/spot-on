a{min-width:0}.step{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:900;color:var(--blue)}.label{font-size:12px;color:rgba(255,255,255,.48);margin-top:5px}.body{padding:0 clamp(22px,4.5vw,44px) clamp(22px,4vw,38px);display:grid;align-content:center;min-height:0}.body h1{margin:0 0 18px;font-size:clamp(2rem,5.2vw,4.8rem);line-height:.98;letter-spacing:-.045em;max-width:820px}.body p{margin:0;max-width:790px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.02rem,2.2vw,1.42rem);line-height:1.55;color:#dbe3e8}.body strong{color:#fff}.quote{margin-top:22px;padding:15px 17px;border-left:4px solid var(--yellow);background:rgba(255,255,255,.035);font-family:Georgia,"Times New Roman",serif;font-size:clamp(.98rem,1.9vw,1.22rem);line-height:1.45;color:#fff}.foot{border-top:1px solid var(--line);padding:14px clamp(22px,4.5vw,44px);display:flex;align-items:center;gap:12px}.open{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:#fff;font-size:12px;font-weight:850;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045)}.open:hover{background:rgba(255,255,255,.08)}.hint{margin-left:auto;font-size:11px;color:rgba(255,255,255,.36)}.bottom{padding-top:10px;display:grid;gap:9px}.progress{height:3px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red));transition:width .25s ease}.rail{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.rail button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:rgba(255,255,255,.48);cursor:pointer;font:800 12px Arial}.rail button.active{background:#fff;color:#111a20;border-color:#fff}.rail button:hover{color:#fff}.rail button.active:hover{color:#111a20}.repo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:24px;max-width:760px}.repo a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#f4f7f9;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.03);font-size:12px;font-weight:750}.repo i{font-style:normal;opacity:.7}@media(max-width:700px){.app{padding:7px}.wrap{height:82vh}.topnav{display:none}.cardhead{padding-top:20px}.glyph{width:46px;height:46px;border-radius:15px;font-size:20px}.body h1{font-size:clamp(1.85rem,9vw,3.15rem)}.body p{font-size:clamp(1rem,4.5vw,1.22rem)}.repo{grid-template-columns:1fr 1fr}.hint{display:none}.rail button{width:30px;height:30px}}@media(prefers-reduced-motion:reduce){.card,.progress>div{transition:none}}</style></head><body><div class="app"><header class="top"><div class="brand"><b>Spot On</b> · read the case</div><nav class="topnav"><a href="./README.md">README</a><a href="./medical_record.html">Record</a><a href="./argument_register.html">100 Arguments</a></nav></header><main class="stage"><div class="wrap"><article class="card" id="card"><div class="cardhead"><div class="glyph" id="glyph"></div><div class="meta"><div class="step" id="step"></div><div class="label" id="label"></div></div></div><section class="body"><div><h1 id="title"></h1><p id="copy"></p><div class="quote" id="quote"></div><div class="repo" id="repo" hidden></div></div></section><footer class="foot"><a class="open" id="open" href="#">Open the relevant page <span>→</span></a><span class="hint">Swipe · tap edges · ← →</span></footer></article></div></main><footer class="bottom"><div class="progress"><div id="fill"></div></div><div class="rail" id="rail" aria-label="Reading path"></div></footer></div><script>const pages=[
{g:'◎',l:'Orientation',t:'Start before the record knew the answer.',c:'This case becomes much clearer if it is reconstructed from the information state that existed before the July 2017 specialist synthesis acquired authority. The finished note is not allowed to authenticate the adequacy of the process that produced it.',q:'Priorness tells us where to begin, not what conclusion we must reach.',u:'./governing_framework.html'},
{g:'↯',l:'The open problem',t:'The case entered Neurology as one integrated problem.',c:'Primary care linked painful abnormal feet, abnormal gait, toe clawing, increased tone, movement-initiation difficulty and functional decline. Neurology then recognised severe young-onset Parkinsonism and also directly observed a dystonic-looking lower-limb posture.',q:'The bounded question was the relationship between the painful/structurally abnormal feet and the dystonic-looking lower limb.',u:'./medical_record.html'},
{g:'!',l:'The correction signal',t:'Before closure, the patient says he said the problem was still not dealt with.',c:'For this reconstruction, the pre-discharge Protest is the decisive chronological event. It did not require the patient to diagnose dystonia or PRKN disease. It said something simpler: the problem that brought him into care remained inadequately addressed while discharge was imminent.',q:'Notice → remaining opportunity → response or non-response → final documentary synthesis.',u:'./governing_framework.html'},
{g:'◇',l:'The phase change',t:'The discharge synthesis changed the kind of object the case was.',c:'The open bedside state became a travelling specialist information state. The Parkinsonian branch became neurologically elaborate; the feet acquired structural, podiatric and possible peripheral-neuropathy routes. The question is whether the bridge between those branches was clinically earned before the account became authoritative.',q:'The document is evidence of how the episode was ultimately represented; it is not proof that the underlying process was adequate.',u:'./complexity.html'},
{g:'≋',l:'One history',t:'There are not two histories. There is one history and a documentary overlay.',c:'The Protest, the later decisions, the later care, the distress, the complaint and the eventual reopening all belong to the same history. What can diverge is representation: a record can omit an event while the patient continues to know that it happened.',q:'A patient cannot be required to adopt the omissions of his medical record as omissions from his own life.',u:'./ethics_narrative.html'},
{g:'↔',l:'The stress tests',t:'Later evidence matters because it crosses the old boundary.',c:'Procyclidine withdrawal, later neurological reclassification of a foot-drop-like movement, morning warm-up, OFF-related pain and dystonia, dopaminergic relief and eventual PRKN/PARK2 confirmation do not act as a time machine. They test whether the founding allocation remained corrigible.',q:'The longitudinal question is not merely whether care changed, but what was allowed to change the founding account.',u:'./medical_record.html'},
{g:'L',l:'The levodopa asymmetry',t:'The most visible later controversy may not be the most prior one.',c:'The 2017 synthesis carefully explains why levodopa was delayed: age, risk, strategy, patient understanding and even possible future regret. That may be responsible documentation. But it also means the later treatment-timing allegation is unusually easy to defend compared with the earlier question of what happened after direct notice about the unresolved foot problem.',q:'Even a completely justified decision to delay levodopa does not answer how the disputed foot–movement allocation acquired authority after notice.',u:'./governing_framework.html'},
{g:'⌁',l:'Corrigibility',t:'Local clinical adaptability is not the same as global reconstruction.',c:'The later service was active: treatment changed, symptoms were revisited, alternatives were investigated and external review eventually occurred. The narrower question is whether materially boundary-crossing evidence could alter the epistemic status of the founding allocation itself.',q:'A framework about corrigibility must itself be capable of losing.',u:'./argument_register.html'},
{g:'§',l:'Governance and proof',t:'Once the omitted event is formally restored, the completeness of the record itself is in issue.',c:'Governance can validly review longitudinal treatment yet still fail to reconstruct how the founding information state was created. Historical preservation does not require historical immunity. Stronger allegations about knowledge or intention require separate provenance evidence.',q:'Function first. Knowledge next. Intention only where the evidence supports it.',u:'./legal_shape.html'},
{g:'→',l:'Continue',t:'Now choose how deep you want to go.',c:'The repository is arranged so the reader can move from the governing theory to the source chronology, then into close reading, ethics, legal shape and the full argument register.',q:'Evidence controls facts. Analysis controls inference.',u:'./governing_framework.html',repo:true}
];const repoLinks=[['◉','Framework','./governing_framework.html'],['⌕','Clinical record','./medical_record.html'],['◇','Close reading','./complexity.html'],['≋','Ethics','./ethics_narrative.html'],['§','Legal map','./legal_shape.html'],['100','Arguments','./argument_register.html']];
let i=0,down=false,sx=0,dx=0;const card=document.getElementById('card'),glyph=document.getElementById('glyph'),step=document.getElementById('step'),label=document.getElementById('label'),title=document.getElementById('title'),copy=document.getElementById('copy'),quote=document.getElementById('quote'),open=document.getElementById('open'),fill=document.getElementById('fill'),rail=document.getElementById('rail'),repo=document.getElementById('repo');pages.forEach((p,n)=>{const b=document.createElement('button');b.textContent=n+1;b.title=p.l;b.onclick=()=>{i=n;render()};rail.appendChild(b)});repoLinks.forEach(([g,n,u])=>{const a=document.createElement('a');a.href=u;a.innerHTML='<i>'+g+'</i><span>'+n+'</span>';repo.appendChild(a)});function render(){const p=pages[i];glyph.textContent=p.g;step.textContent='Step '+String(i+1).padStart(2,'0')+' / '+pages.length;label.textContent=p.l;title.textContent=p.t;copy.textContent=p.c;quote.textContent=p.q;open.href=p.u;open.firstChild.textContent=p.repo?'Begin with the framework ':'Open the relevant page ';repo.hidden=!p.repo;[...rail.children].forEach((b,n)=>b.classList.toggle('active',n===i));fill.style.width=((i+1)/pages.length*100)+'%';history.replaceState(null,'','#step-'+(i+1))}function go(d){i=Math.max(0,Math.min(pages.length-1,i+d));render()}card.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;down=true;sx=e.clientX;dx=0;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;card.style.transform='translateX('+dx+'px) rotate('+(dx/90)+'deg)';card.style.opacity=Math.max(.72,1-Math.abs(dx)/700)});function up(){if(!down)return;down=false;card.style.transform='';card.style.opacity='';if(Math.abs(dx)>90)go(dx<0?1:-1);dx=0}card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);card.addEventListener('click',e=>{if(e.target.closest('a')||Math.abs(dx)>8)return;const r=card.getBoundingClientRect(),x=e.clientX-r.left;if(x<r.width*.24)go(-1);else if(x>r.width*.76)go(1)});addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}});const m=location.hash.match(/step-(\d+)/);if(m)i=Math.max(0,Math.min(pages.length-1,+m[1]-1));render();</script></body></html>
