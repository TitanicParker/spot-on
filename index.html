<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1720"><title>Spot On — Read the Case</title><style>:root{--bg:#0f1720;--panel:#17222d;--text:#f7f9fb;--muted:#a7b3bc;--line:rgba(255,255,255,.11);--blue:#78aef6;--yellow:#f2cf63;--red:#e77777;--shadow:0 34px 100px rgba(0,0,0,.38)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 15% 0%,rgba(70,108,164,.22),transparent 30rem),radial-gradient(circle at 90% 85%,rgba(122,83,55,.16),transparent 28rem),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{overflow:hidden}.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 4px 1fr auto;padding:10px 14px 12px}.top{display:flex;align-items:center;min-height:42px;gap:12px}.brand{font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.58)}.brand b{color:#fff}.topnav{margin-left:auto;display:flex;gap:10px}.topnav a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:750}.progress{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red));transition:width .24s ease}.stage{display:grid;place-items:center;min-height:0;padding:14px 0}.wrap{position:relative;width:min(900px,100%);height:min(74vh,760px);touch-action:pan-y}.card{position:absolute;inset:0;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),var(--panel);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:1fr auto;transition:transform .22s ease,opacity .18s ease}.content{padding:clamp(28px,5vw,52px);display:flex;flex-direction:column;justify-content:center;min-height:0}.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.glyph{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.035);font-size:16px}.counter{margin-left:auto;color:rgba(255,255,255,.34);letter-spacing:.08em}.content h1{margin:0;max-width:820px;font-size:clamp(2.15rem,5.4vw,4.7rem);line-height:.98;letter-spacing:-.045em;font-weight:760}.summary{margin:26px 0 0;max-width:780px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.06rem,2.1vw,1.38rem);line-height:1.55;color:#d7e0e5}.key{margin-top:22px;max-width:760px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(.98rem,1.8vw,1.18rem);line-height:1.45;color:var(--yellow)}.key:before{content:'Key point · ';font-family:Inter,Arial,sans-serif;font-size:.72em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,207,99,.7)}.repo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:24px;max-width:720px}.repo a{display:flex;align-items:center;gap:9px;text-decoration:none;color:#eef3f6;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);font-size:12px;font-weight:760}.repo i{font-style:normal;color:var(--blue)}.foot{border-top:1px solid var(--line);padding:14px clamp(24px,5vw,48px);display:flex;align-items:center;gap:12px}.open{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-size:12px;font-weight:850}.open span{color:var(--blue);font-size:16px}.hint{margin-left:auto;color:rgba(255,255,255,.32);font-size:11px}.rail{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding-top:6px}.rail button{width:9px;height:9px;border:0;border-radius:99px;padding:0;background:rgba(255,255,255,.18);cursor:pointer}.rail button.active{width:28px;background:#fff}.rail button:hover{background:rgba(255,255,255,.55)}@media(max-width:700px){body{background:var(--bg)}.app{height:100dvh;padding:0 0 env(safe-area-inset-bottom);grid-template-rows:3px minmax(0,1fr) 24px}.top{display:none}.progress{border-radius:0;height:3px}.stage{padding:8px;min-height:0}.wrap{width:100%;height:100%;max-height:none}.card{border-radius:20px;box-shadow:none}.content{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 18px}.eyebrow{margin:0 0 22px;min-height:14px;justify-content:flex-end}.glyph,#label{display:none}.counter{margin:0;color:rgba(255,255,255,.38);font-size:10px;letter-spacing:.13em}.content h1{font-size:clamp(2rem,10.2vw,3.15rem);line-height:1.01;letter-spacing:-.042em;max-width:none}.summary{margin-top:24px;font-size:clamp(1.03rem,4.65vw,1.2rem);line-height:1.58;color:#eef2f4;max-width:none}.key{display:none}.repo{grid-template-columns:1fr 1fr;margin-top:22px}.repo a{padding:12px 10px;font-size:11px}.foot{padding:13px 20px calc(13px + env(safe-area-inset-bottom));background:rgba(10,17,24,.28)}.open{font-size:11px;color:rgba(255,255,255,.86)}.open span{font-size:15px}.hint{display:none}.rail{padding:7px 0 5px;align-items:center}.rail button{width:7px;height:7px}.rail button.active{width:22px}.rail button:hover{background:rgba(255,255,255,.18)} }@media(max-width:380px){.content{padding-left:17px;padding-right:17px}.content h1{font-size:clamp(1.82rem,9.4vw,2.7rem)}.summary{font-size:1rem}.foot{padding-left:17px;padding-right:17px}}@media(max-height:620px) and (max-width:700px){.content{padding-top:18px}.eyebrow{margin-bottom:14px}.content h1{font-size:clamp(1.72rem,8.2vw,2.45rem)}.summary{font-size:.98rem;line-height:1.5;margin-top:16px}.repo{margin-top:12px}.foot{padding-top:10px;padding-bottom:10px}}@media(prefers-reduced-motion:reduce){.card,.progress>div{transition:none}}</style></head><body><div class="app"><header class="top"><div class="brand"><b>Spot On</b> · read the case</div><nav class="topnav"><a href="./README.md">README</a><a href="./medical_record.html">Record</a><a href="./arguments.html">100 Arguments</a></nav></header><div class="progress"><div id="fill"></div></div><main class="stage"><div class="wrap"><article class="card" id="card"><section class="content"><div class="eyebrow"><div class="glyph" id="glyph"></div><span id="label"></span><span class="counter" id="counter"></span></div><h1 id="title"></h1><p class="summary" id="copy"></p><p class="key" id="key"></p><div class="repo" id="repo" hidden></div></section><footer class="foot"><a class="open" id="open" href="#">Open this section <span>→</span></a><span class="hint">Swipe · tap left/right · ← →</span></footer></article></div></main><footer class="rail" id="rail" aria-label="Reading path"></footer></div><script>const pages=[{g:'◎',l:'Orientation',t:'Start before the record knew the answer.',c:'Reconstruct the information state that existed before the July 2017 specialist synthesis acquired authority. The finished note cannot be used to prove that the process which produced it was adequate.',k:'Priorness tells us where to begin, not what conclusion we must reach.',u:'./governing_framework.html'},{g:'↯',l:'The open problem',t:'The case entered Neurology as one integrated problem.',c:'Primary care linked painful abnormal feet, abnormal gait, toe clawing, increased tone, movement-initiation difficulty and functional decline. Neurology then recognised severe young-onset Parkinsonism and directly observed a dystonic-looking lower-limb posture.',k:'The question was the relationship between the painful feet and the dystonic-looking lower limb.',u:'./medical_record.html'},{g:'!',l:'The correction signal',t:'Before closure, the patient says he told the neurologist the problem was still not dealt with.',c:'The Protest did not require the patient to diagnose dystonia or PRKN disease. Its content was simpler: the problem that brought him into care remained inadequately addressed while discharge was imminent.',k:'Notice → remaining opportunity → response or non-response → final documentary synthesis.',u:'./governing_framework.html'},{g:'◇',l:'The phase change',t:'The discharge synthesis changed the kind of object the case was.',c:'An open bedside state became a travelling specialist information state. The Parkinsonian branch became neurologically elaborate; the feet acquired structural, podiatric and possible peripheral-neuropathy routes.',k:'The issue is whether the bridge between those branches was clinically earned before the account became authoritative.',u:'./complexity.html'},{g:'≋',l:'One history',t:'There are not two histories. There is one history and a documentary overlay.',c:'The Protest, later care, later distress, the complaint and the eventual reopening all belong to the same history. A record can omit an event while the patient continues to know that it happened.',k:'A patient cannot be required to adopt the omissions of his medical record as omissions from his own life.',u:'./ethics_narrative.html'},{g:'↔',l:'The stress tests',t:'Later evidence matters because it crosses the old boundary.',c:'Procyclidine withdrawal, neurological reclassification of a foot-drop-like movement, morning warm-up, OFF-related pain and dystonia, dopaminergic relief and eventual PRKN/PARK2 confirmation all put pressure on the founding allocation.',k:'Later evidence tests corrigibility; it is not a time machine.',u:'./medical_record.html'},{g:'L',l:'The levodopa asymmetry',t:'The most visible later controversy may not be the most prior one.',c:'The 2017 synthesis carefully explains why levodopa was delayed. That makes treatment timing unusually easy to defend compared with the earlier question of what happened after direct notice about the unresolved foot problem.',k:'Even a justified decision to delay levodopa does not answer how the foot–movement allocation acquired authority after notice.',u:'./governing_framework.html'},{g:'⌁',l:'Corrigibility',t:'Local clinical adaptability is not the same as global reconstruction.',c:'Treatment changed, symptoms were revisited and external review eventually occurred. The narrower question is whether materially boundary-crossing evidence could alter the epistemic status of the founding allocation itself.',k:'A framework about corrigibility must itself be capable of losing.',u:'./arguments.html'},{g:'§',l:'Governance and proof',t:'Once the omitted event is formally restored, the completeness of the record itself is in issue.',c:'Governance can validly review longitudinal treatment and still leave unanswered how the founding information state was created. Stronger allegations about knowledge or intention require separate provenance evidence.',k:'Function first. Knowledge next. Intention only where the evidence supports it.',u:'./legal_shape.html'},{g:'→',l:'Continue',t:'Choose how deep you want to go.',c:'Move from the governing theory to the source chronology, then into close reading, ethics, legal shape and the full argument deck.',k:'Evidence controls facts. Analysis controls inference.',u:'./governing_framework.html',repo:true}];const repoLinks=[['◉','Framework','./governing_framework.html'],['⌕','Clinical record','./medical_record.html'],['◇','Close reading','./complexity.html'],['≋','Ethics','./ethics_narrative.html'],['§','Legal map','./legal_shape.html'],['100','Arguments','./arguments.html']];let i=0,down=false,sx=0,dx=0;const card=document.getElementById('card'),glyph=document.getElementById('glyph'),label=document.getElementById('label'),counter=document.getElementById('counter'),title=document.getElementById('title'),copy=document.getElementById('copy'),key=document.getElementById('key'),open=document.getElementById('open'),fill=document.getElementById('fill'),rail=document.getElementById('rail'),repo=document.getElementById('repo');pages.forEach((p,n)=>{const b=document.createElement('button');b.title=(n+1)+'. '+p.l;b.onclick=()=>{i=n;render()};rail.appendChild(b)});repoLinks.forEach(([g,n,u])=>{const a=document.createElement('a');a.href=u;a.innerHTML='<i>'+g+'</i><span>'+n+'</span>';repo.appendChild(a)});function render(){const p=pages[i];glyph.textContent=p.g;label.textContent=p.l;counter.textContent=(i+1)+' / '+pages.length;title.textContent=p.t;copy.textContent=p.c;key.textContent=p.k;open.href=p.u;open.childNodes[0].nodeValue=p.repo?'Begin with the framework ':'Open this section ';repo.hidden=!p.repo;[...rail.children].forEach((b,n)=>b.classList.toggle('active',n===i));fill.style.width=((i+1)/pages.length*100)+'%';history.replaceState(null,'','#step-'+(i+1))}function go(d){i=Math.max(0,Math.min(pages.length-1,i+d));render()}card.addEventListener('pointerdown',e=>{if(e.target.closest('a'))return;down=true;sx=e.clientX;dx=0;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;card.style.transform='translateX('+dx+'px) rotate('+(dx/110)+'deg)';card.style.opacity=Math.max(.74,1-Math.abs(dx)/750)});function up(){if(!down)return;down=false;card.style.transform='';card.style.opacity='';if(Math.abs(dx)>90)go(dx<0?1:-1);dx=0}card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);card.addEventListener('click',e=>{if(e.target.closest('a'))return;const r=card.getBoundingClientRect(),x=e.clientX-r.left;if(x<r.width*.22)go(-1);else if(x>r.width*.78)go(1)});addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}});const m=location.hash.match(/step-(\d+)/);if(m)i=Math.max(0,Math.min(pages.length-1,+m[1]-1));render();</script></body></html>
