<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1720"><title>Spot On — Read the Case</title><style>:root{--bg:#0f1720;--panel:#17222d;--text:#f7f9fb;--muted:#a7b3bc;--line:rgba(255,255,255,.11);--blue:#78aef6;--yellow:#f2cf63;--red:#e77777;--shadow:0 34px 100px rgba(0,0,0,.38)}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{overflow:hidden}.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 4px 1fr;padding:10px 14px 12px;background:radial-gradient(circle at 15% 0%,rgba(70,108,164,.22),transparent 30rem),radial-gradient(circle at 90% 85%,rgba(122,83,55,.16),transparent 28rem),var(--bg)}.top{display:flex;align-items:center;min-height:42px}.brand{font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.58)}.brand b{color:#fff}.progress{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--yellow),var(--red));transition:width .2s ease}.stage{display:grid;place-items:center;min-height:0;padding:14px 0}.wrap{position:relative;width:min(900px,100%);height:min(78vh,790px)}.card{position:absolute;inset:0;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),var(--panel);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:1fr auto;transition:transform .18s ease,opacity .16s ease;touch-action:pan-y}.content{padding:clamp(28px,5vw,52px);display:flex;flex-direction:column;justify-content:center;min-height:0}.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.glyph{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.035);font-size:16px}.counter{margin-left:auto;color:rgba(255,255,255,.34);letter-spacing:.08em}.content h1{margin:0;max-width:820px;font-size:clamp(2.15rem,5.4vw,4.7rem);line-height:.98;letter-spacing:-.045em;font-weight:760}.summary{margin:26px 0 0;max-width:780px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.06rem,2.1vw,1.38rem);line-height:1.55;color:#d7e0e5}.key{margin-top:22px;max-width:760px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(.98rem,1.8vw,1.18rem);line-height:1.45;color:var(--yellow)}.key:before{content:'Key point · ';font-family:Inter,Arial,sans-serif;font-size:.72em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(242,207,99,.7)}.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:26px;max-width:760px}.menu a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#eef3f6;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);font-size:12px;font-weight:780}.menu a:hover{background:rgba(255,255,255,.07)}.menu i{font-style:normal;color:var(--blue)}.foot{border-top:1px solid var(--line);padding:13px clamp(22px,5vw,46px);display:flex;align-items:center;justify-content:flex-end;min-height:62px}.desktopHint{font-size:11px;color:rgba(255,255,255,.28);margin-right:auto}.flickWrap{display:flex;align-items:center;gap:9px}.flickLabel{font-size:10px;color:rgba(255,255,255,.38);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.flickTrack{position:relative;width:96px;height:40px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.05);overflow:hidden;touch-action:none;cursor:pointer}.flickTrack:before{content:'next';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.24)}.flickThumb{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;background:#fff;color:#101820;display:grid;place-items:center;font-size:16px;font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.25);transition:transform .16s ease}.restart{display:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dbe4ea;border-radius:999px;padding:10px 14px;font-weight:800;font-size:11px;cursor:pointer}.final .flickWrap,.final .desktopHint{display:none}.final .restart{display:inline-flex}@media(max-width:700px){.app{padding:0;grid-template-rows:3px minmax(0,1fr);background:var(--bg)}.top{display:none}.progress{height:3px;border-radius:0}.stage{padding:8px}.wrap{width:100%;height:100%}.card{border-radius:20px;box-shadow:none}.content{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 18px}.eyebrow{margin:0 0 22px;justify-content:flex-end}.glyph,#label{display:none}.counter{margin:0;color:rgba(255,255,255,.42);font-size:10px;letter-spacing:.13em}.content h1{font-size:clamp(2rem,10.2vw,3.15rem);line-height:1.01;letter-spacing:-.042em;max-width:none}.summary{margin-top:24px;font-size:clamp(1.03rem,4.65vw,1.2rem);line-height:1.58;color:#eef2f4;max-width:none}.key{display:none}.menu{grid-template-columns:1fr 1fr;margin-top:22px}.menu a{padding:13px 11px;font-size:11px}.foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));min-height:58px;background:rgba(10,17,24,.28)}.desktopHint{display:none}.flickTrack{width:100px;height:40px}.flickLabel{font-size:9px}.restart{font-size:10px}}@media(max-width:380px){.content{padding-left:17px;padding-right:17px}.content h1{font-size:clamp(1.82rem,9.4vw,2.7rem)}.summary{font-size:1rem}.menu{grid-template-columns:1fr 1fr}.menu a{padding:12px 9px}.foot{padding-left:12px;padding-right:12px}}@media(max-height:620px) and (max-width:700px){.content{padding-top:18px}.eyebrow{margin-bottom:14px}.content h1{font-size:clamp(1.72rem,8.2vw,2.45rem)}.summary{font-size:.98rem;line-height:1.5;margin-top:16px}.menu{margin-top:14px}.foot{min-height:52px;padding-top:7px;padding-bottom:7px}}@media(prefers-reduced-motion:reduce){.card,.progress>div,.flickThumb{transition:none}}</style></head><body><div class="app"><header class="top"><div class="brand"><b>Spot On</b> · read the case</div></header><div class="progress"><div id="fill"></div></div><main class="stage"><div class="wrap"><article class="card" id="card"><section class="content"><div class="eyebrow"><div class="glyph" id="glyph"></div><span id="label"></span><span class="counter" id="counter"></span></div><h1 id="title"></h1><p class="summary" id="copy"></p><p class="key" id="key"></p><nav class="menu" id="menu" hidden></nav></section><footer class="foot"><span class="desktopHint">Swipe, flick or use ← →</span><div class="flickWrap"><span class="flickLabel">flick</span><div class="flickTrack" id="flickTrack" role="button" aria-label="Flick left for next card"><div class="flickThumb" id="flickThumb">‹</div></div></div><button class="restart" id="restart">Start again</button></footer></article></div></main></div><script>const pages=[{g:'◎',l:'Orientation',t:'Start before the record knew the answer.',c:'Reconstruct the information state that existed before the July 2017 specialist synthesis acquired authority. The finished note cannot be used to prove that the process which produced it was adequate.',k:'Priorness tells us where to begin, not what conclusion we must reach.'},{g:'↯',l:'The open problem',t:'The case entered Neurology as one integrated problem.',c:'Primary care linked painful abnormal feet, abnormal gait, toe clawing, increased tone, movement-initiation difficulty and functional decline. Neurology then recognised severe young-onset Parkinsonism and directly observed a dystonic-looking lower-limb posture.',k:'The question was the relationship between the painful feet and the dystonic-looking lower limb.'},{g:'!',l:'The correction signal',t:'Before closure, the patient says he told the neurologist the problem was still not dealt with.',c:'The Protest did not require the patient to diagnose dystonia or PRKN disease. Its content was simpler: the problem that brought him into care remained inadequately addressed while discharge was imminent.',k:'Notice → remaining opportunity → response or non-response → final documentary synthesis.'},{g:'◇',l:'The phase change',t:'The discharge synthesis changed the kind of object the case was.',c:'An open bedside state became a travelling specialist information state. The Parkinsonian branch became neurologically elaborate; the feet acquired structural, podiatric and possible peripheral-neuropathy routes.',k:'The issue is whether the bridge between those branches was clinically earned before the account became authoritative.'},{g:'≋',l:'One history',t:'There are not two histories. There is one history and a documentary overlay.',c:'The Protest, later care, later distress, the complaint and the eventual reopening all belong to the same history. A record can omit an event while the patient continues to know that it happened.',k:'A patient cannot be required to adopt the omissions of his medical record as omissions from his own life.'},{g:'↔',l:'The stress tests',t:'Later evidence matters because it crosses the old boundary.',c:'Procyclidine withdrawal, neurological reclassification of a foot-drop-like movement, morning warm-up, OFF-related pain and dystonia, dopaminergic relief and eventual PRKN/PARK2 confirmation all put pressure on the founding allocation.',k:'Later evidence tests corrigibility; it is not a time machine.'},{g:'L',l:'The levodopa asymmetry',t:'The most visible later controversy may not be the most prior one.',c:'The 2017 synthesis carefully explains why levodopa was delayed. That makes treatment timing unusually easy to defend compared with the earlier question of what happened after direct notice about the unresolved foot problem.',k:'Even a justified decision to delay levodopa does not answer how the foot–movement allocation acquired authority after notice.'},{g:'⌁',l:'Corrigibility',t:'Local clinical adaptability is not the same as global reconstruction.',c:'Treatment changed, symptoms were revisited and external review eventually occurred. The narrower question is whether materially boundary-crossing evidence could alter the epistemic status of the founding allocation itself.',k:'A framework about corrigibility must itself be capable of losing.'},{g:'§',l:'Governance and proof',t:'Once the omitted event is formally restored, the completeness of the record itself is in issue.',c:'Governance can validly review longitudinal treatment and still leave unanswered how the founding information state was created. Stronger allegations about knowledge or intention require separate provenance evidence.',k:'Function first. Knowledge next. Intention only where the evidence supports it.'},{g:'→',l:'Continue',t:'Now choose how deep you want to go.',c:'The ten-screen orientation is complete. From here, enter the framework, the record, the close reading, the ethics narrative, the legal map or the argument deck.',k:'Evidence controls facts. Analysis controls inference.',menu:true}];const links=[['◉','Framework','./governing_framework.html'],['⌕','Clinical record','./medical_record.html'],['◇','Close reading','./complexity.html'],['≋','Ethics','./ethics_narrative.html'],['§','Legal map','./legal_shape.html'],['100','Arguments','./arguments.html'],['↗','README','./README.md']];let i=0,mouseDown=false,sx=0,dx=0,fs=0,fd=0,drag=false;const card=document.getElementById('card'),glyph=document.getElementById('glyph'),label=document.getElementById('label'),counter=document.getElementById('counter'),title=document.getElementById('title'),copy=document.getElementById('copy'),key=document.getElementById('key'),menu=document.getElementById('menu'),fill=document.getElementById('fill'),flickTrack=document.getElementById('flickTrack'),flickThumb=document.getElementById('flickThumb'),restart=document.getElementById('restart');links.forEach(([g,n,u])=>{const a=document.createElement('a');a.href=u;a.innerHTML='<i>'+g+'</i><span>'+n+'</span>';menu.appendChild(a)});function render(){const p=pages[i],final=!!p.menu;glyph.textContent=p.g;label.textContent=p.l;counter.textContent=(i+1)+' / '+pages.length;title.textContent=p.t;copy.textContent=p.c;key.textContent=p.k;menu.hidden=!final;card.classList.toggle('final',final);fill.style.width=((i+1)/pages.length*100)+'%';history.replaceState(null,'','#step-'+(i+1))}function go(d){const n=Math.max(0,Math.min(pages.length-1,i+d));if(n===i)return;i=n;render()}restart.onclick=()=>{i=0;render()};card.addEventListener('touchstart',e=>{if(e.target.closest('a,.flickTrack,button'))return;const t=e.changedTouches[0];sx=t.clientX},{passive:true});card.addEventListener('touchend',e=>{if(e.target.closest('a,.flickTrack,button'))return;const t=e.changedTouches[0],d=t.clientX-sx;if(Math.abs(d)>42)go(d<0?1:-1)},{passive:true});card.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.target.closest('a,.flickTrack,button'))return;mouseDown=true;sx=e.clientX;dx=0;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!mouseDown)return;dx=e.clientX-sx;card.style.transform='translateX('+dx+'px)';card.style.opacity=Math.max(.78,1-Math.abs(dx)/700)});function mouseUp(){if(!mouseDown)return;mouseDown=false;card.style.transform='';card.style.opacity='';if(Math.abs(dx)>60)go(dx<0?1:-1);dx=0}card.addEventListener('pointerup',mouseUp);card.addEventListener('pointercancel',mouseUp);flickTrack.addEventListener('pointerdown',e=>{if(i===pages.length-1)return;drag=true;fs=e.clientX;fd=0;flickTrack.setPointerCapture(e.pointerId)});flickTrack.addEventListener('pointermove',e=>{if(!drag)return;fd=Math.max(-54,Math.min(0,e.clientX-fs));flickThumb.style.transition='none';flickThumb.style.transform='translateX('+fd+'px)'});function release(){if(!drag)return;drag=false;flickThumb.style.transition='transform .16s ease';flickThumb.style.transform='translateX(0)';if(fd<-20)go(1);fd=0}flickTrack.addEventListener('pointerup',release);flickTrack.addEventListener('pointercancel',release);flickTrack.addEventListener('click',()=>{if(i<pages.length-1)go(1)});addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}});const m=location.hash.match(/step-(\d+)/);if(m)i=Math.max(0,Math.min(pages.length-1,+m[1]-1));render();</script></body></html>
