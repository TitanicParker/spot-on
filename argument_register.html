<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d14"><title>100 Arguments — Third-Pass Register</title><style>:root{--bg:#090d14;--card:#121824;--card2:#171e2c;--text:#f7f9fc;--muted:#9ca7b7;--accent:#92b9ff;--yellow:#ffda65;--green:#8cdbba;--red:#ff9d9d;--line:rgba(255,255,255,.09);--shadow:0 28px 90px rgba(0,0,0,.5)}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 20% 0%,rgba(72,108,180,.2),transparent 34%),radial-gradient(circle at 90% 12%,rgba(118,78,168,.13),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}.brand{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}.brand a{color:var(--accent);text-decoration:none;text-transform:none;letter-spacing:0}.actions{display:flex;gap:8px}.btn{height:38px;min-width:38px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font:700 12px Arial;cursor:pointer}.stage{display:grid;place-items:center;min-height:0;perspective:1200px}.wrap{position:relative;width:min(800px,100%);height:min(85vh,930px);touch-action:pan-y}.card{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s ease,opacity .2s ease}.visible{padding:clamp(22px,4vw,38px);display:grid;grid-template-rows:auto auto auto 1fr;gap:14px;min-height:0}.meta{display:flex;justify-content:space-between;gap:10px;color:rgba(255,255,255,.44);font-size:12px;font-weight:750}.point{color:var(--accent)}.badge{justify-self:start;padding:6px 9px;border-radius:999px;border:1px solid var(--line);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}.badge.fact{color:#8dd4ff}.badge.premise,.badge.principle{color:var(--yellow)}.badge.inference,.badge.proposition,.badge.argument,.badge.case-theory{color:#d4bbff}.badge.legal{color:#ffb4d2}.badge.question,.badge.governance{color:#ffbd9d}.badge.stress{color:#9fd8ff}.badge.falsifier{color:var(--red)}h1{margin:0;font-size:clamp(20px,3vw,31px);line-height:1.12;letter-spacing:-.025em}.bodywrap{display:grid;align-items:center;min-height:0}.body{margin:0;font-size:clamp(17px,2.2vw,24px);line-height:1.42;letter-spacing:-.01em}.drawer{border-top:1px solid var(--line);background:var(--card2)}summary{list-style:none;cursor:pointer;text-align:center;padding:11px 18px;color:rgba(255,255,255,.45);font-size:12px;font-weight:700}summary::-webkit-details-marker{display:none}.refs{padding:0 18px 16px;text-align:center;color:#cbd9f8;font-size:12px;line-height:1.5}.bottom{padding-top:9px;display:grid;gap:7px}.progress{height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--accent),#cdbbff)}.hint{text-align:center;color:rgba(255,255,255,.3);font-size:11px}.focus .top,.focus .bottom{display:none}.focus .app{grid-template-rows:1fr;padding:6px}.focus .wrap{height:calc(100vh - 12px)}@media(max-width:640px){.brand span{display:none}.visible{padding:20px 18px}.body{font-size:clamp(16px,4.7vw,22px)}h1{font-size:clamp(18px,5.2vw,24px)}}
</style></head><body><div class="app"><header class="top"><div class="brand">100 Arguments <span>· phase-change register</span> · <a href="./index.html">Reading Room</a> · <a href="./governing_framework.html">Framework</a></div><div class="actions"><button class="btn" id="prev">←</button><button class="btn" id="focus">Focus</button><button class="btn" id="next">→</button></div></header><main class="stage"><div class="wrap"><article class="card" id="card"><section class="visible"><div class="meta"><div class="point" id="point"></div><div class="counter" id="counter"></div></div><div class="badge" id="badge"></div><h1 id="title"></h1><div class="bodywrap"><p class="body" id="body"></p></div></section><section class="drawer"><details><summary>Evidence / dependency</summary><div class="refs" id="refs"></div></details></section></article></div></main><footer class="bottom"><div class="progress"><div id="fill"></div></div><div class="hint">Swipe · tap left/right edges · ← → · F focus</div></footer></div><script>const points=[{"t": "Begin before authority", "k": "fact", "b": "The case should be reconstructed from the information state that existed before the discharge synthesis acquired authority. Earlier GP and referral material is not automatically superior, but it is less dependent on the later specialist architecture. That makes it the correct starting point for asking how the final model was built. The governing rule is simple: the final synthesis cannot retrospectively authenticate the adequacy of the process that produced it. Priorness therefore tells us where to begin, not what conclusion we must reach. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "GP record · urgent referral · Framework §2"}, {"t": "The case entered Neurology as one problem", "k": "fact", "b": "Primary care linked bilateral foot pain, abnormal gait, muscle tension, increasing tone, initiation difficulty, toe clawing, declining dexterity and functional deterioration. The referral remained open—parkinsonian or other. The hospital did not receive a pre-separated case called Parkinsonism plus unrelated feet. Any later division between neurological disease and a separate structural/peripheral foot problem was therefore an explanatory allocation made after referral, not a fact already supplied by the referring record. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "April–June 2017 primary care"}, {"t": "The feet were not background detail", "k": "fact", "b": "The feet were part of the originating signal that brought the patient into care. Pain, corns, calluses, deformity and abnormal gait were present before the specialist diagnosis. Later neurological signs widened the problem; they did not erase its starting point. A fair reconstruction therefore cannot demote the feet to incidental podiatry merely because Parkinsonism was subsequently recognised. The correct question is how the earlier foot/gait problem related to the later movement-disorder findings. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "GP record · Podiatry referral"}, {"t": "Structural disease was genuine", "k": "fact", "b": "There is no need to deny the podiatric evidence. Genuine structural and pressure pathology existed, and Podiatry was an appropriate destination for those aspects of care. The analytical mistake would be to treat the existence of structural disease as proof that neurological posture, loading, toe movement or dystonia could not also contribute. Structural and neurological mechanisms can coexist. The case is therefore about relationship and integration, not about choosing one specialty and declaring the other irrelevant. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "GP / Podiatry / July examination"}, {"t": "The referral already contained a movement-disorder pattern", "k": "fact", "b": "Before the specialist synthesis, the urgent referral already described a young patient with stiff or festinant gait, difficulty initiating movement, increased tone, brisk reflexes, possible cogwheeling, toe clawing and worsening dexterity. This is not hindsight diagnosis of dystonia. It is contemporaneous evidence that the lower-limb problem already contained movement-disorder features. A movement-disorders specialist later reviewing the sequence would not be starting from an isolated complaint of sore feet. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "29 June 2017 referral"}, {"t": "Neurology recognised genuine severe Parkinsonism", "k": "fact", "b": "The repository does not depend on denying the central diagnostic achievement. Neurology documented severe young-onset Parkinsonism with marked rigidity, bradykinesia and a striking gait. Later DaTscan, external specialist opinion and eventual genetics substantially support the reality of that syndrome. Any theory that requires Parkinsonism itself to have been a simple misdiagnosis is weaker than the evidence and should be rejected. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history. Where the source record conflicts with this card, the source record controls.", "r": "July 2017 Neurology · DaTscan · later genetics"}, {"t": "Neurology also saw the competing sign", "k": "fact", "b": "In the same founding admission, Neurology described the lower-limb appearance as somewhat suggestive of a dystonic posture and expressly distinguished it from true foot drop. That is a direct specialist observation, not a later patient reinterpretation. The unresolved relationship was therefore visible inside the original specialist information state itself: severe Parkinsonism, genuine structural feet and a dystonic-looking lower-limb phenomenon coexisted before the final explanatory architecture was settled. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "July 2017 specialist examination"}, {"t": "PRKN was already in the clinical imagination", "k": "fact", "b": "PRKN/PARK2 was considered in 2017 and an external specialist soon regarded PARK2 as probable. The later molecular confirmation therefore did not reveal a disease family that had been unimaginable at the time. This is important for anti-hindsight discipline: the genetics cannot be projected backwards as knowledge clinicians possessed, but the possibility of monogenic Parkinsonism was already part of contemporaneous reasoning. The later result tests how the observed dystonic branch was integrated, not whether genetics should have been magically known. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "2017 Neurology · Healy opinion · 2026 genetics"}, {"t": "Phenomenological difference is not biological independence", "k": "proposition", "b": "The patient appears to have described foot pain and leg tension as different experiences. That distinction is clinically relevant and may genuinely support partial separation. But two experiences can feel different while still arise from interacting mechanisms. A patient ability to distinguish pain from tension cannot, by itself, establish that structural foot disease and neurological movement were biologically independent. The specialist synthesis was entitled to consider separation; the question is what evidence justified the strength and durability eventually given to that separation. The proposition should remain testable against competing explanations and should never be promoted into an established fact merely because later records repeat it.", "r": "July 2017 patient-attributed history"}, {"t": "The bounded question was already visible", "k": "proposition", "b": "By the time of the admission, the clinically bounded question was simple enough to state without hindsight: what was the relationship between painful and structurally abnormal feet and the dystonic-looking lower limb? The answer could have been mixed, uncertain or separate. The important point is that the relationship itself was material. Later PRKN evidence does not create that question; it confirms that neurological continuity was biologically plausible in the disease ultimately present. The proposition should remain testable against competing explanations and should never be promoted into an established fact merely because later records repeat it.", "r": "Founding information state"}, {"t": "The discharge summary was a phase change", "k": "inference", "b": "The July synthesis did more than record a day in the chronology. It converted an open clinical state into a portable specialist model. Before it, observations could still be organised in several ways. After it, later clinicians inherited categories, causal possibilities and future ownership already arranged for them. That change in documentary authority alters how downstream evidence must be interpreted. Later repetition can no longer be assumed independent, because the summary itself may have shaped what later observers expected to see. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "Framework §6"}, {"t": "The document organised two different futures", "k": "inference", "b": "The Parkinsonian branch became neurologically elaborate—young onset, genetics, imaging, prognosis and treatment. The foot territory acquired a different route—structural lesions, burning, possible separation, possible peripheral neuropathy, possible alcohol contribution and Podiatry. Each route may contain reasonable propositions. The close-reading issue is that the bridge between them received less visible development than either branch. That is why the case concerns explanatory allocation rather than merely diagnostic accuracy. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "2017 discharge synthesis"}, {"t": "A destination is not an explanation", "k": "proposition", "b": "Podiatry was a legitimate destination for genuine structural foot disease. But assigning a destination does not answer the biological relationship between abnormal movement and foot pathology. A service can correctly refer structural lesions to Podiatry while still retaining neurological responsibility for how dystonia, posture, loading and pain interact. Treating the destination as proof of independence would substitute service ownership for causal reasoning. The proposition should remain testable against competing explanations and should never be promoted into an established fact merely because later records repeat it. Where the source record conflicts with this card, the source record controls.", "r": "Podiatry pathway · Framework §3"}, {"t": "The Protest attacked completion, not diagnosis", "k": "premise", "b": "The pre-discharge correction signal did not require the patient to diagnose dystonia or PRKN disease. Its content was more basic: the problem that brought him into care remained inadequately addressed and discharge therefore felt incomplete. This matters because it avoids hindsight. The patient was not claiming the final molecular answer in advance; he was identifying unresolved clinical work before closure, while the service still had an opportunity to respond. For this personal reconstruction the premise controls the chronology, while any external legal or regulatory use would still require whatever independent proof the forum demands.", "r": "Fixed personal premise"}, {"t": "Notice changes the chronology", "k": "premise", "b": "Once direct notice is placed before finalisation, the sequence becomes pre-notice provisional reasoning, Protest, remaining opportunity, and post-notice authoritative finalisation. That does not mean every phrase in the final synthesis was invented after notice. It means the final product must be assessed as a post-notice act: what did the clinician do after being told the originating problem remained unresolved, and how did that response affect the record that later governed the case? For this personal reconstruction the premise controls the chronology, while any external legal or regulatory use would still require whatever independent proof the forum demands.", "r": "Framework §4"}, {"t": "The missing middle was broad", "k": "proposition", "b": "The service did not face a binary choice between restarting the whole admission and ignoring the concern. Proportionate options included focused re-examination, explicit mixed-mechanism formulation, movement-disorders input, a neurological question to Podiatry, documentation of disagreement, preservation of uncertainty, or a defined return condition. The case does not require proof that one particular test was mandatory. It asks whether some adequate bridge existed between direct notice and final closure. The proposition should remain testable against competing explanations and should never be promoted into an established fact merely because later records repeat it.", "r": "Choice-space analysis"}, {"t": "Premature documentary closure is the mechanism", "k": "case theory", "b": "The mature hypothesis is that a still-contestable relationship may have acquired documentary settlement before the visible post-notice process had earned that level of authority. This is not the same as saying the diagnosis was wrong. Parkinsonism was real and PRKN was perceptively considered. The potential defect is informational: a plausible separation may have become a durable travelling fact without an adequately demonstrated reassessment, resolution or explicit preservation of uncertainty after corrective notice. This formulation deliberately leaves room for a competent innocent explanation and identifies the evidence that could defeat the stronger concerning account.", "r": "Core case theory"}, {"t": "The record can be accurate sentence by sentence and still misstate status", "k": "inference", "b": "A documentary problem does not require an obviously false sentence. Selection, grouping, omission and unequal preservation can change the apparent epistemic state while each surviving proposition remains defensible. A later reader may reasonably infer that a relationship was considered and disposed of even if the underlying process remained more uncertain. The relevant question is whether the record accurately transmitted not only facts, but also which propositions were observations, which were hypotheses, and which remained contested. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "Record integrity analysis"}, {"t": "Confirmatory patient material travelled", "k": "inference", "b": "The synthesis preserves patient-attributed material that supports separation: reduced pain, different experiences and strong language of personal distinction. On the Protest premise, the patient contrary challenge to adequate closure does not travel with equivalent force. That creates a patient–record asymmetry. It does not prove deliberate omission. It establishes a functional difference in what later readers are allowed to know about the patient own epistemic position. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "2017 synthesis · Protest premise"}, {"t": "The phase change alters the negligence chronology", "k": "case theory", "b": "In an ordinary chronology, later notes may simply add evidence. Here, the discharge synthesis changes the evidential meaning of what comes after it. Post-summary notes are partly generated inside an inherited model. That means the alleged breach must be reconstructed at the threshold where the open problem became authoritative history. Downstream consistency may demonstrate management, but it cannot retroactively prove that the pre-closure process was adequate. The case therefore turns on the creation of the information state, not merely on its later use. This formulation deliberately leaves room for a competent innocent explanation and identifies the evidence that could defeat the stronger concerning account.", "r": "Phase-change theory"}, {"t": "Duty is conventional; the factual location is unusual", "k": "legal", "b": "The legal framework remains conventional: competent specialist care, appropriate communication, accurate record-making, breach, causation and harm. What is unusual is where the alleged breach may sit. The core question concerns the period after direct corrective notice but before the travelling specialist record acquired authority. Independent expert evidence must decide what competent 2017 specialist care required in that situation. Documentary analysis can identify the question; it cannot supply the professional standard by itself. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Legal Shape §3"}, {"t": "The breach theory is process-based", "k": "legal", "b": "The strongest breach theory is not failure to diagnose dystonia. It is that a material relationship may have remained unresolved after direct notice and yet been closed with more authority than the visible inquiry justified. A competent process might have reached the same ultimate disposition. The legal question is whether the route to that disposition included the proportionate reassessment, reasoning, uncertainty-preservation or follow-up that the circumstances required. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Legal Shape §4"}, {"t": "The burden is what happened after notice", "k": "legal", "b": "Once notice is accepted for this reconstruction, the central burden is not on the patient to re-prove the entire case from later records. The question becomes: what response did the clinical system make to the notice it had actually received before finalisation? That is the temporal point at which the system still possessed both the patient and the unfinished account. The answer should be sought in clinical acts and contemporaneous reasoning, not only in the coherence of the final synthesis. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Notice / breach analysis"}, {"t": "Absence must remain a documentary negative", "k": "falsifier", "b": "The current record may not show a targeted post-Protest reassessment. That supports “not demonstrated,” not automatically “never happened.” A fair case must preserve the possibility of undocumented but adequate clinical reasoning. The decisive evidence would be contemporaneous notes, recollection, drafts, clinical video, colleague discussions and expert assessment of what would reasonably have been recorded. Turning documentary absence into absolute proof would reproduce the same self-sealing error the case criticises. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it.", "r": "Evidential discipline"}, {"t": "The theory can lose", "k": "falsifier", "b": "A strong theory identifies its own defeat conditions. Targeted reassessment after the Protest, pre-notice source material authenticating the same strong separation language, an explicit reason why further inquiry was unnecessary, later model-level reconstruction, or expert evidence that no additional relational work was required could materially weaken the case. If every new source were reinterpreted as support, the repository would become as incorrigible as the model it challenges. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it.", "r": "Framework falsifiability"}, {"t": "The 2017 standard needs an expert", "k": "legal", "b": "Later PRKN genetics and modern understanding cannot establish the 2017 standard of care. An appropriately instructed movement-disorders or neurology expert must answer what a reasonably competent specialist should have done with the information then available: young age, structural feet, severe Parkinsonism, toe clawing, dystonic-looking lower-limb posture and direct corrective notice. The expert should be asked about process and proportionality, not forced into the false question of whether the genotype should have been known. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Expert proof requirement"}, {"t": "Same outcome does not automatically mean no breach", "k": "legal", "b": "It is possible that a competent process would have reached the same broad diagnosis and even the same immediate treatment plan. That does not automatically answer whether the process was adequate. Negligence analysis can distinguish outcome from method. Conversely, a later better explanation does not prove the earlier method negligent. The correct legal question is whether the actual clinical steps met the required standard given the information and notice available at the time. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Breach analysis"}, {"t": "The record is part of the clinical mechanism", "k": "legal", "b": "Record-making is not merely administrative when the record determines what later clinicians inherit. If an unresolved relationship is presented as more settled than it actually was, the informational state can shape future diagnosis, treatment and review. The legal significance of that effect depends on professional standards and causation, but analytically the record is part of the pathway, not a neutral after-the-fact description of it. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Record integrity"}, {"t": "Prima facie does not mean proved", "k": "legal", "b": "For personal understanding, the case can be organised into a prima facie analytical sequence: duty, material unresolved relationship, direct notice, remaining opportunity, possible inadequate post-notice response, authoritative documentary closure, downstream inheritance, later boundary-crossing evidence, harm, and a plausible causal pathway. That sequence identifies what must be proved. It does not itself establish negligence. The weakest links—standard of care, exact post-notice conduct and causation—remain expert- and evidence-dependent. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Legal Shape §10"}, {"t": "The legal case should stay narrower than the moral suspicion", "k": "legal", "b": "Strong moral intuitions about being unheard should not expand the legal theory beyond the evidence. The most defensible legal case does not require dishonesty, conspiracy, fabrication or malicious motive. It can succeed or fail on ordinary questions of competent inquiry, accurate transmission of uncertainty and causal harm. Keeping the legal theory narrower protects the analysis from being weakened by allegations that require a much higher evidential threshold. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Legal limits"}, {"t": "2018 crossed the old boundary", "k": "stress", "b": "When procyclidine was withdrawn, one of the first rapidly changing problems was in the disputed foot territory, alongside worsening movement and tension. Improvement followed restoration of treatment. This does not prove the corn itself was dystonic or that all pain was neurological. It does create dynamic evidence that the foot territory was partly sensitive to movement-disorder treatment state. The question is whether that observation altered the status of the original separation or was simply accommodated locally. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "2018 clinic record"}, {"t": "2020 produced an internal neurological reclassification", "k": "stress", "b": "A later foot-drop-like lower-limb “throw” was judged “actually parkinsonian” because ankle and foot power were normal. This is important because it is new clinician-generated evidence, not a patient theory. A conspicuous phenomenon in the disputed territory was reclassified neurologically. Yet the retained record does not visibly use that correction to reconstruct the earlier 2017 relationship. It behaves like a local patch rather than a root-model rewrite. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "2020 clinic record"}, {"t": "The shoulder episode is a fair comparator", "k": "stress", "b": "In 2019 the service carefully distinguished a painful shoulder/arm syndrome as probably not primarily Parkinsonian while allowing Parkinsonism to amplify pain and ordering structural investigation. That matters because it shows the clinician was capable of mixed-mechanism reasoning and targeted localisation. The comparison is not “he investigated the shoulder, therefore he was negligent about the feet.” It asks whether the founding foot relationship ever received an equivalent explicit reconstruction when later evidence pressured it. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "2019 clinic record"}, {"t": "2022 preserved a state-dependent pattern", "k": "stress", "b": "The feet required time to “warm up” in the morning and remained painful with corns, calluses and cramping questions. This is not a diagnostic test. Its importance is temporal: the disputed territory continued to display state-dependent behaviour while the Parkinsonian treatment framework evolved. A genuinely corrigible founding model should remain capable of asking whether accumulating temporal patterns change the earlier allocation, even where no single observation is decisive. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "2022 clinic record"}, {"t": "2023 almost reopened the founding question", "k": "stress", "b": "Severe foot pain, cramping and walking failure led to explicit consideration of OFF dystonia. Leg pain and shuffling were treated as OFF-related. The clinician acknowledged a “misalignment” and recognised that the first symptoms were in the feet. This is genuine reflection, not simple rigidity. The remaining question is whether the historical allocation itself changed or whether OFF dystonia, pain amplification and a continuing separate foot problem were allowed to coexist without reconstructing the original join. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "2023 clinic / nurse notes"}, {"t": "Misalignment is continuity evidence", "k": "inference", "b": "The 2023 “misalignment” matters beyond the immediate visit. On the Protest premise, it is consistent with a disagreement that began before discharge rather than one invented years later. It does not prove the patient was medically right. It changes the provenance of the disagreement. A later note acknowledging reasonable patient concern cannot safely be read as the first appearance of that concern merely because earlier documentation failed to preserve it. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "2023 longitudinal interpretation"}, {"t": "Pregabalin supports heterogeneity", "k": "stress", "b": "High-dose pregabalin improved much of the pain but did not remove toe curling or postural phenomena. That pattern cautions against any all-or-nothing explanation. Some pain may have neuropathic or centrally modulated components while dystonic movement persists. The strongest theory therefore does not need every symptom to share one cause. It asks whether mixed mechanisms were properly integrated rather than used to keep the original compartments intact. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "2024 clinic record"}, {"t": "Dopaminergic pain relief is a stress test, not proof", "k": "stress", "b": "By 2025 the patient described major relief in foot sensations and pain when Parkinson medication took effect, and later Sinemet CR was associated with profound relief. The treating neurologist reasonably noted that dopamine can alter pain experience without proving the pain sole cause. That is a valid caution. The structural question is whether accepting the response only as nonspecific modulation made it impossible for the treatment response to exert any pressure on the founding separation. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "2025 clinic / complaint response"}, {"t": "The model must have an exit condition", "k": "inference", "b": "A clinically useful hypothesis must be capable of losing. If structural pain supports separation, burning supports neuropathy, OFF pain supports Parkinsonian amplification, toe curling supports dystonia and dopaminergic relief supports nonspecific pain modulation—while none of those facts can ever require the original allocation to be revisited—the model becomes too elastic to test. The question is not whether each explanation is individually plausible. It is what evidence would actually force a change in the founding model. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "Corrigibility test"}, {"t": "Local adaptation is real counter-evidence", "k": "falsifier", "b": "The later service changed many things. That fact must remain genuine counter-evidence against a crude anchoring theory. Medication evolved, alternatives were investigated, symptoms were reclassified, OFF dystonia was considered and external referral ultimately occurred. The mature case must therefore distinguish local clinical adaptability from foundational historical reconstruction. If that distinction cannot be maintained, the allegation becomes unfairly broad. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it. Where the source record conflicts with this card, the source record controls.", "r": "Longitudinal counter-case"}, {"t": "Levodopa was prospectively defence-ready", "k": "fact", "b": "The 2017 synthesis documented the reasons for delaying levodopa in unusual detail: young age, long-term risks, expected future need, patient understanding and even possible future regret. That is not suspicious in itself. It is good prospective documentation of a consequential treatment decision. Its analytical importance is comparative: it shows how clearly the record could document rationale, uncertainty and future trade-offs when the author chose to do so. Its role in the case is evidential, not rhetorical: it fixes part of the information state that existed before later interpretation could reshape the history.", "r": "2017 treatment rationale"}, {"t": "The foot-allocation bridge was less transparent", "k": "inference", "b": "The same record is much less explicit about what post-notice clinical work connected the originating foot problem to the decision to leave it on a separate/peripheral path despite the observed dystonic-looking lower-limb phenomenon. The later reader can see the outcome and the hypotheses, but not an equivalent step-by-step bridge: objection received, relationship reassessed, evidence weighed, uncertainty preserved, conclusion explained. That asymmetry is documentary before it is moral. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "2017 synthesis comparison"}, {"t": "Documentary asymmetry has a downstream effect", "k": "inference", "b": "When a later complaint asks why dopaminergic treatment was not used earlier, the record already contains a detailed response. When the complaint asks what happened after the patient said the originating problem remained unresolved, the record is much less explicit. The result is functional even without conscious design: one allegation is easier to answer because it was prospectively documented; the other requires reconstruction of missing process and provenance. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "Levodopa / foot-allocation comparison"}, {"t": "The patient also raised the treatment issue", "k": "falsifier", "b": "Fairness requires recognising that later governance did not invent the levodopa issue from nothing. The patient own 2025 complaint gave substantial weight to Sinemet response and questioned why dopaminergic treatment had not been explored differently. The relevant criticism is therefore not “the institution changed the subject entirely.” It is that the complaint contained multiple issues, and the accumulated record was especially well equipped to answer the treatment-timing component. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it.", "r": "March 2025 complaint"}, {"t": "Question migration is structural, not necessarily intentional", "k": "inference", "b": "The founding question can gradually change as it moves through systems: what happened after notice before closure; why was levodopa delayed; was longitudinal management reasonable; was the historical opinion accurately recorded; does later diagnosis require governance reopening? Each later question may be legitimate. The risk is that an easier downstream question substitutes for the harder upstream one. Intent is not required for that migration to occur. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "Question-migration framework"}, {"t": "A successful levodopa defence does not answer provenance", "k": "argument", "b": "Even if every reason for delaying levodopa were clinically sound, the separate question would remain: what was done after direct notice that the originating foot problem remained inadequately addressed? Treatment timing and documentary closure are different objects. A defence can completely vindicate the medication strategy and still leave the provenance of the founding foot allocation unresolved. Keeping those questions separate prevents the case from being reduced to a treatment dispute it does not need to win. The argument is strongest when kept at this functional level and separated from any stronger claim about motive, dishonesty or what an actor privately intended.", "r": "Complaint response analysis"}, {"t": "The mature rebuttal is second-order evidence", "k": "governance", "b": "By 2025 the clinician is no longer only treating the patient. He is defending the historical pathway. The longitudinal record therefore changes function: later medication changes, alternative testing and repeated review become evidence that the clinician remained open-minded. Those facts are relevant. The category question is whether adaptability within the inherited model proves that the founding model itself was adequately constructed or later reconstructed. It may not. The governance issue is evidential independence: later institutional authority adds little if it simply recycles assumptions whose original provenance is the matter under challenge.", "r": "25 March 2025 response"}, {"t": "The best-documented issue can become the centre of gravity", "k": "inference", "b": "Institutions naturally review what can
