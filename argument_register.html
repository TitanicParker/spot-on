purpose. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "2017 levodopa rationale"}, {"t": "The record may forget; the patient need not", "k": "principle", "b": "Once a patient directly gives a material correction signal before closure, the later absence of that signal from the chart does not impose an obligation on the patient to abandon it. The institutional record and the patient own history can diverge. A fair reconstruction must track both. Otherwise the very omission under dispute becomes evidence that the objection had no continuing significance, which is circular. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence. Where the source record conflicts with this card, the source record controls.", "r": "Dual-continuity principle"}, {"t": "Documentary discontinuity is not experiential discontinuity", "k": "principle", "b": "A later disagreement should not automatically be dated from the first later note in which the institution happens to record it. If the patient had already objected before discharge, later complaints may represent continuity rather than new invention. This does not make the patient account automatically correct. It changes the chronology of his epistemic position and prevents the chart silence from deciding when his disagreement began. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence. Where the source record conflicts with this card, the source record controls.", "r": "Dual-continuity principle"}, {"t": "Clinical cooperation is not epistemic surrender", "k": "principle", "b": "A patient may attend appointments, accept Parkinsonism, take medication, follow advice and still believe that one part of the original problem was never adequately explained. Continued engagement does not prove acceptance of every causal allocation in the record. Treating cooperation as agreement would make it almost impossible for a patient to receive care without surrendering a previously stated objection. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence. Where the source record conflicts with this card, the source record controls.", "r": "Patient epistemic status"}, {"t": "The patient is an evidence source, not a diagnostic authority", "k": "principle", "b": "The corrective response to medical paternalism is not to make the patient medically infallible. The patient contributes forms of evidence clinicians cannot directly possess: chronology, pain, function, baseline, response to treatment and the meaning of his own distinctions. Those observations remain subject to clinical interpretation. The ethical requirement is that they retain some capacity to change the model rather than being usable only when they confirm it. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence. Where the source record conflicts with this card, the source record controls.", "r": "Epistemic role"}, {"t": "Confirmatory and contradictory statements need symmetry", "k": "argument", "b": "If patient statements supporting separation are preserved as useful history while contrary statements are omitted, narrowed or treated as mere misunderstanding, the patient epistemic status changes with the direction of his evidence. The relevant fairness test is not whether every patient statement receives equal weight. It is whether materially contrary patient evidence is preserved and evaluated rather than disappearing from the travelling account while confirmatory material remains. The argument is strongest when kept at this functional level and separated from any stronger claim about motive, dishonesty or what an actor privately intended.", "r": "Patient–record asymmetry"}, {"t": "Later distress cannot be projected backwards", "k": "falsifier", "b": "The record documents severe later distress, but that later state cannot be used retrospectively to explain away the 2017 presentation or the earlier correction signal. Chronology matters. If the Protest predates later psychological deterioration, the later distress may be downstream context rather than evidence that the original objection arose from that later state. Causation of distress remains a separate question and should not be assumed. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it.", "r": "Chronology / harm"}, {"t": "The 2023 misalignment is knowledge-state evidence", "k": "inference", "b": "By 2023 the record itself acknowledges a “misalignment” and recognises the patient concerns as reasonable. That does not prove the clinician remembered the 2017 Protest. It does make it harder, from that point onward, to say the patient and clinician had always shared the same understanding of the feet. Later statements about what the patient supposedly accepted should therefore be tested against this documented disagreement. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it. Where the source record conflicts with this card, the source record controls.", "r": "2023 clinic note"}, {"t": "The patient cannot be forced to restart history in 2025", "k": "principle", "b": "A complaint process should not require the patient to behave as though his case began on the date of the formal complaint. If the underlying correction signal was given years earlier, the complaint is a later procedural manifestation of an older unresolved issue. The institution may reasonably require proof. What it should not do is treat the lack of earlier documentary preservation as if it resets the patient knowledge state to zero. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence.", "r": "Complaint continuity"}, {"t": "Burden should follow notice", "k": "argument", "b": "Once direct notice is established, the evidential burden shifts in a practical—not legalistic—sense. The key question becomes what the responsible service did in response while corrective options remained. The patient should not have to reconstruct eight years of downstream records merely to recover the epistemic position he already occupied before discharge: the problem that brought me here is still not adequately addressed. The argument is strongest when kept at this functional level and separated from any stronger claim about motive, dishonesty or what an actor privately intended. Where the source record conflicts with this card, the source record controls.", "r": "Notice principle"}, {"t": "The patient and decision are one mechanism", "k": "inference", "b": "When an original decision becomes harder to revise, contrary information has to move somewhere. The most flexible object can become the meaning of the patient symptoms, chronology or treatment response. This is why patient epistemic status and model corrigibility are linked. The concern is not that the patient is simply disbelieved. It is that his experience remains usable as data while losing capacity to change the architecture interpreting that data. The inference is useful only if it remains source-sensitive and defeasible: contrary provenance or a better-supported clinical explanation must be allowed to narrow it.", "r": "Ethics Narrative §V"}, {"t": "Clinician question: what did the Protest mean to you?", "k": "question", "b": "The threshold question for the originating clinician is interpretive. Did he understand the patient to be saying only that corns and calluses still required treatment, or that the condition that brought him into care remained inadequately explained? The same event has very different significance depending on what the clinician understood was under challenge. A satisfactory answer should identify the proposition he believed the patient was contesting and what he did in response. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains.", "r": "Third-pass clinician questions"}, {"t": "Clinician question: what did you do after notice?", "k": "question", "b": "What specific clinical acts occurred after the correction signal and before authoritative finalisation? Re-examination, history reconstruction, colleague discussion, movement-phenomenology review, explicit preservation of uncertainty or a documented decision that no further inquiry was needed would all be relevant. The purpose of the question is not to assume nothing happened. It is to identify the bridge between notice and closure rather than inferring that bridge from the final document itself. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains.", "r": "Third-pass clinician questions"}, {"t": "Clinician question: what justified separation?", "k": "question", "b": "What evidence made the clinician sufficiently confident that the painful/structural foot problem and dystonic-looking lower-limb phenomenon could be treated as separate enough for the final synthesis? Structural disease proves structural disease existed; it does not by itself establish neurological independence. The answer should identify the relational reasoning, not simply repeat that Podiatry was involved or neuropathy was possible. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Third-pass clinician questions"}, {"t": "Clinician question: where did “markedly divorced” come from?", "k": "question", "b": "When did the strongest patient-attributed separation language enter the account, and what exactly had the patient said? Earlier independent support would materially strengthen the ordinary clinical explanation. A later strengthening during dictation or synthesis would have a different provenance. This is why native drafts, source notes and dictation matter more than another retrospective narrative about what the final wording meant. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Provenance question"}, {"t": "Clinician question: why did the Protest not travel?", "k": "question", "b": "If separation-supporting patient material was worth preserving for future clinicians, why was the contrary pre-closure correction signal not preserved with equivalent force? There may be benign explanations: misunderstanding, compression, belief that the issue was already addressed or ordinary omission. The question is important because the asymmetry affects what every downstream reader could know about whether the patient himself regarded the relationship as resolved. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Patient–record asymmetry"}, {"t": "Clinician question: what did 2018 mean to you?", "k": "question", "b": "When the disputed foot territory changed rapidly during procyclidine withdrawal and improved after treatment restoration, did the clinician understand that event as pressure on the founding separation? If not, why not? If yes, why was historical reconstruction unnecessary? The question does not assume the event proved dystonia. It asks what epistemic work the new observation was allowed to perform at the time. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "2018 stress test"}, {"t": "Clinician question: what did 2020 mean for 2017?", "k": "question", "b": "When a foot-drop-like phenomenon was later judged “actually parkinsonian,” did the clinician connect it with the dystonic/foot-drop-like lower-limb phenomenon he had observed in 2017? He may reasonably have regarded the phenomena as different. The key is whether that distinction was made, not whether later readers can invent one. This question tests continuity of clinical reasoning across the same anatomical territory. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "2020 stress test"}, {"t": "Clinician question: what did you know by 2023?", "k": "question", "b": "By 2023 the record acknowledged misalignment, the primacy of the feet in the history and the patient reasonable concern. What did the clinician then understand about the continuity of the patient disagreement? Even if the 2017 Protest had been forgotten, the later note establishes an active difference of interpretation. Subsequent descriptions of patient agreement should be read against that knowledge state. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "2023 knowledge-state"}, {"t": "Clinician question: why this history in the 2025 defence?", "k": "question", "b": "The 2025 rebuttal reaches deeply into the well-documented levodopa rationale and longitudinal medication history. Why was that history selected as the main answer, and how did the clinician distinguish the treatment-timing allegation from the founding question about what happened after pre-discharge notice? The answer may simply be that this was the complaint he understood. That is exactly what needs to be clarified. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "2025 rebuttal"}, {"t": "The originating clinician cannot inherit his own record", "k": "principle", "b": "A later doctor may know only what the chart contains. The originating clinician is differently situated if he personally participated in a material pre-closure event the chart omitted. He may continue to defend the same clinical opinion, but he cannot fairly treat documentary silence as though it erased his own knowledge. Any later explanation should distinguish what the record says from what he personally remembers or knows occurred outside it. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence.", "r": "Originating-clinician principle"}, {"t": "Department question: who owned the unresolved relationship?", "k": "question", "b": "Once Podiatry appropriately managed structural disease, who within Neurology retained ownership of the relationship between those structural feet and the abnormal movement? Parallel referrals can create a gap in which each service manages a component while nobody owns the interaction. The question is not bureaucratic. Ownership determines who is responsible for noticing when later evidence crosses the boundary between specialties. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Third-pass department questions"}, {"t": "Department question: was the join discussed at the case meeting?", "k": "question", "b": "The admission received substantial neurological attention, including a complex-case process. Was the specific feet–dystonia relationship discussed, and if so what conclusion was reached? General discussion of young-onset Parkinsonism, genetics or treatment does not necessarily answer the relational question. Meeting notes, participants and any clinical video could materially clarify whether the founding allocation had broader specialist scrutiny than the final summary alone reveals. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Complex case meeting"}, {"t": "Department question: what was sent to the external specialist?", "k": "question", "b": "The 2017 external opinion is genuine independent evidence for Parkinsonism and PARK2. But what question was actually exported? Did the packet include the originating feet/gait history, dystonic-looking lower-limb phenomenon and unresolved relationship, or mainly ask about young-onset Parkinsonism, genetics and levodopa strategy? Independence is question-specific. An external review can be genuinely independent about one branch while never being asked to reconsider another. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "2017 external referral"}, {"t": "Department question: was the video ever revisited?", "k": "question", "b": "The 2017 examination was videoed. If that recording survives, did later clinicians revisit it when the foot territory became treatment-responsive, a pseudo-footdrop was reclassified neurologically, OFF dystonia was considered or external dystonia was diagnosed? A contemporaneous video could provide unusually valuable independent phenotype evidence. Its existence also creates a concrete test of whether later clinicians had a practical route back to the founding observation. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Clinical video"}, {"t": "Department question: what mechanism existed for root-model review?", "k": "question", "b": "The later service plainly had mechanisms for changing medication, ordering tests and refining symptom explanations. What mechanism existed for asking whether the historical model itself should be reconstructed? If there was no such mechanism, local adaptability might coexist with path dependence by design rather than by individual cognitive error. The question is organisational as much as clinical. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Corrigibility / service design"}, {"t": "Governance question: what was actually in scope?", "k": "question", "b": "What were the Terms of Reference of the PAR/SIMT review? Was the review asked only whether clinical management over time was reasonable, or also whether the founding record accurately represented the information state and direct pre-closure challenge? Scope matters because a competent answer to a narrow question cannot later be treated as a determination of a broader question the review was never designed to test. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains.", "r": "PAR/SIMT scope"}, {"t": "Governance question: did reviewers reconstruct the prior?", "k": "question", "b": "Did reviewers independently rebuild the 2017 sequence from primary sources—GP record, referral, specialist observations, Protest allegation, post-notice acts and finalisation—or did they begin from the mature accumulated record? The latter may still support a valid review of longitudinal care. It is less independent as a test of how the founding information state itself was created. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Governance independence"}, {"t": "Governance question: how was disputed data handled?", "k": "question", "b": "Before the institutional outcome, the patient had expressly challenged the accuracy and future processing of the information state itself. Did reviewers know that the evidential foundation was under dispute? If they did, what steps prevented circular reliance on the very record whose completeness was being challenged? Awareness and operational handling are different things. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains. Where the source record conflicts with this card, the source record controls.", "r": "Article 18 / PAR chronology"}, {"t": "Governance question: what can make a completed conclusion lose?", "k": "question", "b": "An institution needs finality, but a corrective system also needs an exit condition. What evidence, in principle, would be sufficient to reopen or qualify a completed governance conclusion? If later diagnosis, external genetics, provenance problems and new primary evidence are all categorically incapable of changing the historical conclusion, the review risks becoming institutionally unfalsifiable. The question is not whether this case necessarily meets the threshold; it is whether a threshold exists. A satisfactory answer should identify contemporaneous evidence, actual reasoning or concrete process, rather than merely restating the conclusion that the existing record already contains.", "r": "January 2026 governance"}, {"t": "Historical preservation is not historical immunity", "k": "principle", "b": "A record can remain historically intact while its present epistemic status changes. Preserving the fact that a clinician held an opinion does not require preserving that opinion as the best current account of the past. Annotation, qualification and source-sensitive explanation can protect historical integrity without erasing later correction. The institutional challenge is to distinguish preservation from immunity. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence. Where the source record conflicts with this card, the source record controls.", "r": "Data-governance principle"}, {"t": "Harm is documented, but attribution is separate", "k": "legal", "b": "The later record contains substantial pain, restricted mobility, lost activities, reduced quality of life and psychological distress. Those are important facts. They do not automatically establish that the 2017 process caused them. Some burden arises from the underlying disease and genuine structural pathology. Legal causation requires a counterfactual: what would probably have happened under competent alternative care, and what portion of the later harm would probably have been avoided? The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Harm / causation"}, {"t": "The counterfactual should be clinical, not rhetorical", "k": "legal", "b": "The useful causation question is not “what if everything had been done perfectly?” It is specific: if the feet–movement relationship had been proportionately reassessed and preserved after notice, what would probably have changed—specialist input, follow-up ownership, treatment trial, dystonia recognition, pain strategy, return conditions—and when? Only then can an expert assess whether those changes would probably have reduced later harm. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded. Where the source record conflicts with this card, the source record controls.", "r": "Causation framework"}, {"t": "Later treatment response informs causation without proving it", "k": "legal", "b": "Dopaminergic relief and other treatment-response patterns may help an expert evaluate whether earlier recognition of a movement-related component could have altered management. But response is not a perfect causal test and cannot establish by itself that earlier treatment would have produced the same benefit, at the same time, without offsetting harms. The response is evidence to be interpreted within a counterfactual, not a shortcut around it. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Treatment-response evidence"}, {"t": "Later PRKN biology is a stress test, not breach proof", "k": "legal", "b": "The eventual genetic diagnosis strengthens the biological plausibility of neurological continuity and confirms that Parkinsonism and dystonia belonged to the same disease architecture. It does not prove that 2017 clinicians should have known the genotype or that every foot symptom was dystonic. Its legal use is to test whether the old separation remained reasonable and whether a different process might have changed care—not to convert later truth into automatic historical negligence. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Genetic endpoint"}, {"t": "The long dystonia interval matters to chronology", "k": "stress", "b": "PRKN-related lower-limb dystonia can precede fuller Parkinsonism or remain relatively isolated for years. That means the long duration of lower-limb/foot phenomena cannot, by duration alone, establish that they were unrelated to the later movement disorder. This point does not diagnose the historical feet retrospectively. It removes an otherwise tempting argument that it had been there too long to belong to the same neurological disease. Its proper use is as a pressure test of the inherited model, not as retrospective proof that clinicians should already have known the later answer.", "r": "PRKN phenotype"}, {"t": "Mixed mechanisms are legally compatible with breach", "k": "legal", "b": "A negligence theory does not require proving one cause for every symptom. Structural foot disease, neuropathic-type pain, dystonia and Parkinsonian pain modulation can coexist. The possible breach is failure to proportionately investigate or preserve the relationship among mechanisms after notice—not failure to choose the single correct box. This makes the theory more realistic and also more demanding: causation must identify which component of harm a competent pathway would likely have changed. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded.", "r": "Mixed-mechanism analysis"}, {"t": "The case is not mainly a delayed-diagnosis case", "k": "case theory", "b": "The eventual diagnosis matters, but the distinctive theory is about an information-state transition. The alleged breach occurs when an unresolved relationship is transformed into authoritative history after corrective notice. That history then shapes future care and later review. The case therefore resembles a delayed-correction or premature-closure problem more than a simple failure to name the final diagnosis on day one. This formulation deliberately leaves room for a competent innocent explanation and identifies the evidence that could defeat the stronger concerning account. Where the source record conflicts with this card, the source record controls.", "r": "Integrated case theory"}, {"t": "The case is not mainly a treatment-delay case", "k": "case theory", "b": "Levodopa timing is relevant to management and causation, but the central mechanism is broader. Even if the decision to delay levodopa was entirely reasonable, a separate question remains about whether the originating feet–movement relationship was adequately handled and transmitted. Keeping the case distinct from a simple “you should have prescribed earlier” allegation prevents a strong medication defence from swallowing the actual theory. This formulation deliberately leaves room for a competent innocent explanation and identifies the evidence that could defeat the stronger concerning account. Where the source record conflicts with this card, the source record controls.", "r": "Levodopa distinction"}, {"t": "A prima facie case needs proof at each rung", "k": "legal", "b": "The analytical sequence can look compelling as a whole, but legal sufficiency depends on each rung: duty, material unresolved issue, notice, opportunity, breach, propagation, harm and causation. The Protest needs external proof if disputed. Standard of care needs expert evidence. Causation needs expert counterfactual analysis. The record architecture helps identify where to look; it cannot replace those proofs. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded. Where the source record conflicts with this card, the source record controls.", "r": "Prima facie structure"}, {"t": "The case can be serious without proving bad faith", "k": "legal", "b": "A clinically significant failure to reassess, preserve uncertainty or transmit a material disagreement can matter even if every actor acted sincerely. Negligence and poor systems do not require malice. This distinction is strategically important because it allows the case to remain strong at the level the evidence supports while leaving more serious mental-state allegations to provenance evidence if such evidence ever emerges. The point therefore identifies a legal proof question rather than deciding it; independent expert and legal assessment remain necessary before breach or causation can be concluded. Where the source record conflicts with this card, the source record controls.", "r": "Legal / mens rea limits"}, {"t": "Highest-value evidence: production history", "k": "falsifier", "b": "The most probative missing material is the native production history of the 2017 synthesis: dictation, first draft, transcription, revisions, timestamps, sign-off and audit logs. That evidence could show which passages existed before the Protest, which changed afterwards, and what source supported patient-attributed language. It can distinguish ordinary comprehensive documentation from post-notice strengthening far better than another retrospective interpretation of the finished note. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it. Where the source record conflicts with this card, the source record controls.", "r": "Provenance priority"}, {"t": "Highest-value evidence: post-notice clinical acts", "k": "falsifier", "b": "A documented focused re-examination, explicit relational discussion, movement-disorders consultation, mixed-mechanism formulation, defined return plan or reasoned decision that further inquiry was unnecessary would materially weaken the premature-closure hypothesis. The theory should actively search for such evidence. Its absence from the retained record is important, but direct evidence of adequate post-notice conduct would be more important. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it. Where the source record conflicts with this card, the source record controls.", "r": "Clinical-action falsifier"}, {"t": "Highest-value evidence: the full governance pack", "k": "falsifier", "b": "The visible SIMT outcome cannot reveal everything the review considered. The full Preliminary Assessment Report, Terms of Reference, evidence list, reviewer notes and treatment of the Protest/record-integrity allegation could show that governance performed a far more independent reconstruction than the outcome letter conveys. If so, the governance path-dependence theory would need to narrow. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it. Where the source record conflicts with this card, the source record controls.", "r": "Governance falsifier"}, {"t": "Highest-value evidence: expert standard of care", "k": "falsifier", "b": "An independent 2017-standard movement-disorders expert could conclude that the observed dystonic-looking lower-limb phenomenon, structural feet and patient objection did not require any additional inpatient relational assessment beyond what was done. That opinion, if well reasoned and based on complete records, could materially weaken the breach theory even if the documentary architecture remains interesting. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it. Where the source record conflicts with this card, the source record controls.", "r": "Expert falsifier"}, {"t": "Strongest innocent explanation remains live", "k": "falsifier", "b": "The case may ultimately be an unusually difficult young-onset Parkinsonian presentation with real structural feet, a plausible separate peripheral component, ordinary comprehensive documentation, appropriate caution about levodopa and ongoing responsive care. The Protest may have been misunderstood, clinically addressed without being well recorded, or directed at a different proposition. The later PRKN result does not automatically invalidate that account. A fair repository must continue to preserve it. This matters because the repository must be capable of losing. Evidence of this kind should reduce the strength of the theory rather than being absorbed into it.", "r": "Strong innocent case"}, {"t": "Strongest concerning explanation remains live", "k": "case theory", "b": "The competing possibility is that direct notice identified an unresolved founding relationship before closure, but the remaining opportunity produced more explanatory settlement than discriminating inquiry. The final synthesis then became the information state later care inherited. Boundary-crossing evidence was repeatedly assimilated locally; the mature record was used to defend the pathway; governance validated the accumulated record; and later clinical correction did not clearly alter the authority of the historical model. This formulation deliberately leaves room for a competent innocent explanation and identifies the evidence that could defeat the stronger concerning account.", "r": "Strong concerning case"}, {"t": "The clinician, department and institution face different questions", "k": "principle", "b": "The clinician must explain knowledge and post-notice conduct. The department must explain ownership, specialist pathways and model-level review. The institution must explain evidential independence, review scope, treatment of disputed data and reopening criteria. Collapsing all three levels into one allegation obscures responsibility. The third-pass method separates them so each actor can answer the question that belongs to its role. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence. Where the source record conflicts with this card, the source record controls.", "r": "Third-pass structure"}, {"t": "The record should not be asked to prove its own adequacy", "k": "principle", "b": "The discharge synthesis is an evidential output of the pre-finalisation information state. It can show what the author recorded and believed. It cannot, by its own coherence, prove that the underlying clinical process was adequate. That process must be reconstructed from prior observations, notice, clinical acts, provenance and expert standards. This single rule prevents the argument from becoming circular. The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence. Where the source record conflicts with this card, the source record controls.", "r": "Governing formulation"}, {"t": "The deepest question is corrigibility", "k": "principle", "b": "A functioning clinical system must preserve some route by which materially contrary evidence can change an existing model. That does not mean every new fact must overturn a diagnosis. It means the model should specify what would count against it, preserve disagreement and allow new independent evidence to alter its epistemic status when warranted. The central longitudinal question is therefore not did care change, but what was allowed to change the founding account? The principle protects both sides of the inquiry by preventing documentary convenience, patient hindsight or institutional repetition from silently substituting for evidence.", "r": "Corrigibility principle"}, {"t": "The final case theory", "k": "case theory", "b": "A plausible provisional allocation may have acquired greater documentary definiteness and downstream authority than the presently demonstrated post-notice clinical process can independently justify. The resulting phase change altered the evidential meaning of everything that followed: later clinicians inherited categories, repeated facts were not automatically independent, new boundary-crossing evidence was often accommodated locally, and later defence/governance evaluated an accumulated record whose coherence partly arose from the founding synthesis. The theory remains falsifiable by provenance, expert evidence and independent reconstruction. This formulation deliberately leaves room for a competent innocent explanation and identifies the evidence that could defeat the stronger concerning account.", "r": "Integrated controlling formulation"}];
const card=document.getElementById('card'),point=document.getElementById('point'),counter=document.getElementById('counter'),badge=document.getElementById('badge'),title=document.getElementById('title'),body=document.getElementById('body'),refs=document.getElementById('refs'),fill=document.getElementById('fill');let i=0,down=false,sx=0,dx=0;
function fit(){body.style.fontSize='';let n=0;while(card.scrollHeight>card.clientHeight&&n<18){let s=parseFloat(getComputedStyle(body).fontSize);body.style.fontSize=(s-1)+'px';n++}}
function render(){const p=points[i];point.textContent='Point '+String(i+1).padStart(2,'0');counter.textContent=(i+1)+' / '+points.length;badge.textContent=p.k;badge.className='badge '+p.k.replace(/\s+/g,'-');title.textContent=p.t;body.textContent=p.b;refs.textContent=p.r;fill.style.width=((i+1)/points.length*100)+'%';document.querySelector('details').open=false;setTimeout(fit,0)}
function go(d){i=(i+d+points.length)%points.length;render()}
card.addEventListener('pointerdown',e=>{if(e.target.closest('details'))return;down=true;sx=e.clientX;dx=0});card.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${Math.max(-4,Math.min(4,dx/55))}deg)`;card.style.opacity=Math.max(.7,1-Math.abs(dx)/800)});function up(){if(!down)return;down=false;card.style.transform='';card.style.opacity='';if(Math.abs(dx)>Math.min(110,innerWidth*.22))go(dx<0?1:-1);dx=0}card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);card.addEventListener('click',e=>{if(e.target.closest('details')||Math.abs(dx)>8)return;const r=card.getBoundingClientRect(),x=e.clientX-r.left;if(x<r.width*.28)go(-1);else if(x>r.width*.72)go(1)});window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}if(e.key.toLowerCase()==='f'){document.body.classList.toggle('focus');setTimeout(fit,30)}});document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('focus').onclick=()=>{document.body.classList.toggle('focus');setTimeout(fit,30)};window.addEventListener('resize',fit);render();
