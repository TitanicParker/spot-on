Preservation requires deleting later contradictory evidence.", "Preservation keeps the fact that the opinion was held; immunity treats that opinion as beyond later qualification or re-evaluation.", "There is no meaningful difference."], "correct": "C", "why": "Correction need not erase history. A system can preserve what was believed while updating how that belief should now be understood.", "lens": "Record integrity can support both historical accuracy and present qualification."}, {"id": 81, "argument": "Harm is documented, but attribution is separate", "payload": "Pain, mobility loss, reduced quality of life, and distress may be real without proving that the alleged 2017 process caused them.", "question": "What additional analysis is required after establishing that substantial later harm occurred?", "options": ["A counterfactual assessment of what competent alternative care would probably have changed and which portion of harm would probably have been avoided.", "None; documented harm plus a plausible breach establishes causation.", "Proof that every symptom had a single cause.", "Proof that the patient experienced no harm from underlying disease."], "correct": "A", "why": "Harm and legal attribution are separate rungs. Underlying disease and structural pathology may explain part of the burden.", "lens": "Causation asks not only “was there harm?” but “what difference would lawful or competent conduct probably have made?”"}, {"id": 82, "argument": "The counterfactual should be clinical, not rhetorical", "payload": "Causation should compare actual care with a specific competent alternative pathway, not with an idealised world in which everything went perfectly.", "question": "Which counterfactual is most useful for causation analysis?", "options": ["What if the patient had never developed Parkinsonism?", "If the feet–movement relationship had been proportionately reassessed and preserved after notice, what specific changes in specialist input, follow-up, treatment, recognition, or return conditions would probably have occurred and when?", "What if the record had contained no mistakes of any kind?", "What if every clinician had known the final diagnosis from day one?"], "correct": "B", "why": "A legally useful counterfactual is concrete, plausible, and tied to the alleged breach.", "lens": "Construct the alternative world from competent realistic conduct, not perfection or hindsight."}, {"id": 83, "argument": "Later treatment response informs causation without proving it", "payload": "Later response can help evaluate what earlier recognition might have changed, but cannot by itself prove earlier treatment would have produced the same benefit at the same time and without offsetting harms.", "question": "How should later dopaminergic or other treatment response enter a causation analysis?", "options": ["As conclusive proof that earlier treatment would have produced identical benefit.", "As evidence informing an expert counterfactual, subject to timing, indication, uncertainty, and possible offsetting risks.", "As proof that the original clinician acted in bad faith.", "It should be excluded because it occurred later."], "correct": "B", "why": "Response evidence can strengthen biological and management plausibility but does not collapse the counterfactual inquiry.", "lens": "Do not substitute post-event response for a reasoned but-for analysis."}, {"id": 84, "argument": "Later PRKN biology is a stress test, not breach proof", "payload": "Genetics strengthens biological plausibility of neurological continuity but does not establish what 2017 clinicians should have known or prove every foot symptom dystonic.", "question": "What is the proper legal use of the eventual PRKN/PARK2 result?", "options": ["To prove all structural findings were irrelevant.", "To replace the need for expert evidence on the 2017 standard.", "To test the reasonableness and corrigibility of the old separation and inform counterfactual analysis without projecting the genotype backwards as known fact.", "To establish automatic historical negligence."], "correct": "C", "why": "Later truth can illuminate plausibility and model stress without changing the knowledge actually available at the earlier date.", "lens": "Hindsight evidence can be relevant without becoming hindsight liability."}, {"id": 85, "argument": "The long dystonia interval matters to chronology", "payload": "The duration of lower-limb phenomena does not, by duration alone, establish independence from the later movement disorder if PRKN-related dystonia can precede fuller Parkinsonism for years.", "question": "What does the long possible interval between lower-limb dystonia and fuller Parkinsonism prevent a decision-maker from assuming?", "options": ["That structural pathology existed.", "That chronology matters to diagnosis.", "That all early foot symptoms were definitely dystonia.", "That a lower-limb phenomenon must have been unrelated to the later movement disorder merely because it existed for a long time beforehand."], "correct": "D", "why": "The phenotype removes a tempting duration-based exclusion argument without retrospectively diagnosing the historical feet.", "lens": "A fact may defeat one inference without proving the opposite inference."}, {"id": 86, "argument": "Mixed mechanisms are legally compatible with breach", "payload": "Negligence need not depend on proving a single cause for every symptom; the alleged failure can concern inadequate investigation or preservation of the relationship among mechanisms.", "question": "Why does the existence of mixed structural, neuropathic, dystonic, or Parkinsonian mechanisms not necessarily defeat a breach theory?", "options": ["Because structural causes are legally irrelevant once neurological disease exists.", "Because negligence law requires only one plausible mechanism, not proof.", "Because the alleged process failure may concern failure to proportionately investigate or preserve the interaction among mechanisms rather than failure to select one exclusive cause.", "Because causation need not be proved where mechanisms are mixed."], "correct": "C", "why": "Mixed mechanisms make the causation analysis more demanding, but they are compatible with a process-based breach theory.", "lens": "Complex causation does not eliminate breach; it changes what must be proved about the avoided harm."}, {"id": 87, "argument": "The case is not mainly a delayed-diagnosis case", "payload": "The distinctive theory concerns an information-state transition after notice, not simply failure to name the final diagnosis earlier.", "question": "Which description best differentiates Spot On from a conventional delayed-diagnosis case?", "options": ["It argues that the disease was never diagnosed at all.", "It claims genetic testing was mandatory in every young patient.", "It focuses on whether an unresolved relationship was prematurely transformed into authoritative history after corrective notice, shaping later care and review.", "It treats later diagnosis as proof of earlier negligence."], "correct": "C", "why": "The theory is about delayed correction or premature closure more than failure to name the final disease on day one.", "lens": "Correctly characterising the gravamen of a case prevents proof being aimed at the wrong issue."}, {"id": 88, "argument": "The case is not mainly a treatment-delay case", "payload": "Even a fully reasonable decision to delay levodopa does not necessarily answer whether the originating foot–movement relationship was adequately handled and transmitted.", "question": "Why must the case remain analytically distinct from a simple “levodopa should have been started earlier” allegation?", "options": ["Because a strong defence on treatment timing could otherwise swallow a separate question about post-notice explanatory allocation and record transmission.", "Because medication timing can never be relevant to causation.", "Because levodopa response has no evidential value.", "Because the patient never raised treatment timing."], "correct": "A", "why": "Treatment timing is one issue among several. The founding mechanism does not depend on winning it.", "lens": "Avoid allowing a well-defended secondary issue to redefine the primary allegation."}, {"id": 89, "argument": "A prima facie case needs proof at each rung", "payload": "The narrative chain may be compelling, but legal sufficiency depends on proving duty, unresolved issue, notice, opportunity, breach, propagation, harm, and causation with the right evidence.", "question": "What is the principal weakness of treating the overall narrative coherence as proof of negligence?", "options": ["Legal cases cannot rely on circumstantial evidence.", "A coherent narrative is legally inadmissible.", "Different rungs require different proof: the Protest may need external proof, standard needs expert evidence, and causation needs a counterfactual analysis.", "Only documentary evidence may prove negligence."], "correct": "C", "why": "The architecture helps identify what to prove; it cannot replace the evidence required at each element.", "lens": "Break a persuasive story into legally necessary propositions and audit each proposition’s proof."}, {"id": 90, "argument": "The case can be serious without proving bad faith", "payload": "A significant failure to reassess, preserve uncertainty, or transmit disagreement can matter even if everyone acted sincerely.", "question": "Why is bad faith unnecessary to the core legal theory?", "options": ["Because intent is never relevant to any legal claim.", "Because proving bad faith would automatically defeat causation.", "Because negligence and system failure can arise from sincere but substandard process; stronger mental-state allegations are separate and require stronger evidence.", "Because clinicians are presumed to act maliciously when records are incomplete."], "correct": "C", "why": "Serious consequences can arise from ordinary negligence or system design. The theory should not depend on a mental state it does not need.", "lens": "Do not confuse seriousness of harm with seriousness of culpable mental state."}, {"id": 91, "argument": "Highest-value evidence: production history", "payload": "Native dictation, drafts, revisions, timestamps, sign-off, and audit logs could clarify what existed before and after the Protest and the provenance of patient-attributed wording.", "question": "Why is the native production history of the 2017 synthesis unusually high-value evidence?", "options": ["Because metadata automatically proves intent.", "Because only drafts can establish the standard of care.", "Because the final signed record has no evidential value.", "Because it can time and source important passages, distinguishing ordinary contemporaneous documentation from later additions or strengthening far better than retrospective interpretation of the finished note."], "correct": "D", "why": "Production history directly addresses provenance and chronology, two of the case’s most contested structural questions.", "lens": "When wording and timing matter, native source history may be more probative than argument about a finished document."}, {"id": 92, "argument": "Highest-value evidence: post-notice clinical acts", "payload": "Direct evidence of focused reassessment, relational reasoning, consultation, uncertainty preservation, or a defined plan after notice would materially weaken the case theory.", "question": "Which evidence would be most directly capable of defeating the claim that the post-notice bridge is under-demonstrated?", "options": ["Contemporaneous evidence of a focused post-Protest reassessment and reasoned handling of the disputed relationship before finalisation.", "The later PRKN diagnosis.", "More later notes repeating the separation.", "A general statement that the admission was complex."], "correct": "A", "why": "The theory asks what happened in a specific interval. Evidence from that interval is therefore more probative than downstream repetition.", "lens": "Prioritise evidence that directly addresses the alleged missing act rather than collateral consistency evidence."}, {"id": 93, "argument": "Highest-value evidence: the full governance pack", "payload": "The full review materials may show a more independent and source-level reconstruction than the visible outcome letter reveals, which could narrow the governance critique.", "question": "Why would the complete PAR/SIMT governance pack matter more than the outcome letter alone?", "options": ["Because outcome letters are never reliable.", "Because Terms of Reference, evidence lists, reviewer notes, and treatment of disputed data can reveal the actual scope and independence of the review process.", "Because internal documents automatically favour the patient.", "Because governance evidence replaces expert clinical evidence."], "correct": "B", "why": "A short outcome cannot show all the evidential work that produced it. The full pack may either strengthen or materially weaken the path-dependence theory.", "lens": "Evaluate a decision process from its underlying record, not only its public-facing conclusion."}, {"id": 94, "argument": "Highest-value evidence: expert standard of care", "payload": "A well-instructed independent expert could materially weaken the breach theory by concluding that no additional relational inquiry was reasonably required in 2017.", "question": "Which expert conclusion would most directly challenge the proposed breach theory?", "options": ["The final discharge summary was clearly written.", "Given the complete 2017 information and Protest premise, a reasonably competent specialist was not required to undertake additional relational assessment beyond what was done.", "The later patient experienced real pain.", "PRKN disease can include dystonia."], "correct": "B", "why": "The breach theory ultimately depends on what competent care required at the time, not only on documentary interest or later biological plausibility.", "lens": "Expert evidence can defeat an analytically attractive theory if the professional standard did not require the alleged missing step."}, {"id": 95, "argument": "Strongest innocent explanation remains live", "payload": "A fair analysis must preserve the possibility of a difficult presentation, genuine structural disease, plausible peripheral components, ordinary documentation, appropriate treatment caution, and responsive later care.", "question": "Why is it essential that the strongest innocent explanation remain genuinely live?", "options": ["Because documentary omissions are never significant.", "Because a claimant must always assume the defendant is correct.", "Because a falsifiable analysis must allow benign explanations—such as misunderstanding, undocumented adequate reasoning, or a genuinely separate component—to reduce the strength of the concerning theory.", "Because later genetics invalidates all criticism."], "correct": "C", "why": "A theory that cannot lose is not a disciplined evidential theory. The innocent account must be tested, not caricatured.", "lens": "Steelman the competing explanation and identify the evidence that would make it more likely."}, {"id": 96, "argument": "Strongest concerning explanation remains live", "payload": "The competing hypothesis is that notice identified an unresolved relationship, closure then exceeded the demonstrated inquiry, the record propagated that settlement, and later evidence was locally assimilated without clearly changing historical authority.", "question": "Which statement best captures the strongest concerning explanation without overstating it?", "options": ["All later governance was intentionally designed to protect the original clinician.", "The entire longitudinal record is false.", "A post-notice opportunity may have produced more explanatory settlement than demonstrated inquiry, after which later evidence was often accommodated within rather than clearly revising the founding model.", "The clinicians knowingly concealed PRKN dystonia from the patient."], "correct": "C", "why": "The mature concerning theory is structural and falsifiable. It does not require conspiracy, fabrication, or knowledge of the later diagnosis.", "lens": "State the strongest adverse inference at the lowest mental-state level actually supported by the evidence."}, {"id": 97, "argument": "The clinician, department and institution face different questions", "payload": "Responsibility is layered: clinician knowledge/conduct, departmental ownership/review mechanisms, and institutional scope/independence/reopening should not be collapsed into one allegation.", "question": "Why does the third-pass method separate clinician, department, and institution?", "options": ["Because institutional evidence is irrelevant to clinical questions.", "Because separating actors prevents findings of system failure.", "Because only one level can be legally responsible.", "Because each level controls different processes and therefore must answer different evidential questions about knowledge, ownership, review, and correction."], "correct": "D", "why": "Layering responsibility makes the inquiry more precise and fair: each actor is asked about the processes within its control.", "lens": "Match allegations to the actor, duty, and decision level that could actually answer them."}, {"id": 98, "argument": "The record should not be asked to prove its own adequacy", "payload": "The discharge synthesis can show what was recorded and believed, but its coherence cannot independently prove that the pre-finalisation clinical process was adequate.", "question": "What is circular about defending the adequacy of the 2017 process primarily by pointing to the coherence of the final discharge synthesis?", "options": ["A coherent record is never relevant evidence.", "The final synthesis was written too late to have any evidential value.", "The document being challenged as the product of the process is being used as the principal proof that the process that produced it was adequate.", "Only oral evidence may prove clinical process."], "correct": "C", "why": "Process adequacy should be reconstructed from prior observations, notice, clinical acts, provenance, and expert standards—not merely inferred from the polished output.", "lens": "Do not allow the contested output of a process to become self-authenticating proof of that process."}, {"id": 99, "argument": "The deepest question is corrigibility", "payload": "A functioning clinical and governance system needs a route by which materially contrary evidence can alter the epistemic status of an existing model when warranted.", "question": "What does the framework mean by asking whether the system was “corrigible”?", "options": ["Whether every patient objection automatically changed the diagnosis.", "Whether the institution eventually issued a new letter.", "Whether the founding account had a meaningful route for contrary evidence, disagreement, and new independent observations to change its epistemic status when warranted.", "Whether clinicians changed any medication over time."], "correct": "C", "why": "Corrigibility is deeper than activity or adaptation. It concerns whether the model itself can lose authority in response to sufficiently strong contrary evidence.", "lens": "A decision system should specify how it can be corrected, not merely how it can continue operating."}, {"id": 100, "argument": "The final case theory", "payload": "A plausible provisional allocation may have acquired more documentary definiteness and downstream authority than the presently demonstrated post-notice process independently justifies, with later evidence often interpreted inside that inherited architecture; the theory remains falsifiable.", "question": "Which final formulation most accurately states the Spot On case theory?", "options": ["The patient’s later treatment response proves all historical foot symptoms had one neurological cause.", "The 2017 clinicians should have known the final PRKN diagnosis and intentionally concealed it.", "Every later clinician negligently repeated a false diagnosis.", "A plausible provisional allocation may have acquired greater authority than the demonstrated post-notice process independently justifies, altering the evidential meaning of later repetition and correction while remaining open to defeat by provenance, expert evidence, and independent reconstruction."], "correct": "D", "why": "The final theory is about information-state transition, authority, dependency, and corrigibility. It is deliberately narrower than hindsight diagnosis or bad-faith allegations.", "lens": "The best case theory explains the mechanism, defines its limits, and names what evidence could defeat it."}];
const KEY='liams-case-quiz-v1';
let state={index:0,answers:{}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){state.index=Math.max(0,Math.min(99,Number(saved.index)||0));state.answers=saved.answers||{}}}catch(e){}
const $=id=>document.getElementById(id), letters=['A','B','C','D'];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function score(){let answered=0,correct=0;for(const q of questions){const a=state.answers[q.id];if(a){answered++;if(a===q.correct)correct++}}return{answered,correct,incorrect:answered-correct,percent:answered?Math.round(correct/answered*100):0}}
function renderScore(){const s=score();$('answered').textContent=s.answered;$('correct').textContent=s.correct;$('incorrect').textContent=s.incorrect;$('percent').textContent=s.percent+'%';$('progressFill').style.width=(s.answered/questions.length*100)+'%';$('summary').classList.toggle('show',s.answered===questions.length);if(s.answered===questions.length){$('finalScore').textContent=s.correct+' / '+questions.length+' · '+s.percent+'%';let t=s.percent>=90?'Excellent discrimination: you are consistently separating fact, inference, provenance, and legal proof.':s.percent>=75?'Strong grasp: review the missed items for places where chronology, scope, or provenance changed the answer.':s.percent>=60?'Developing grasp: the architecture is visible, but several distinctions still need consolidation.':'Re-run the missed questions slowly. The goal is not recall; it is disciplined case reasoning.';$('finalText').textContent=t}}
function renderGrid(){const g=$('grid');g.innerHTML='';for(const q of questions){const b=document.createElement('button');b.className='qdot';b.textContent=q.id;b.title='Question '+q.id+': '+q.argument;if(q.id===state.index+1)b.classList.add('current');const a=state.answers[q.id];if(a)b.classList.add(a===q.correct?'good':'bad');b.onclick=()=>{state.index=q.id-1;save();render()};g.appendChild(b)}}
function render(){const q=questions[state.index], chosen=state.answers[q.id];$('argument').textContent=q.argument;$('position').textContent='Question '+q.id+' of '+questions.length;$('question').textContent=q.question;const box=$('options');box.innerHTML='';q.options.forEach((txt,i)=>{const v=letters[i],b=document.createElement('button');b.className='option';b.innerHTML='<span class="letter">'+v+'</span><span></span>';b.lastChild.textContent=txt;if(chosen===v)b.classList.add('selected',v===q.correct?'correct':'wrong');b.onclick=()=>{state.answers[q.id]=v;save();render()};box.appendChild(b)});$('feedback').classList.toggle('show',!!chosen);if(chosen){const ok=chosen===q.correct;$('verdict').textContent=ok?'Correct.':'Not quite. The best answer is '+q.correct+'.';$('verdict').className='verdict '+(ok?'good':'bad');$('why').textContent=q.why;$('payload').textContent=q.payload;$('lens').textContent=q.lens}else{$('verdict').textContent='';$('why').textContent='';$('payload').textContent='';$('lens').textContent=''}$('prev').disabled=state.index===0;$('next').textContent=state.index===questions.length-1?'Finish':'Next →';renderScore();renderGrid();save();window.scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>{if(state.index>0){state.index--;render()}};$('next').onclick=()=>{if(state.index<questions.length-1){state.index++;render()}else{$('summary').scrollIntoView({behavior:'smooth'})}};
$('firstUnanswered').onclick=()=>{const q=questions.find(x=>!state.answers[x.id]);if(q){state.index=q.id-1;render()}};
function goWrong(){const q=questions.find(x=>state.answers[x.id]&&state.answers[x.id]!==x.correct);if(q){state.index=q.id-1;render()}}
$('reviewWrong').onclick=goWrong;$('reviewFinalWrong').onclick=goWrong;
$('reset').onclick=()=>{if(confirm('Reset all answers and score?')){state={index:0,answers:{}};save();render()}};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&state.index>0){state.index--;render()}if(e.key==='ArrowRight'&&state.index<questions.length-1){state.index++;render()}if(['1','2','3','4'].includes(e.key)){const q=questions[state.index];state.answers[q.id]=letters[Number(e.key)-1];render()}});
render();
</script></body></html>
