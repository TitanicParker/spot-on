<script>
const questions=[{"id": 1, "argument": "Begin before authority", "payload": "Priorness is an anti-circularity rule: reconstruct the information state before the final synthesis acquired authority, because that synthesis cannot prove the adequacy of the process that produced it.", "question": "Why does the Spot On analysis begin with the information state that existed before the discharge synthesis acquired authority?", "options": ["Because the later molecular diagnosis makes the specialist account irrelevant.", "Because the patient’s account must always override contemporaneous clinical documentation.", "Because primary-care records are presumed more accurate than specialist records.", "Because the synthesis whose adequacy is being examined cannot itself determine what the pre-synthesis evidence meant."], "correct": "D", "why": "Priorness does not make earlier material automatically truer. It prevents the final authoritative account from retrospectively authenticating the reasoning process that created it.", "lens": "Avoid circular proof. Separate evidence used to evaluate a decision from the later document whose adequacy is itself in issue."}, {"id": 2, "argument": "The case entered Neurology as one problem", "payload": "The later division between Parkinsonism and a separate foot problem was an explanatory allocation made after referral, not a separation already supplied by the referring record.", "question": "What follows from the fact that primary care referred an integrated pattern of foot pain, abnormal gait, tone change, initiation difficulty, toe clawing, dexterity decline, and functional deterioration?", "options": ["Any later structural explanation of the feet was necessarily false.", "Podiatry involvement became inappropriate once Parkinsonism was suspected.", "The referral had already established that the foot symptoms were neurological.", "The later neurological/structural separation was a clinical allocation that required its own justification."], "correct": "D", "why": "The referring record had not pre-divided the problem. Later separation was interpretive work rather than an inherited fact.", "lens": "Identify when a category is evidence and when it is a later analytical construction."}, {"id": 3, "argument": "The feet were not background detail", "payload": "The feet were part of the originating signal that brought the patient into care; later diagnostic success cannot silently demote them into irrelevance.", "question": "Why is it methodologically wrong to treat the foot problem as merely incidental once severe Parkinsonism was recognised?", "options": ["Because Parkinsonism cannot affect gait or lower-limb posture.", "Because structural foot disease was never documented.", "Because every symptom present before diagnosis must share one biological cause.", "Because the foot problem was part of the original presenting problem and its relationship to the movement findings still required explanation."], "correct": "D", "why": "The case does not require a single-cause theory. It requires the original presenting problem to remain visible while the relationship between structural and neurological features is worked out.", "lens": "Preserve the scope of the original issue; do not let a later diagnosis silently narrow the question presented."}, {"id": 4, "argument": "Structural disease was genuine", "payload": "Mixed mechanisms are possible; proving one genuine mechanism does not disprove another contributing mechanism.", "question": "What is the strongest inference from the existence of genuine structural foot pathology?", "options": ["Podiatry was necessarily the only appropriate service.", "The later neurological evidence must be ignored because a structural diagnosis came first.", "The neurological contribution to foot posture or pain is excluded.", "Structural pathology could be real while neurological movement, posture, or dystonia also contributed."], "correct": "D", "why": "The framework rejects a false binary. Structural pathology and neurological contribution can coexist.", "lens": "Do not mistake proof of one explanation for proof that interacting explanations are absent."}, {"id": 5, "argument": "The referral already contained a movement-disorder pattern", "payload": "Movement-disorder features were contemporaneously visible before the specialist synthesis; this is not a hindsight inference from later genetics.", "question": "Why does the pre-specialist description of stiffness, initiation difficulty, increased tone, brisk reflexes, possible cogwheeling, toe clawing, and declining dexterity matter?", "options": ["It shows the lower-limb problem already contained movement-disorder features before the final specialist architecture was created.", "It proves structural foot disease was a documentation error.", "It establishes that genetic testing should have been diagnostic in 2017.", "It proves the exact later dystonia diagnosis was already known."], "correct": "A", "why": "The evidential point is contemporaneous visibility of a movement-disorder pattern, not retrospective certainty about the exact mechanism.", "lens": "Distinguish contemporaneous notice of a problem from hindsight knowledge of its final diagnosis."}, {"id": 6, "argument": "Neurology recognised genuine severe Parkinsonism", "payload": "The case does not depend on saying that the central Parkinsonism diagnosis was simply wrong.", "question": "Which theory is least consistent with the repository’s own evidential discipline?", "options": ["The foot–movement relationship could remain unresolved despite recognition of Parkinsonism.", "Later evidence can test how the original explanatory allocation operated.", "Severe young-onset Parkinsonism was genuinely recognised.", "The case is strongest only if the Parkinsonism diagnosis itself is treated as a simple misdiagnosis."], "correct": "D", "why": "The repository preserves the diagnostic achievement. Its case theory concerns unresolved relationship, documentary closure, and corrigibility—not denial of Parkinsonism.", "lens": "A strong case theory should concede well-supported facts rather than overclaim."}, {"id": 7, "argument": "Neurology also saw the competing sign", "payload": "The unresolved relationship was visible inside the original specialist information state because Neurology itself observed a dystonic-looking lower-limb phenomenon.", "question": "Why is the specialist observation of a dystonic-looking lower-limb posture especially important to the case structure?", "options": ["It makes all podiatric findings irrelevant.", "It proves the final genetics should have been known immediately.", "It proves every later foot symptom was dystonia.", "It shows the competing neurological possibility was present inside the founding specialist record, not created later by the patient."], "correct": "D", "why": "The relationship requiring resolution was already visible to the specialist team at the time.", "lens": "Ask whether the allegedly underdeveloped issue was actually within the decision-maker’s information state."}, {"id": 8, "argument": "PRKN was already in the clinical imagination", "payload": "Later molecular confirmation must not be projected backwards, but the disease family was already within contemporaneous clinical reasoning.", "question": "What is the disciplined use of the fact that PRKN/PARK2 was considered in 2017 and later molecularly confirmed?", "options": ["It makes all non-genetic explanations unreasonable from the outset.", "It proves clinicians possessed the later genetic result in 2017.", "It shows monogenic Parkinsonism was already a live possibility, while the later result can test integration and corrigibility without being projected backwards as knowledge.", "It permits the later result to be used as a time machine to establish negligence."], "correct": "C", "why": "The framework allows continuity of possibility without hindsight. The later result is pressure on the earlier model, not retrospective omniscience.", "lens": "Separate what was knowable then from what later evidence can legitimately test now."}, {"id": 9, "argument": "Phenomenological difference is not biological independence", "payload": "Different subjective experiences can support partial separation without proving independent biological mechanisms.", "question": "A patient distinguishes foot pain from leg tension as different experiences. What may a careful decision-maker infer from that fact alone?", "options": ["The distinction is clinically relevant but does not by itself prove biological independence.", "The structural foot problem is necessarily unrelated to neurological posture.", "Later repetition of the distinction converts it into an established biological fact.", "The two experiences must arise from independent biological mechanisms."], "correct": "A", "why": "Phenomenological distinction can inform analysis, but it cannot alone establish causal independence between interacting mechanisms.", "lens": "Do not convert a witness’s accurate description of experience into a stronger scientific proposition than the evidence supports."}, {"id": 10, "argument": "The bounded question was already visible", "payload": "The material question in 2017 was the relationship between painful/structurally abnormal feet and the dystonic-looking lower-limb movement.", "question": "Which question best captures the bounded clinical issue the repository says was already available without hindsight?", "options": ["Why had the patient not already received the eventual molecular diagnosis?", "Were the feet structural or neurological, with only one answer permitted?", "What was the relationship between the painful/structurally abnormal feet and the dystonic-looking lower-limb movement?", "Which later clinician should be blamed for preserving the original model?"], "correct": "C", "why": "The case permits mixed, uncertain, or separate mechanisms. The important point is that the relationship itself was material.", "lens": "Frame the issue narrowly enough to be answerable without smuggling in the desired conclusion."}, {"id": 11, "argument": "The discharge summary was a phase change", "payload": "The synthesis changed the evidential environment by turning an open state into a portable specialist model that later clinicians could inherit.", "question": "Why does the 2017 discharge synthesis change how later repetition should be interpreted?", "options": ["Everything written after discharge is presumptively unreliable.", "The synthesis legally binds all later clinicians to its conclusions.", "Later evidence becomes irrelevant once a specialist summary exists.", "Later clinicians may be repeating or working inside categories created by the synthesis rather than independently reconstructing the founding problem."], "correct": "D", "why": "Authority creates dependency. After the synthesis, repetition may reflect inheritance of the model rather than independent corroboration.", "lens": "Provenance matters: repeated statements are not necessarily independent evidence."}, {"id": 12, "argument": "The document organised two different futures", "payload": "The Parkinsonian branch and foot branch were developed differently; the weak point is the bridge between them, not necessarily either branch in isolation.", "question": "What is the key analytical concern created by the discharge synthesis giving the Parkinsonian branch a rich neurological future and the foot territory a structural/peripheral route?", "options": ["Podiatry should never have been involved.", "Both branches contained medically impossible propositions.", "The bridge explaining why the two branches were separated received less visible development than either branch itself.", "The neurological branch was over-documented and therefore false."], "correct": "C", "why": "The issue is explanatory allocation. Each branch may contain reasonable propositions while the relationship between them remains insufficiently established.", "lens": "In complex cases, examine the inferential bridge between categories, not just the internal plausibility of each category."}, {"id": 13, "argument": "A destination is not an explanation", "payload": "Referral or service ownership does not itself establish biological causation or independence.", "question": "Why does a legitimate referral to Podiatry fail, by itself, to resolve the founding foot–movement question?", "options": ["Assigning a service destination does not establish the biological relationship between structural pathology and abnormal movement.", "Every multidisciplinary referral is evidence of uncertainty.", "Only Neurology can document pain.", "Podiatry has no role in structural foot disease."], "correct": "A", "why": "A destination can be appropriate for treatment while leaving causal and relational questions unresolved.", "lens": "Do not confuse administrative allocation or service ownership with proof of causation."}, {"id": 14, "argument": "The Protest attacked completion, not diagnosis", "payload": "The correction signal did not require the patient to name dystonia or PRKN disease; it required notice that the originating problem remained inadequately addressed before closure.", "question": "What must the pre-discharge Protest establish for the framework to operate without hindsight?", "options": ["While corrective options remained, the responsible clinician was told the problem that brought the patient into care remained inadequately addressed.", "Every foot symptom was neurological.", "The patient had already identified PRKN-associated dystonia.", "The Parkinsonism diagnosis itself was wrong."], "correct": "A", "why": "The Protest concerns incompleteness of the episode, not possession of the later diagnostic answer.", "lens": "Notice can be material even when the notifier cannot supply the final expert explanation."}, {"id": 15, "argument": "Notice changes the chronology", "payload": "Once notice occurs before finalisation, the final record becomes a post-notice act whose adequacy must be assessed in light of the opportunity to respond.", "question": "What changes once direct corrective notice is placed before the final synthesis is completed?", "options": ["The chronology must distinguish provisional reasoning from the later opportunity to reconsider before authoritative finalisation.", "The patient’s account automatically becomes conclusive evidence.", "The final synthesis ceases to have evidential value.", "Every pre-notice clinical judgment automatically becomes negligent."], "correct": "A", "why": "Notice creates a before-and-after structure: provisional reasoning, corrective signal, remaining opportunity, response or non-response, and then finalisation.", "lens": "Chronology can transform the legal meaning of an otherwise ordinary act; timing of notice and opportunity matters."}, {"id": 16, "argument": "The missing middle was broad", "payload": "The case does not require proof that one specific test was mandatory; there were multiple proportionate ways to bridge notice and closure.", "question": "Why does the framework list options such as focused re-examination, mixed-mechanism formulation, documentation of disagreement, preservation of uncertainty, or a defined return condition?", "options": ["To show there was a range of proportionate responses between restarting the entire admission and simply ignoring the unresolved concern.", "To argue that discharge was impossible under any circumstances.", "To prove every listed step was legally mandatory.", "To establish that only movement-disorders referral could have been reasonable."], "correct": "A", "why": "The theory depends on the existence of an adequate bridge after notice, not on proving one uniquely mandated intervention.", "lens": "Distinguish a required outcome from a reasonable range of responsive processes."}, {"id": 17, "argument": "Premature documentary closure is the mechanism", "payload": "A still-contestable relationship may have acquired documentary settlement before the visible post-notice process had earned that level of authority.", "question": "Which description best captures the repository’s proposed mechanism of premature documentary closure?", "options": ["Any discharge summary that contains a factual mistake.", "A later genetic result automatically voiding the earlier clinical record.", "A plausible but still-contestable allocation becoming a durable travelling fact without adequately demonstrated reassessment, resolution, or preserved uncertainty after notice.", "A deliberate plan to conceal a known diagnosis."], "correct": "C", "why": "The hypothesis concerns the mismatch between demonstrated process and documentary authority. It does not require an obviously false sentence or dishonest intent.", "lens": "Separate process adequacy and epistemic status from allegations of fraud or motive."}, {"id": 18, "argument": "The record can be accurate sentence by sentence and still misstate status", "payload": "Selection, grouping, omission, and unequal preservation can make a record appear more settled than the underlying information state even when individual sentences are defensible.", "question": "How can a record be factually defensible sentence by sentence yet still misrepresent the state of knowledge?", "options": ["Only if the author intended later readers to be misled.", "By using medically technical language that a patient cannot understand.", "Only by containing a demonstrably false statement.", "By arranging and preserving propositions so that hypotheses or contested relationships appear more settled than they actually were."], "correct": "D", "why": "Record integrity includes epistemic status: what was observation, hypothesis, disagreement, or unresolved question. Accuracy of isolated sentences does not settle that broader issue.", "lens": "Legal analysis often turns on context, status, and omission—not merely literal falsity."}, {"id": 19, "argument": "Confirmatory patient material travelled", "payload": "Patient-attributed statements supporting separation were preserved while, on the Protest premise, the contrary correction signal did not travel with equivalent force.", "question": "What is the strongest defensible inference from separation-supporting patient statements travelling in the record while the contrary Protest does not?", "options": ["The patient’s later account automatically overrides all contemporaneous documentation.", "The patient–record relationship became asymmetric: later readers received more of the patient evidence that supported separation than of the patient evidence that challenged closure.", "The clinician deliberately fabricated the patient’s words.", "The supportive statements must therefore be false."], "correct": "B", "why": "The observable point is functional asymmetry in what later readers could know. Deliberate omission or fabrication would require additional provenance evidence.", "lens": "Establish documentary effect before escalating to mental-state allegations."}, {"id": 20, "argument": "The phase change alters the negligence chronology", "payload": "The alleged breach must be examined at the point where an open problem became authoritative history; downstream consistency cannot retroactively prove that pre-closure process adequate.", "question": "Why does the documentary phase change alter where a negligence inquiry should focus?", "options": ["Because the critical issue may be how the authoritative information state was created after notice, not merely how consistently later clinicians used it.", "Because a specialist summary itself establishes breach.", "Because later clinicians can never provide relevant evidence about causation.", "Because everything after the discharge summary is legally inadmissible."], "correct": "A", "why": "Once downstream care is partly generated inside the inherited model, later consistency may reflect propagation. The threshold at which the model acquired authority therefore becomes central.", "lens": "Locate the alleged breach in time before evaluating downstream consequences."}, {"id": 21, "argument": "Duty is conventional; the factual location is unusual", "payload": "The legal duties are ordinary; what is unusual is that the alleged failure may sit after corrective notice but before the record became authoritative.", "question": "What is unusual about the legal structure proposed by Spot On?", "options": ["It rejects ordinary negligence principles in favour of an ethical theory.", "The duties are conventional, but the alleged factual failure is located in the post-notice, pre-finalisation interval.", "It treats record-making as outside clinical responsibility.", "It requires a new legal duty unique to movement disorders."], "correct": "B", "why": "Competent care, communication, record-making, breach, causation, and harm remain conventional. The distinctive feature is the factual location of the alleged failure.", "lens": "Do not mistake an unusual factual pattern for an exotic legal doctrine."}, {"id": 22, "argument": "The breach theory is process-based", "payload": "The strongest breach theory concerns whether a material relationship was adequately reconsidered, reasoned, qualified, or followed up after notice—not failure to name the eventual diagnosis.", "question": "Which formulation best states the proposed breach theory?", "options": ["A competent process may have reached the same disposition, but the question is whether the route after notice contained proportionate reassessment, reasoning, uncertainty-preservation, or follow-up.", "Any disagreement by a patient creates a duty to continue inpatient investigation.", "Later treatment success proves the earlier process fell below standard.", "The neurologist negligently failed to diagnose PRKN dystonia in 2017."], "correct": "A", "why": "The theory is deliberately process-based and leaves open the possibility that a competent process could have reached the same broad result.", "lens": "Breach and outcome are distinct; ask what competent process required at the time."}, {"id": 23, "argument": "The burden is what happened after notice", "payload": "Once notice is accepted for the reconstruction, the central factual question becomes what response occurred while both patient and unfinished account remained available.", "question": "After accepting the Protest as a premise for the reconstruction, what becomes the most probative factual inquiry?", "options": ["Whether the eventual genetic result was foreseeable in detail.", "Whether the patient can prove every later symptom came from one neurological mechanism.", "What clinical acts and reasoning occurred after notice and before finalisation.", "Whether later clinicians agreed with the final synthesis."], "correct": "C", "why": "The relevant opportunity existed while the system still had both the patient and an unfinished account. The inquiry therefore turns to the response at that time.", "lens": "Follow notice to the actor who had the opportunity to respond; do not shift the inquiry downstream without reason."}, {"id": 24, "argument": "Absence must remain a documentary negative", "payload": "A missing record of targeted reassessment supports “not demonstrated,” not automatically “never happened.”", "question": "What is the disciplined conclusion when the retained record does not show a targeted post-Protest reassessment?", "options": ["No reassessment occurred, as a matter of fact.", "The absence proves concealment.", "Adequate reassessment is not demonstrated by the retained record, while undocumented reasoning remains possible and should be tested by other evidence.", "The issue must be ignored because absence can never have evidential significance."], "correct": "C", "why": "Documentary absence is evidence, but it is not absolute proof of non-occurrence. The theory must remain open to contemporaneous notes, recollection, drafts, video, or other evidence.", "lens": "Distinguish absence of evidence from conclusive evidence of absence."}, {"id": 25, "argument": "The theory can lose", "payload": "A credible case theory must identify evidence that would materially weaken or defeat it rather than absorbing every new fact as support.", "question": "Which discovery would most directly weaken the premature-closure theory?", "options": ["The patient continues to disagree with the historical account.", "A documented targeted post-Protest reassessment that addresses the disputed relationship and explains why further inquiry was unnecessary.", "A later clinician again repeats the 2017 separation.", "A later genetic diagnosis involving dystonia."], "correct": "B", "why": "Direct evidence of adequate post-notice clinical work supplies the very bridge the theory says is presently under-demonstrated.", "lens": "Falsifiability is a discipline: define what evidence would make your own case weaker."}, {"id": 26, "argument": "The 2017 standard needs an expert", "payload": "Later knowledge cannot establish the 2017 standard of care; an appropriately instructed expert must assess what competent care required using information then available.", "question": "Why can the repository’s documentary analysis not by itself establish breach of the 2017 standard of care?", "options": ["Because medical records are never admissible in negligence cases.", "Because no legal claim can involve record-making.", "Because professional standard and proportionality require expert assessment of what a competent specialist should have done with the information available in 2017.", "Because only the eventual genetic result can establish the standard."], "correct": "C", "why": "The repository can identify the clinical question and evidential gap, but the professional standard is an expert proof question.", "lens": "Know which proposition requires expert evidence and do not let analytical coherence substitute for proof of standard."}, {"id": 27, "argument": "Same outcome does not automatically mean no breach", "payload": "A competent process could possibly have reached the same diagnosis or treatment plan; sameness of outcome does not automatically validate the method.", "question": "If a competent clinician could have reached the same broad diagnosis and treatment plan, what follows about breach?", "options": ["Only damages, not breach, remain relevant.", "Breach is impossible because outcome controls method.", "The process may still be deficient if the required reassessment or reasoning was omitted; outcome and method must be analysed separately.", "Breach is automatically established because the later diagnosis differed."], "correct": "C", "why": "Negligence can concern how a decision was reached. Conversely, a later better explanation does not by itself prove that the earlier method was negligent.", "lens": "Separate process breach from outcome hindsight."}, {"id": 28, "argument": "The record is part of the clinical mechanism", "payload": "When later clinicians inherit the record, record-making can shape future diagnosis, treatment, and review; it is not merely administrative description.", "question": "Why does Spot On treat the discharge record as part of the clinical mechanism rather than a neutral after-the-fact artifact?", "options": ["Because clinical care stops once a record is written.", "Because the record can determine what later clinicians inherit and therefore influence how future evidence is interpreted and acted upon.", "Because every medical record has the force of a legal judgment.", "Because documentation errors are always more harmful than treatment errors."], "correct": "B", "why": "A portable specialist model can alter the information state available to future clinicians. That makes record construction potentially causally relevant.", "lens": "Documents can be operative facts: ask what decisions they enable, constrain, or shape."}, {"id": 29, "argument": "Prima facie does not mean proved", "payload": "A coherent analytical sequence identifies propositions requiring proof; it does not itself establish negligence.", "question": "What does a prima facie analytical sequence accomplish in this case?", "options": ["It converts later treatment response into legal causation.", "It identifies a chain of propositions that could support a case while leaving disputed rungs such as standard, conduct, and causation to evidence and expert proof.", "It conclusively establishes negligence if the narrative is coherent.", "It removes the need to prove the Protest."], "correct": "B", "why": "The sequence is a map of what must be established, not a substitute for establishing it.", "lens": "A plausible pleading structure and a proved case are different things."}, {"id": 30, "argument": "The legal case should stay narrower than the moral suspicion", "payload": "The defensible legal theory does not need dishonesty, conspiracy, fabrication, or malicious motive; ordinary process and causation questions are enough.", "question": "Why is it strategically important to keep the legal case narrower than the strongest moral suspicion?", "options": ["Because adding allegations of dishonesty or conspiracy can impose higher evidential burdens without being necessary to prove an ordinary negligence theory.", "Because motive is never legally relevant in any case.", "Because records are presumed honest as a matter of law.", "Because ethical concerns cannot coexist with legal claims."], "correct": "A", "why": "The case can stand or fall on competent inquiry, accurate transmission, and causation. Stronger mental-state allegations should be reserved for stronger provenance evidence.", "lens": "Plead and reason at the level the evidence supports; do not weaken a viable case with unnecessary allegations."}, {"id": 31, "argument": "2018 crossed the old boundary", "payload": "The procyclidine withdrawal/rechallenge pattern created dynamic evidence that the disputed foot territory was at least partly sensitive to movement-disorder treatment state.", "question": "What is the proper evidential use of the 2018 procyclidine withdrawal/rechallenge pattern?", "options": ["It is irrelevant because it occurred after 2017.", "It creates pressure on the old separation by showing dynamic change in the disputed territory with movement-disorder treatment state, without proving a single mechanism.", "It proves the 2017 clinicians knew the later treatment response would occur.", "It proves every corn and every episode of foot pain was dystonic."], "correct": "B", "why": "The event is a stress test. Its significance lies in whether it caused the founding allocation to be reconsidered, not in retroactively proving a diagnosis.", "lens": "Use later dynamic evidence to test a model’s robustness without committing hindsight error."}, {"id": 32, "argument": "2020 produced an internal neurological reclassification", "payload": "A later foot-drop-like phenomenon was judged “actually parkinsonian,” providing new clinician-generated evidence in the same disputed anatomical territory.", "question": "Why is the 2020 reclassification especially probative within the Spot On framework?", "options": ["It is a patient-generated theory and therefore proves continuity.", "It proves structural pathology never existed.", "It establishes that the 2017 and 2020 phenomena were necessarily identical.", "It is new clinician-generated neurological evidence in the disputed territory, raising the question whether the historical allocation was revisited."], "correct": "D", "why": "The significance is not identity of phenomena but the appearance of independent clinician-generated evidence capable of pressuring the old boundary.", "lens": "Distinguish new independent observation from inherited narrative."}, {"id": 33, "argument": "The shoulder episode is a fair comparator", "payload": "The shoulder episode shows the service could use mixed-mechanism reasoning and targeted localisation; comparison asks whether the feet ever received equivalent explicit reconstruction.", "question": "What is the legitimate use of the 2019 shoulder episode as a comparator?", "options": ["It shows the clinician was capable of separating structural and Parkinsonian contributions explicitly, making it fair to ask whether the founding foot relationship received comparable reasoning.", "It proves negligence because the shoulder was investigated and the feet were not.", "It proves every painful syndrome required the same test.", "It establishes that shoulder and foot pathology were medically identical."], "correct": "A", "why": "A comparator can illuminate available reasoning practices without dictating an identical clinical response.", "lens": "Use comparators to test consistency of reasoning, not to erase material differences between situations."}, {"id": 34, "argument": "2022 preserved a state-dependent pattern", "payload": "Morning warm-up and persistent foot symptoms added temporal behaviour capable of pressuring the inherited model without functioning as a standalone diagnostic test.", "question": "Why does the 2022 morning “warm-up” pattern matter without being diagnostic in itself?", "options": ["It provides state-dependent behaviour in the disputed territory that a corrigible model should be able to integrate or explain.", "Any symptom that changes during the day is neurological.", "It proves the structural foot findings were fabricated.", "It is too late to have any evidential relevance."], "correct": "A", "why": "Temporal patterns can add pressure to an explanatory model even when they do not uniquely identify a mechanism.", "lens": "Cumulative circumstantial evidence may matter through pattern and consistency rather than a single decisive fact."}, {"id": 35, "argument": "2023 almost reopened the founding question", "payload": "The 2023 record considered OFF dystonia, treated leg pain and shuffling as OFF-related, acknowledged misalignment, and recognised the primacy of the feet, showing genuine reflection but leaving model-level reconstruction uncertain.", "question": "What makes the 2023 episode analytically different from simple repetition of the 2017 model?", "options": ["It is merely a patient complaint with no clinician-generated content.", "It proves the clinician admitted negligence.", "It eliminates all structural explanations.", "It contains new reflection—including OFF dystonia and acknowledged misalignment—that approaches the founding relationship, though it is unclear whether the historical allocation itself was reconstructed."], "correct": "D", "why": "The later record shows genuine adaptive reasoning. The remaining question is whether that local adaptation altered the epistemic status of the founding allocation.", "lens": "Do not flatten evidence into “rigid” versus “open-minded”; ask what level of the model actually changed."}, {"id": 36, "argument": "Misalignment is continuity evidence", "payload": "The 2023 acknowledgment of misalignment may support continuity of disagreement rather than its first appearance, without proving the patient was medically correct.", "question": "On the Protest premise, what does the 2023 acknowledgment of “misalignment” most directly affect?", "options": ["It makes documentary gaps irrelevant.", "It proves the clinician remembered the exact Protest.", "It proves the patient’s medical interpretation was correct from 2017 onward.", "It changes the provenance and chronology of the disagreement by supporting the possibility that the later dispute reflects an older unresolved position."], "correct": "D", "why": "The inference concerns continuity of epistemic position, not correctness of diagnosis or recollection.", "lens": "Separate evidence that a dispute existed from evidence that one side of the dispute was substantively right."}, {"id": 37, "argument": "Pregabalin supports heterogeneity", "payload": "Partial pain improvement with persistent toe curling/postural phenomena supports mixed mechanisms rather than a one-cause story.", "question": "What is the best inference from substantial pain improvement on pregabalin while toe curling or postural phenomena persisted?", "options": ["The pattern supports heterogeneity: different components may respond differently, so mixed mechanisms remain plausible.", "All symptoms were neuropathic because some pain improved.", "All symptoms were dystonic because movement features persisted.", "The treatment response has no relevance to mechanism."], "correct": "A", "why": "Differential response is consistent with multiple components and cautions against all-or-nothing causal allocation.", "lens": "A partial treatment response may partition a problem rather than solve it."}, {"id": 38, "argument": "Dopaminergic pain relief is a stress test, not proof", "payload": "Dopaminergic relief places pressure on the founding separation but does not establish that pain had a single neurological cause.", "question": "How should later dopaminergic relief of longstanding foot sensations and pain be used?", "options": ["As a stress test: a valid nonspecific-pain explanation may coexist with the question whether the response was allowed to pressure the founding separation.", "As conclusive proof that every historical foot symptom was caused by dystonia.", "As automatic proof of 2017 breach.", "As irrelevant because dopamine can affect pain perception nonspecifically."], "correct": "A", "why": "The response is meaningful but not uniquely diagnostic. The structural question is whether the model had any route for such evidence to change its status.", "lens": "Avoid both overclaiming and explaining evidence away so completely that it can never count."}, {"id": 39, "argument": "The model must have an exit condition", "payload": "A useful explanatory model must specify what evidence could force revision; otherwise individually plausible explanations can make it unfalsifiable.", "question": "What is the problem if structural pain, neuropathic features, OFF symptoms, dystonia, and dopaminergic response can each be locally explained but none can ever require reconsideration of the founding allocation?", "options": ["The model becomes too medically detailed.", "The model becomes effectively unfalsifiable because every observation can be assimilated without any defined route to revision.", "The model becomes legally binding through repetition.", "The model becomes wrong as soon as one alternative explanation appears."], "correct": "B", "why": "Corrigibility requires an exit condition: some specified evidence must be capable of changing the model’s epistemic status.", "lens": "Ask not only whether a theory can explain evidence, but what evidence would count against it."}, {"id": 40, "argument": "Local adaptation is real counter-evidence", "payload": "Medication changes, reclassification, OFF-dystonia consideration, testing, and external referral genuinely weaken any crude theory of total rigidity.", "question": "Why must later clinical adaptability be treated as real counter-evidence?", "options": ["Because any medication change proves the founding model was reconstructed.", "Because adaptive care eliminates any possible earlier breach.", "Because later care is the only relevant period.", "Because the service demonstrably changed treatments and explanations, so a fair theory must distinguish local adaptability from the narrower allegation of limited root-model reconstruction."], "correct": "D", "why": "The mature theory cannot claim total rigidity when the record shows substantial local adaptation. It must identify the narrower level at which revision may have been limited.", "lens": "Preserve adverse evidence and narrow the theory accordingly."}, {"id": 41, "argument": "Levodopa was prospectively defence-ready", "payload": "The detailed levodopa rationale is not inherently suspicious; it shows how clearly consequential reasoning could be documented prospectively.", "question": "What is the strongest analytical significance of the detailed 2017 levodopa rationale?", "options": ["It proves levodopa should have been started immediately.", "It demonstrates careful prospective documentation of a consequential treatment trade-off and provides a comparator for the less transparent foot-allocation bridge.", "It proves the record was written primarily for litigation defence.", "It establishes that every other clinical decision received equivalent reasoning."], "correct": "B", "why": "The note’s detail is first evidence of good documentation. Its relevance becomes comparative when another consequential allocation is less transparently reasoned.", "lens": "A document may be both responsible practice and an illuminating comparator; do not force a suspicious interpretation."}, {"id": 42, "argument": "The foot-allocation bridge was less transparent", "payload": "The record shows the outcome and hypotheses but less clearly shows the post-notice reasoning bridge from objection to reassessment to conclusion or preserved uncertainty.", "question": "What exactly is missing when the repository describes the foot-allocation bridge as less transparent?", "options": ["Any evidence that structural foot pathology existed.", "A visible sequence showing the objection received, the relationship reassessed, evidence weighed, uncertainty handled, and conclusion or follow-up explained.", "A record of every conversation during admission.", "A genetic test proving PRKN disease in 2017."], "correct": "B", "why": "The concern is not absence of an outcome. It is under-demonstration of the reasoning process linking notice to authoritative closure.", "lens": "Distinguish a documented conclusion from a documented inferential bridge."}, {"id": 43, "argument": "Documentary asymmetry has a downstream effect", "payload": "A well-documented treatment-timing issue is easier to defend later than a poorly preserved process/provenance issue, regardless of conscious design.", "question": "What practical effect can documentary asymmetry have years later during complaint review?", "options": ["The poorly documented issue becomes automatically proved.", "The institution must assume the author acted defensively.", "The better-documented issue must legally be treated as the only complaint.", "The better-documented issue may dominate because it can be answered directly, while the less-preserved process issue requires difficult reconstruction."], "correct": "D", "why": "Documentation creates differential answerability. That functional effect can shape later review without any need to infer motive.", "lens": "Ask how the evidential architecture channels later institutional attention."}, {"id": 44, "argument": "The patient also raised the treatment issue", "payload": "Fairness requires recognising that the levodopa issue was genuinely part of the patient’s later complaint; the criticism is not that the institution invented it from nothing.", "question": "Why does it matter that the patient himself substantially raised Sinemet response and treatment timing in the 2025 complaint?", "options": ["It proves treatment timing was the only issue in dispute.", "It waives any complaint about the 2017 foot allocation.", "It prevents an unfair claim that governance wholly invented the levodopa issue, while still allowing analysis of whether that issue displaced a harder founding question.", "It proves the original levodopa strategy was negligent."], "correct": "C", "why": "A fair reconstruction must preserve the complaint’s actual content before analysing which issue later became the centre of gravity.", "lens": "Characterise the opponent’s position accurately before criticising how it was answered."}, {"id": 45, "argument": "Question migration is structural, not necessarily intentional", "payload": "As a case moves through care and governance, an upstream question can be replaced by easier downstream questions without anyone deliberately evading it.", "question": "What does “question migration” mean in this case?", "options": ["The governing question can shift from post-notice closure to treatment timing, longitudinal reasonableness, or later governance, so a legitimate downstream question may substitute for the harder upstream one.", "Questions become irrelevant as soon as new evidence appears.", "The patient repeatedly changes the allegation to avoid an answer.", "Every later review necessarily acts in bad faith."], "correct": "A", "why": "The concept is structural. Institutional processes can naturally gravitate toward answerable questions even without intentional avoidance.", "lens": "Track whether the question answered is the same question that required decision."}, {"id": 46, "argument": "A successful levodopa defence does not answer provenance", "payload": "Treatment timing and the provenance of the founding foot allocation are separate objects; vindicating one does not necessarily resolve the other.", "question": "Suppose every 2017 reason for delaying levodopa was clinically sound. What remains logically open?", "options": ["Whether Parkinsonism existed at all.", "Nothing; the entire case necessarily fails.", "Whether later treatment response occurred.", "Whether adequate post-notice work justified and transmitted the founding foot–movement allocation."], "correct": "D", "why": "A complete defence to treatment timing can coexist with an unresolved question about how a different clinical allocation acquired authority.", "lens": "Keep causes of action, allegations, and evidential objects analytically separate."}, {"id": 47, "argument": "The mature rebuttal is second-order evidence", "payload": "A later defence of the pathway uses the longitudinal record as evidence of open-mindedness; the key question is whether adaptation within the model proves the founding model was adequately built or reconstructed.", "question": "Why is the 2025 clinician rebuttal described as “second-order evidence”?", "options": ["Because it is not only clinical history; it is a later interpretation using that history to defend the reasonableness of the earlier pathway.", "Because it has no evidential value once litigation is possible.", "Because it automatically proves bias.", "Because only governance, not clinicians, may interpret prior care."], "correct": "A", "why": "The record changes function when it is deployed to justify the historical pathway. That makes independence and category selection relevant.", "lens": "A source may be evidence both of events and of how an actor later frames those events."}, {"id": 48, "argument": "The best-documented issue can become the centre of gravity", "payload": "Review naturally gravitates toward questions with a clear evidential trail; scope discipline is needed so answerability does not replace relevance.", "question": "Why can a well-documented issue become the centre of gravity of institutional review?", "options": ["Because the patient loses the right to define the complaint once a review begins.", "Because poorly documented allegations are automatically false.", "Because it is easier to reconstruct and defend, which can draw attention away from a less-preserved but more foundational allegation.", "Because reviewers are legally required to prefer the longest record."], "correct": "C", "why": "The mechanism can be ordinary institutional convenience rather than intentional evasion. Review design should keep scope aligned with the allegation.", "lens": "Procedural design matters: the easiest evidential trail is not always the legally decisive one."}, {"id": 49, "argument": "Function precedes motive", "payload": "First establish what the documentation and review structure did; only then ask what anyone knew, intended, or sought to conceal.", "question": "What is the correct order of analysis when documentary selectivity appears consequential?", "options": ["Ignore function unless dishonesty can already be proved.", "Infer defensive motive first, then use it to interpret the documents.", "Treat motive as irrelevant even if direct evidence later emerges.", "Establish functional asymmetry, then examine knowledge and only afterward consider whether any selectivity was conscious or deceptive."], "correct": "D", "why": "Skipping from effect to intent converts a strong structural observation into a weak mental-state allegation.", "lens": "Mental-state propositions usually require an evidential ladder: act/effect, knowledge, then intention."}, {"id": 50, "argument": "Future-regret language is important but bounded", "payload": "Anticipated regret about delaying levodopa shows foresight about a difficult trade-off; it does not itself prove defensive record construction.", "question": "What can safely be inferred from a 2017 note acknowledging that clinicians might later regret delaying levodopa?", "options": ["The treatment decision was therefore negligent.", "The clinician knew the eventual genetic diagnosis.", "The note was written for anticipated litigation.", "The clinician explicitly anticipated future uncertainty or criticism around a treatment trade-off, while any defensive-purpose inference requires additional evidence."], "correct": "D", "why": "The language is evidence of documentary foresight, but ordinary careful counselling is an obvious innocent explanation.", "lens": "Treat ambiguous evidence as bounded: identify what it proves and what stronger proposition still needs proof."}, {"id": 51, "argument": "The record may forget; the patient need not", "payload": "If a material correction signal occurred, its later omission from the chart does not require the patient to abandon knowledge of having given it.", "question": "What error occurs if later chart silence is used to argue that the patient’s earlier objection had no continuing significance?", "options": ["The patient is improperly treated as a medical expert.", "The alleged omission is used circularly as evidence that the omitted event did not matter or persist in the patient’s history.", "The later complaint is automatically accepted as true.", "The chart is given too little evidential weight."], "correct": "B", "why": "The record represents history; it does not control what events the patient lived through. Omission cannot prove its own harmlessness.", "lens": "Avoid circular reasoning from absence in the very source whose completeness is disputed."}, {"id": 52, "argument": "Documentary discontinuity is not experiential discontinuity", "payload": "A later documented disagreement may be the documentary reappearance of a continuing earlier position rather than a new dispute created on the later date.", "question": "Why should a later complaint not automatically be dated from the first later note that records the disagreement?", "options": ["Because patient memory always prevails over documentary chronology.", "Because dates in medical records are unreliable.", "Because all later complaints relate back legally to first treatment.", "Because, if an earlier Protest occurred, the later note may record continuity of the same disagreement rather than its origin."], "correct": "D", "why": "Documentary silence between events does not itself establish experiential silence. Proof of the earlier event remains a separate issue.", "lens": "Distinguish the date an event is documented from the date the underlying state or dispute began."}, {"id": 53, "argument": "Clinical cooperation is not epistemic surrender", "payload": "Continued attendance, medication use, and acceptance of Parkinsonism do not necessarily mean acceptance of every causal allocation in the record.", "question": "What is wrong with treating years of clinical cooperation as proof that the patient accepted the original foot–movement allocation?", "options": ["Patients can never agree with doctors.", "A patient can cooperate with treatment and accept much of the diagnosis while continuing to dispute one unresolved explanatory relationship.", "Only written objections count as disagreement.", "Medication adherence has no evidential value in any context."], "correct": "B", "why": "Engagement in care and agreement with every proposition are different. Conflating them would make continued care conditional on epistemic surrender.", "lens": "Do not infer global assent from conduct that is equally consistent with partial agreement."}, {"id": 54, "argument": "The patient is an evidence source, not a diagnostic authority", "payload": "Patient evidence about chronology, pain, function, baseline, and response matters, but remains subject to clinical interpretation.", "question": "Which formulation best captures the patient’s epistemic role in the framework?", "options": ["Clinical expertise makes patient chronology legally irrelevant.", "The patient supplies unique evidence about lived phenomena, but clinicians retain responsibility for medical interpretation and the model must remain capable of being changed by contrary patient evidence.", "The patient’s interpretation must control whenever it conflicts with clinicians.", "Patient evidence matters only when it confirms the specialist model."], "correct": "B", "why": "The framework rejects both paternalism and patient infallibility. The patient is a source of evidence, not the final diagnostic tribunal.", "lens": "Separate competency to observe facts from competency to supply expert conclusions."}, {"id": 55, "argument": "Confirmatory and contradictory statements need symmetry", "payload": "The fairness issue is not equal weight for all patient statements; it is whether materially contrary patient evidence is preserved and evaluated rather than disappearing while confirmatory material travels.", "question": "What kind of symmetry does the repository demand in handling patient-attributed evidence?", "options": ["Every patient statement must receive identical clinical weight.", "Only statements made in writing should be preserved.", "Contradictory statements must override clinician observations.", "Confirmatory and contradictory material should both remain visible enough to be evaluated, even if they ultimately receive different weight."], "correct": "D", "why": "Symmetry concerns preservation and fair evaluation, not mechanically equal weight.", "lens": "Procedural fairness can require equal opportunity to be considered without requiring equal evidential value."}, {"id": 56, "argument": "Later distress cannot be projected backwards", "payload": "Severe later psychological distress cannot retrospectively explain away an earlier correction signal if the chronology does not support that inference.", "question": "How should later documented psychological distress be handled when evaluating the 2017 Protest?", "options": ["It should be projected backwards as the likely cause of the earlier disagreement.", "It proves the underlying clinical disease caused all later harm.", "It is irrelevant to every issue in the case.", "It may be relevant to later harm or context, but it cannot explain away an earlier event merely because it occurred later."], "correct": "D", "why": "Chronology constrains inference. Later distress may matter, but its causal relation to earlier events must be proved rather than assumed.", "lens": "Temporal sequence is not causation, and later conditions should not be used anachronistically."}, {"id": 57, "argument": "The 2023 misalignment is knowledge-state evidence", "payload": "Once the record itself acknowledges misalignment and reasonable concern, later claims of shared understanding must be tested against that documented knowledge state.", "question": "What does the 2023 acknowledgment of misalignment establish most securely?", "options": ["That by 2023 an active difference of interpretation was documented, making later assertions of longstanding agreement harder to assume without explanation.", "That the original discharge summary was intentionally misleading.", "That the clinician remembered the exact 2017 Protest.", "That the patient’s diagnosis was correct."], "correct": "A", "why": "The note establishes a later knowledge state, not necessarily memory of the earlier event or correctness of one side.", "lens": "When analysing state of knowledge, identify the date at which a fact or dispute becomes demonstrably known."}, {"id": 58, "argument": "The patient cannot be forced to restart history in 2025", "payload": "A formal complaint may be a later procedural expression of an older unresolved issue; lack of earlier documentary preservation should not automatically reset the patient’s knowledge state.", "question": "What is the error in treating the 2025 complaint as though the patient’s dispute necessarily began in 2025?", "options": ["All complaints legally relate back to first treatment.", "It may confuse the date of formal procedure with the date of the underlying disagreement, if earlier notice can be proved.", "Formal complaints have no evidential significance.", "The patient cannot add new issues in 2025."], "correct": "B", "why": "Procedural manifestation and substantive origin are different chronological facts.", "lens": "Do not let the date a dispute enters a formal forum erase evidence that the underlying issue arose earlier."}, {"id": 59, "argument": "Burden should follow notice", "payload": "In a practical evidential sense, once direct notice is established, the inquiry should follow what the responsible service did while corrective options remained.", "question": "What does the principle “burden should follow notice” mean here?", "options": ["The patient no longer has to prove the Protest.", "The institution must prove every later treatment decision was correct.", "The practical evidential focus moves to the response of the service that received the warning while it still had an opportunity to act.", "The legal burden of proof automatically shifts to the clinician."], "correct": "C", "why": "The phrase is not a technical burden-shifting rule. It identifies where the most probative evidence should be sought once notice is established.", "lens": "Distinguish practical evidential focus from formal burdens of proof."}, {"id": 60, "argument": "The patient and decision are one mechanism", "payload": "If the founding decision becomes hard to revise, contrary patient experience can be repeatedly reinterpreted within the decision rather than allowed to change it.", "question": "How are patient epistemic status and model corrigibility linked?", "options": ["A fixed model automatically proves disbelief of the patient.", "If the model is fixed, patient evidence may remain usable as data while losing its capacity to change the architecture interpreting that data.", "The patient and clinician must reach the same diagnosis for care to continue.", "Patient symptoms become legally irrelevant after a specialist decision."], "correct": "B", "why": "The concern is structural: contrary experience can be absorbed by reinterpretation if the decision itself lacks an exit condition.", "lens": "Ask whether evidence can affect the governing model, not merely be redescribed inside it."}, {"id": 61, "argument": "Clinician question: what did the Protest mean to you?", "payload": "The significance of the same words depends on what proposition the clinician understood the patient to be challenging.", "question": "Why is “What did the Protest mean to you?” a threshold question for the originating clinician?", "options": ["Because negligence depends only on the patient’s subjective meaning.", "Because the response required may differ radically depending on whether the clinician understood the concern as untreated corns or as the broader originating problem remaining inadequately explained.", "Because the clinician’s present memory automatically controls the historical facts.", "Because patient wording matters more than all clinical observations."], "correct": "B", "why": "The meaning received by the decision-maker helps define what notice was actually given and what response would have been proportionate.", "lens": "Notice is relational: analyse both what was communicated and what the recipient reasonably understood."}, {"id": 62, "argument": "Clinician question: what did you do after notice?", "payload": "The key missing bridge is concrete post-notice conduct, not a conclusion inferred backwards from the final note.", "question": "What would constitute the strongest answer to “What did you do after notice?”", "options": ["Specific contemporaneous acts such as re-examination, history reconstruction, colleague discussion, explicit uncertainty preservation, or a reasoned decision that further inquiry was unnecessary.", "Evidence that downstream clinicians followed the final summary.", "A later recollection that the patient probably misunderstood.", "A statement that the final discharge summary was comprehensive."], "correct": "A", "why": "The question seeks process evidence occurring in the critical interval, not restatement of the output that the process produced.", "lens": "When process is disputed, ask for acts, dates, and reasoning rather than conclusions."}, {"id": 63, "argument": "Clinician question: what justified separation?", "payload": "Structural pathology and service referral do not themselves establish neurological independence; the clinician should identify relational reasoning.", "question": "Which answer would most directly address the question “What justified separation?”", "options": ["The later genetic diagnosis did not exist yet.", "Podiatry was involved and structural disease was real.", "The patient accepted treatment for Parkinsonism.", "A contemporaneous account of the evidence and reasoning used to decide that the structural foot problem and dystonic-looking phenomenon could be treated as sufficiently separate."], "correct": "D", "why": "The question is about the inferential join between two acknowledged branches, not proof that either branch existed.", "lens": "Demand evidence for the disputed relationship, not evidence for adjacent propositions."}, {"id": 64, "argument": "Clinician question: where did “markedly divorced” come from?", "payload": "Strong patient-attributed separation language has different evidential value depending on whether it is authenticated by earlier sources or emerged during later synthesis.", "question": "Why is the provenance of the phrase “markedly divorced” important?", "options": ["Because independent pre-notice support would strengthen it as patient evidence, whereas wording strengthened during synthesis would have a different provenance and weight.", "Because patient-attributed language is never admissible evidence.", "Because the phrase alone determines the biological relationship.", "Because unusual wording is proof of fabrication."], "correct": "A", "why": "Provenance determines whether the phrase is an independently grounded patient statement or part of the specialist-authored narrative construction.", "lens": "Trace important propositions to their source before assigning them evidential weight."}, {"id": 65, "argument": "Clinician question: why did the Protest not travel?", "payload": "If separation-supporting patient material was worth preserving, the omission of a contrary pre-closure signal requires explanation because it changes what downstream readers can know.", "question": "What makes the non-travel of the Protest analytically important even if the omission was entirely benign?", "options": ["Any omitted patient statement makes the record false.", "The omission alters the informational position of downstream readers by hiding that the patient regarded the originating problem as unresolved.", "Downstream clinicians are responsible for reconstructing every unrecorded conversation.", "The omission proves deliberate concealment."], "correct": "B", "why": "Functional effect precedes motive. Benign omission can still shape the later evidential environment.", "lens": "An innocent cause does not eliminate the need to analyse an omission’s downstream effect."}, {"id": 66, "argument": "Clinician question: what did 2018 mean to you?", "payload": "The issue is what epistemic work the 2018 treatment-state change was allowed to perform, not whether it conclusively proved dystonia.", "question": "What would a satisfactory clinician answer about the 2018 procyclidine event need to explain?", "options": ["Why no later clinician should consider it.", "Whether the event was understood as pressure on the founding separation and, if not, why not; if so, why model-level reconstruction was unnecessary.", "Why the event conclusively proved every foot symptom neurological.", "Whether the patient agreed with the medication change."], "correct": "B", "why": "The question tests the model’s response to boundary-crossing evidence at the time it appeared.", "lens": "Ask how a decision-maker processed contrary evidence, not just whether the evidence existed."}, {"id": 67, "argument": "Clinician question: what did 2020 mean for 2017?", "payload": "A later neurological reclassification in the same territory should prompt an explicit account of whether it was related to or distinct from the earlier phenomenon.", "question": "What is the crucial issue raised by the 2020 “actually parkinsonian” reclassification?", "options": ["It proves all structural pathology was irrelevant.", "It makes the patient’s account conclusive.", "It proves the 2017 phenomenon was identical.", "Whether the clinician considered its relationship to the 2017 dystonic/foot-drop-like observation and, if treating them as different, had a reasoned basis for that distinction."], "correct": "D", "why": "The framework does not assume identity. It asks whether continuity or distinction was actually considered rather than invented retrospectively.", "lens": "A later analogous fact can trigger a duty to explain continuity or distinction without predetermining which is correct."}, {"id": 68, "argument": "Clinician question: what did you know by 2023?", "payload": "Even if the 2017 Protest had been forgotten, the 2023 record establishes an active difference of interpretation that affects later claims of patient agreement.", "question": "Why does the clinician’s knowledge state in 2023 matter to later descriptions of the patient’s position?", "options": ["Because 2023 knowledge proves 2017 memory.", "Because documented misalignment means later assertions that the patient accepted the historical account must be reconciled with a known active disagreement.", "Because all earlier records become irrelevant after 2023.", "Because disagreement itself proves breach."], "correct": "B", "why": "The later note creates a demonstrable knowledge state that constrains how subsequent claims of consensus can be interpreted.", "lens": "Use contemporaneous knowledge-state evidence to test later narratives about what parties understood or accepted."}, {"id": 69, "argument": "Clinician question: why this history in the 2025 defence?", "payload": "The 2025 response should explain why treatment-timing history became the main answer and how it was distinguished from the founding post-notice closure question.", "question": "What is the fairest purpose of asking why the 2025 defence relied so heavily on the levodopa and medication history?", "options": ["To clarify what complaint the clinician believed he was answering and whether treatment timing was analytically distinguished from the older provenance question.", "To prove the clinician intentionally changed the subject.", "To prove the levodopa rationale was false.", "To show longitudinal care is irrelevant."], "correct": "A", "why": "The answer may be completely innocent: this may have been the complaint as understood. The question is designed to clarify scope, not presume evasion.", "lens": "Before alleging non-responsiveness, establish what issue the respondent reasonably understood to be in scope."}, {"id": 70, "argument": "The originating clinician cannot inherit his own record", "payload": "A downstream clinician may know only the chart; an originating clinician who personally participated in an omitted event occupies a different evidential position.", "question": "Why is the originating clinician differently situated from a later doctor who reads only the chart?", "options": ["If he personally participated in a material pre-closure event, documentary silence cannot automatically be treated as the limit of what occurred or was once known.", "The originating clinician’s memory always defeats the written record.", "Later clinicians have no responsibility to read records critically.", "The originating clinician is legally presumed to remember every event forever."], "correct": "A", "why": "The principle distinguishes documentary content, personal participation, present recollection, and current interpretation without presuming bad faith or perfect memory.", "lens": "A witness’s relationship to the source affects what can fairly be inferred from source silence."}, {"id": 71, "argument": "Department question: who owned the unresolved relationship?", "payload": "Parallel specialty ownership of components can leave nobody responsible for the interaction between them.", "question": "Why is departmental ownership of the feet–movement relationship a substantive question rather than a bureaucratic one?", "options": ["Because only one specialty may treat a patient at a time.", "Because Podiatry cannot communicate with Neurology.", "Because someone must remain responsible for noticing and integrating evidence that crosses the boundary between structural foot care and abnormal movement.", "Because service ownership determines legal causation automatically."], "correct": "C", "why": "A multidisciplinary system can manage each component competently while still losing ownership of the join between them.", "lens": "In systems cases, identify responsibility for interfaces, not just responsibility for components."}, {"id": 72, "argument": "Department question: was the join discussed at the case meeting?", "payload": "General discussion of young-onset Parkinsonism does not necessarily establish that the specific feet–dystonia relationship received broader specialist scrutiny.", "question": "What evidence would most directly answer whether the founding relational issue was considered at the complex-case meeting?", "options": ["The later genetic diagnosis.", "The discharge summary’s final conclusion.", "Meeting notes, participants, source material or video showing that the feet–dystonia relationship itself was raised and reasoned through.", "The fact that a meeting occurred."], "correct": "C", "why": "Existence of a multidisciplinary process is not equivalent to proof that the disputed join was within its scope.", "lens": "Do not infer issue-specific scrutiny merely from the existence of a general review forum."}, {"id": 73, "argument": "Department question: what was sent to the external specialist?", "payload": "External independence is question-specific; a genuinely independent Parkinsonism opinion may never have been asked to reconsider the feet–movement relationship.", "question": "Why does the content of the 2017 external referral packet matter?", "options": ["Only genetic questions may be referred externally.", "It determines what question the independent expert actually had an opportunity to assess; independence about Parkinsonism does not imply independent review of an unexported foot–movement issue.", "An external specialist opinion is never independent if it relies on referral material.", "The external specialist’s opinion automatically supersedes local care."], "correct": "B", "why": "Independence attaches to the proposition reviewed. A reviewer cannot independently resolve a question that was never presented.", "lens": "Always ask: independent of whom, based on what materials, and answering which question?"}, {"id": 74, "argument": "Department question: was the video ever revisited?", "payload": "A contemporaneous clinical video could provide unusually valuable phenotype evidence and a concrete route back to the founding observation when later evidence accumulated.", "question": "Why would revisiting a surviving 2017 examination video be especially valuable?", "options": ["It would prove the final diagnosis retrospectively.", "It would eliminate the need for expert interpretation.", "It could provide relatively independent contemporaneous phenotype evidence against which later reclassification, dystonia, and treatment-response developments could be compared.", "Video evidence is automatically more accurate than all clinical notes."], "correct": "C", "why": "The video could reduce dependence on later textual retellings while still requiring expert interpretation.", "lens": "Prioritise primary evidence that can independently test later narrative reconstruction."}, {"id": 75, "argument": "Department question: what mechanism existed for root-model review?", "payload": "A service can be excellent at local adjustments yet lack a process for asking whether an inherited historical model itself should be reconstructed.", "question": "What organisational issue is exposed by asking for the mechanism of “root-model review”?", "options": ["Whether there was any process for revisiting the historical explanatory architecture itself when later evidence accumulated, rather than only adapting treatment within it.", "Whether the patient could request a new diagnosis at every visit.", "Whether clinicians were permitted to read old notes.", "Whether the clinic had authority to change medication."], "correct": "A", "why": "Local adaptability and model-level corrigibility are different system capabilities.", "lens": "System design can create path dependence even without individual cognitive error."}, {"id": 76, "argument": "Governance question: what was actually in scope?", "payload": "A competent answer to a narrow review question cannot later be treated as a determination of a broader issue the review was never designed to test.", "question": "Why are the Terms of Reference central to evaluating a governance review?", "options": ["They determine whether the reviewers were medically qualified.", "They define the question the review was authorised to answer, so a conclusion about longitudinal management cannot automatically resolve a separate challenge to the founding information state.", "They prove that excluded issues lacked merit.", "They make the review legally binding."], "correct": "B", "why": "Scope controls what a review conclusion can fairly be said to determine.", "lens": "Never give a decision broader preclusive force than the issue actually put before the decision-maker."}, {"id": 77, "argument": "Governance question: did reviewers reconstruct the prior?", "payload": "A review that starts from the mature accumulated record may be valid for longitudinal care but less independent as a test of how the founding information state was created.", "question": "What would make a governance review more independent as a test of the 2017 founding allocation?", "options": ["Asking only the original clinician to summarise the history.", "Counting how many later notes repeated the original view.", "Reconstructing the pre-finalisation sequence from primary sources, including referral material, observations, alleged Protest, post-notice acts, and finalisation.", "Beginning with the final discharge summary because it is the specialist source."], "correct": "C", "why": "Reconstructing the prior reduces circular dependence on the mature record whose formation is under challenge.", "lens": "Independent review requires an independent evidential route, not merely a new reviewer reading the same compiled narrative."}, {"id": 78, "argument": "Governance question: how was disputed data handled?", "payload": "Awareness that the evidential foundation is disputed is not enough; review design must prevent circular reliance on the disputed record.", "question": "If reviewers knew the patient disputed the accuracy and future processing of the historical information state, what additional question matters?", "options": ["What operational steps they took to test the dispute without simply relying on the very record whose completeness was challenged.", "Whether the record was legally certified.", "Whether later clinicians had repeated the disputed proposition.", "Whether they agreed with the patient before reviewing the evidence."], "correct": "A", "why": "Awareness and methodological response are different. A fair review needs a non-circular way to handle disputed foundational data.", "lens": "When evidence itself is challenged, examine the review’s method for validating rather than presuming that evidence."}, {"id": 79, "argument": "Governance question: what can make a completed conclusion lose?", "payload": "Institutional finality must coexist with reopening criteria; otherwise a completed conclusion risks becoming unfalsifiable.", "question": "What does a corrigible governance system need in addition to finality?", "options": ["A rule that completed conclusions can never change.", "A principled threshold specifying what kind of new primary evidence, provenance material, diagnosis, or expert analysis could justify reopening or qualification.", "A requirement that the original decision-maker approve any reopening.", "A rule that every later complaint triggers a full rehearing."], "correct": "B", "why": "The question is not whether this case satisfies the threshold, but whether a meaningful threshold exists at all.", "lens": "Finality is legitimate only when paired with principled mechanisms for exceptional correction."}, {"id": 80, "argument": "Historical preservation is not historical immunity", "payload": "A record can remain historically intact while its present epistemic status changes through annotation, qualification, or later evidence.", "question": "What is the difference between preserving a historical clinical opinion and granting it historical immunity?", "options": ["Immunity is required whenever a record is contemporaneous.", "
